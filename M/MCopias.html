<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos - Copias</title>
    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B981;
            --danger: #EF4444;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #9CA3AF;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.8rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        /* Responsive Form */
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
            color: #4B5563;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .btn-principal {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-principal:hover { background-color: #4338CA; }

        /* Responsive Table */
        .table-container {
            width: 100%;
            overflow-x: auto; /* Permite deslizar la tabla en celulares */
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px; /* Asegura que no se aplaste en celulares */
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background-color: var(--primary);
            color: white;
            white-space: nowrap;
        }

        .vuelto { color: var(--success); font-weight: bold; }
        .deuda { color: var(--danger); font-weight: bold; }
        
        /* Estilos para el estado Saldado */
        .row-saldado {
            background-color: #F9FAFB;
        }
        .row-saldado td {
            color: var(--text-muted);
            text-decoration: line-through;
        }
        
        /* Botón de acción en la tabla */
        .btn-accion {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-accion.saldado {
            background-color: var(--text-muted);
            cursor: default;
        }

        .btn-accion:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="container">
        <h1>💸 Control de Pagos</h1>
        
        <!-- Formulario -->
        <div class="card">
            <form id="paymentForm">
                <div class="form-group">
                    <div>
                        <label for="payer">¿Quién entrega el dinero?</label>
                        <input type="text" id="payer" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div>
                        <label for="beneficiaries">¿Para quién(es) paga?</label>
                        <input type="text" id="beneficiaries" placeholder="Ej: Juan, Ana y Luis">
                    </div>
                    <div>
                        <label for="amountRequired">Total pedido ($)</label>
                        <input type="number" id="amountRequired" placeholder="Ej: 6000" min="0" required>
                    </div>
                    <div>
                        <label for="amountPaid">Monto entregado ($)</label>
                        <input type="number" id="amountPaid" placeholder="Ej: 10000" min="0" required>
                    </div>
                </div>
                <button type="submit" class="btn-principal">Registrar Pago</button>
            </form>
        </div>

        <!-- Contenedor adaptativo para la tabla -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Estudiante / Grupo</th>
                        <th>Costo</th>
                        <th>Entregó</th>
                        <th>Vuelto</th>
                        <th>Deuda</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Los registros se cargan desde Javascript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. Cargar datos guardados o crear lista vacía
        let registros = JSON.parse(localStorage.getItem('pagosCopias')) || [];
        const form = document.getElementById('paymentForm');
        const tableBody = document.getElementById('tableBody');

        // 2. Función para mostrar los datos en la tabla
        function renderizarTabla() {
            tableBody.innerHTML = '';

            registros.forEach((registro, index) => {
                const row = document.createElement('tr');
                
                // Si ya se saldó, le aplicamos la clase para que se vea gris y tachado
                if (registro.saldado) {
                    row.className = 'row-saldado';
                }

                // Definimos cómo se verá el botón dependiendo del estado
                const botonHTML = registro.saldado 
                    ? `<button class="btn-accion saldado" onclick="cambiarEstado(${index})" title="Deshacer">✅ Ya regresado</button>`
                    : `<button class="btn-accion" onclick="cambiarEstado(${index})">Devolver / Saldar</button>`;

                row.innerHTML = `
                    <td>
                        <strong>${registro.pagador}</strong><br>
                        <small style="color: #6B7280">${registro.beneficiarios}</small>
                    </td>
                    <td>$${registro.costo.toLocaleString()}</td>
                    <td>$${registro.entregado.toLocaleString()}</td>
                    <td class="${registro.saldado ? '' : 'vuelto'}">$${registro.vuelto.toLocaleString()}</td>
                    <td class="${registro.saldado ? '' : 'deuda'}">$${registro.deuda.toLocaleString()}</td>
                    <td>${botonHTML}</td>
                `;

                tableBody.appendChild(row);
            });
        }

        // 3. Registrar un nuevo pago
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const payer = document.getElementById('payer').value;
            let beneficiaries = document.getElementById('beneficiaries').value || payer;
            const amountRequired = parseFloat(document.getElementById('amountRequired').value);
            const amountPaid = parseFloat(document.getElementById('amountPaid').value);

            let change = amountPaid > amountRequired ? amountPaid - amountRequired : 0;
            let debt = amountRequired > amountPaid ? amountRequired - amountPaid : 0;

            // Creamos el objeto con los datos
            const nuevoRegistro = {
                pagador: payer,
                beneficiarios: beneficiaries,
                costo: amountRequired,
                entregado: amountPaid,
                vuelto: change,
                deuda: debt,
                saldado: false // Por defecto entra como pendiente
            };

            // Lo agregamos a la lista y guardamos
            registros.unshift(nuevoRegistro); // unshift lo pone de primero en la lista
            guardarDatos();
            renderizarTabla();

            form.reset();
            document.getElementById('payer').focus();
        });

        // 4. Función para marcar como "Ya regresado" o deshacerlo
        window.cambiarEstado = function(index) {
            registros[index].saldado = !registros[index].saldado; // Cambia entre true y false
            guardarDatos();
            renderizarTabla();
        };

        // 5. Guardar en la memoria del navegador
        function guardarDatos() {
            localStorage.setItem('pagosCopias', JSON.stringify(registros));
        }

        // Mostrar los datos la primera vez que se abre la página
        renderizarTabla();
    </script>

</body>
</html>
