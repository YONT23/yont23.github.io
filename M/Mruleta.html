<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mruleta</title>
    <!-- Agregamos la librería Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-muted: #666666;
            --accent-blue: #0056b3;
            --accent-red: #d32f2f;
            --border-light: #e5e5e5;
            --bg-panel: #f9f9f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 10px 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent-red);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 50px;
            font-weight: 300;
        }

        .dashboard {
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        textarea, input[type="number"] {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 15px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        
        textarea {
            height: 180px;
            resize: vertical;
        }

        textarea:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.1);
        }

        #contador {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
            text-align: right;
            margin-top: -5px;
        }

        .btn-spin {
            background: var(--text-main);
            color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 18px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: auto;
        }

        .btn-spin:hover {
            background: var(--accent-blue);
        }
        
        .btn-spin:active {
            transform: scale(0.98);
        }
        
        .btn-spin:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            margin-top: 40px;
        }

        .card {
            background: var(--bg-color);
            border: 1px solid var(--border-light);
            width: 260px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            opacity: 0; /* Oculto inicialmente para Anime.js */
        }

        .card-header {
            background: var(--text-main);
            color: var(--bg-color);
            padding: 15px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header.blue-header {
            background: var(--accent-blue);
        }

        .card-header span {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0;
            text-transform: none;
        }

        .card-body {
            padding: 0;
            list-style: none;
            margin: 0;
            min-height: 50px;
        }

        .card-body li {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            color: var(--text-main);
            opacity: 0; /* Oculto inicialmente para Anime.js */
        }
        
        .card-body li:last-child {
            border-bottom: none;
        }

        .card-body li::before {
            content: '■';
            color: var(--accent-red);
            font-size: 0.5rem;
            margin-right: 12px;
        }
    </style>
</head>
<body>
    <h1>Mruleta<span>.</span></h1>
    <p class="subtitle">Sorteo en vivo de equipos</p>

    <div class="dashboard">
        <div class="col">
            <label>Jugadores (uno por línea)</label>
            <textarea id="nombres">Barrios Nicoll
Gomez Jesus
Hernandez Thomas
Liñan Samuel
Londoño Samuel
Mejía Ilder
Oviedo Matias
Perez Edier
Pestana Francheska
Vidal Liz
Sharon</textarea>
            <div id="contador">11 jugadores en sala</div>
        </div>
        
        <div class="col">
            <label>Personas por grupo</label>
            <input type="number" id="personasGrupo" value="4" min="1">
            
            <button class="btn-spin" id="btnGirar" onclick="girarMruleta()">Sorteo en vivo</button>
        </div>
    </div>
    
    <div class="results" id="resultados"></div>

    <script>
        // Actualizar contador de texto
        document.getElementById('nombres').addEventListener('input', function() {
            const count = this.value.split('\n').filter(n => n.trim() !== '').length;
            document.getElementById('contador').textContent = count + ' jugadores en sala';
        });

        // Función para desordenar arreglos (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function girarMruleta() {
            const resultados = document.getElementById('resultados');
            const btn = document.getElementById('btnGirar');
            const inputNombres = document.getElementById('nombres').value;
            const limit = parseInt(document.getElementById('personasGrupo').value);
            
            let jugadores = inputNombres.split('\n').map(n => n.trim()).filter(n => n !== '');
            
            // Validaciones
            if (jugadores.length === 0) {
                alert('La sala está vacía. Agrega al menos un jugador.');
                return;
            }
            if (isNaN(limit) || limit < 1) {
                alert('El número de personas por mesa debe ser al menos 1.');
                return;
            }

            // Desactivar el botón mientras ocurre la animación
            btn.disabled = true;
            btn.textContent = "Sorteando...";
            resultados.innerHTML = '';
            
            // 1. Mezclar jugadores
            jugadores = shuffle(jugadores);
            
            // 2. Dividir por cantidad de personas por grupo
            let grupos = [];
            for (let i = 0; i < jugadores.length; i += limit) {
                grupos.push(jugadores.slice(i, i + limit));
            }
            
            // 3. Crear las tarjetas y los elementos de lista ocultos en el DOM
            grupos.forEach((grupo, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const header = document.createElement('div');
                header.className = index % 2 !== 0 ? 'card-header blue-header' : 'card-header';
                header.innerHTML = `Mesa ${index + 1} <span>${grupo.length} Jugadores</span>`;
                
                const ul = document.createElement('ul');
                ul.className = 'card-body';
                
                grupo.forEach(jugador => {
                    const li = document.createElement('li');
                    li.className = 'jugador-item'; // Clase clave para la animación
                    li.textContent = jugador;
                    ul.appendChild(li);
                });
                
                card.appendChild(header);
                card.appendChild(ul);
                resultados.appendChild(card);
            });

            // 4. ANIMACIÓN CON ANIME.JS
            
            // Paso A: Hacer que las tarjetas (Mesas vacías) aparezcan primero
            anime({
                targets: '.card',
                translateY: [40, 0],
                opacity: [0, 1],
                delay: anime.stagger(150),
                easing: 'easeOutExpo',
                duration: 800
            });

            // Paso B: Recolectar todos los nombres (<li>) y desordenar los nodos en un array
            // Esto es el truco para que parezca que caen aleatoriamente en distintas mesas
            let elementosJugadores = Array.from(document.querySelectorAll('.jugador-item'));
            elementosJugadores = shuffle(elementosJugadores);

            // Paso C: Animar la entrada de cada nombre uno por uno al azar
            anime({
                targets: elementosJugadores,
                translateX: [-30, 0], // Vienen desde la izquierda
                opacity: [0, 1],
                delay: anime.stagger(200, {start: 600}), // Comienzan después de que aparecen las mesas
                easing: 'easeOutElastic(1, .8)',
                duration: 900,
                complete: function() {
                    // Reactivar el botón al terminar
                    btn.disabled = false;
                    btn.textContent = "Girar Mruleta";
                }
            });
        }
    </script>
</body>
</html>
