<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor de Aura Acumulable</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .contenedor {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .botones {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-aura {
            background-color: #4CAF50;
            color: white;
        }
        .btn-aura:hover {
            background-color: #45a049;
        }
        .btn-sin-aura {
            background-color: #f44336;
            color: white;
        }
        .btn-sin-aura:hover {
            background-color: #da190b;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #eee;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            transition: 0.3s;
        }
        .con-aura {
            color: #2e7d32;
            font-weight: bold;
        }
        .sin-aura {
            color: #c62828;
            font-weight: bold;
        }
        .neutro {
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>✨ Registro de Aura Acumulable ✨</h1>
        
        <input type="text" id="nombreAlumno" placeholder="Escribe el nombre del alumno...">
        
        <div class="botones">
            <button class="btn-aura" onclick="modificarAura(true)">+1000 Aura ✨</button>
            <button class="btn-sin-aura" onclick="modificarAura(false)">-1000 Aura 💀</button>
        </div>

        <ul id="listaAlumnos">
            <!-- Aquí aparecerán los alumnos -->
        </ul>
    </div>

    <script>
        // Objeto para guardar la memoria de los alumnos y sus puntos
        let baseDeDatosAlumnos = {};

        function modificarAura(sumaAura) {
            const input = document.getElementById('nombreAlumno');
            const nombreOriginal = input.value.trim();

            if (nombreOriginal === "") {
                alert("¡Oye! Primero escribe el nombre del alumno.");
                return;
            }

            // Convertimos el nombre a minúsculas para que "Juan" y "juan" sean el mismo alumno
            const nombreClave = nombreOriginal.toLowerCase();
            const puntosAModificar = sumaAura ? 1000 : -1000;

            // Si el alumno ya existe, le sumamos/restamos. Si no, lo creamos.
            if (baseDeDatosAlumnos[nombreClave]) {
                baseDeDatosAlumnos[nombreClave].puntos += puntosAModificar;
            } else {
                baseDeDatosAlumnos[nombreClave] = {
                    nombreDisplay: nombreOriginal,
                    puntos: puntosAModificar
                };
            }

            actualizarPantalla();
            
            // Limpiar input
            input.value = "";
            input.focus();
        }

        function actualizarPantalla() {
            const lista = document.getElementById('listaAlumnos');
            lista.innerHTML = ""; // Limpiamos la lista para volver a dibujarla con los datos actualizados

            // Recorremos todos los alumnos guardados
            for (let clave in baseDeDatosAlumnos) {
                let alumno = baseDeDatosAlumnos[clave];
                let li = document.createElement('li');

                // Decidimos los colores y emojis dependiendo de si está en positivo o negativo
                let estilo = "";
                let textoPuntos = "";

                if (alumno.puntos > 0) {
                    estilo = "con-aura";
                    textoPuntos = `+${alumno.puntos} Aura ✨`;
                } else if (alumno.puntos < 0) {
                    estilo = "sin-aura";
                    textoPuntos = `${alumno.puntos} Aura 💀`;
                } else {
                    estilo = "neutro";
                    textoPuntos = `0 Aura 😐`;
                }

                li.innerHTML = `<span>${alumno.nombreDisplay}</span> <span class="${estilo}">${textoPuntos}</span>`;
                
                // Los agregamos a la lista
                lista.prepend(li);
            }
        }
    </script>

</body>
</html>
