<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quién Quiere Ser Emprendedor? | I.E. Siglo XXI</title>
<style>
  :root{
    --navy-deep:#061733; --navy:#0c2451; --navy-mid:#123a7a;
    --blue:#1565c0; --blue-light:#4fa8e0; --white:#ffffff; --off-white:#eaf2fb;
    --gold-glow:#ffd24d; --danger:#e5243b; --success:#2fa84f;
    --radius:14px; --shadow-deep:0 20px 50px rgba(0,0,0,.45); font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, #1a3d7c 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, #0a1f45 0%, transparent 60%),
      linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-deep) 100%);
    color:var(--off-white); min-height:100vh; display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif; margin:0; letter-spacing:.3px;}

  .top-bar{width:100%;display:flex;justify-content:center;padding:18px 16px 10px;}
  .brand{display:flex;align-items:center;gap:12px;max-width:900px;width:100%;}
  .emblem{flex:0 0 auto;width:54px;height:54px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%, var(--blue-light), var(--blue) 60%, var(--navy-deep));border:2px solid var(--gold-glow);display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,210,77,.35);}
  .emblem img{width:88%;height:88%;object-fit:contain;}
  .brand-text{line-height:1.15;}
  .brand-text .school{font-size:.72rem;letter-spacing:1.5px;color:var(--blue-light);text-transform:uppercase;font-weight:700;}
  .brand-text .motto{font-size:.78rem;color:var(--off-white);opacity:.85;font-style:italic;margin-top:2px;}

  .screen{width:100%;max-width:1000px;padding:10px 16px 40px;display:none;flex-direction:column;align-items:center;animation:fadeIn .5s ease;}
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .start-shield-wrap{position:relative;width:150px;margin:10px auto 0;}
  .start-shield-glow{position:absolute;inset:-40px;background:radial-gradient(circle, rgba(79,168,224,.55) 0%, rgba(21,101,192,.3) 45%, transparent 72%);filter:blur(22px);z-index:0;border-radius:50%;}
  .start-shield{position:relative;z-index:1;width:100%;display:block;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5));-webkit-mask-image:radial-gradient(ellipse 66% 60% at 50% 48%, black 80%, transparent 100%);mask-image:radial-gradient(ellipse 66% 60% at 50% 48%, black 80%, transparent 100%);}

  .hero-title{text-align:center;font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin-top:18px;background:linear-gradient(90deg,var(--white),var(--blue-light),var(--white));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(79,168,224,.25);}
  .hero-sub{text-align:center;max-width:620px;color:var(--off-white);opacity:.85;margin:14px auto 6px;font-size:1rem;line-height:1.5;}
  .hero-motto-strip{margin:22px 0 8px;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);font-size:.92rem;letter-spacing:.5px;color:var(--gold-glow);}
  .ods-strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:620px;margin:18px 0 26px;}
  .ods-dot{width:14px;height:14px;border-radius:4px;}
  .name-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:20px 22px;max-width:420px;width:100%;margin-bottom:18px;}
  .name-card label{display:block;font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:var(--blue-light);font-weight:700;margin-bottom:8px;text-align:center;}
  .name-input{width:100%;padding:13px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:var(--white);font-size:1rem;font-family:inherit;text-align:center;outline:none;transition:border-color .15s ease;}
  .name-input:focus{border-color:var(--blue-light);}
  .name-input.error{border-color:var(--danger);animation:shake .3s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .name-hint{font-size:.72rem;color:var(--off-white);opacity:.6;text-align:center;margin-top:6px;}

  .rules-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:20px 22px;max-width:620px;width:100%;margin-bottom:26px;}
  .rules-card h3{color:var(--blue-light);font-size:.95rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
  .rules-card ul{margin:0;padding-left:20px;font-size:.92rem;line-height:1.7;color:var(--off-white);opacity:.9;}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:999px;padding:15px 38px;font-size:1.05rem;background:linear-gradient(90deg,var(--blue),var(--blue-light));color:var(--white);box-shadow:0 10px 25px rgba(21,101,192,.4);transition:transform .15s ease, box-shadow .15s ease;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(21,101,192,.55);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);box-shadow:none;}
  .btn.small{padding:9px 18px;font-size:.85rem;}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}

  .game-wrap{width:100%;display:flex;gap:22px;align-items:flex-start;justify-content:center;}
  .game-main{flex:1 1 560px;max-width:640px;min-width:0;}
  .ladder-panel{flex:0 0 190px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:12px 10px;max-height:560px;overflow-y:auto;}
  .ladder-title{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue-light);text-align:center;margin-bottom:8px;font-weight:700;}
  .ladder-row{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-radius:8px;margin-bottom:3px;font-size:.82rem;font-weight:600;color:rgba(234,242,251,.55);}
  .ladder-row .lvl-num{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:#fff;flex:0 0 auto;margin-right:6px;opacity:.7;}
  .ladder-row.current{background:linear-gradient(90deg,rgba(255,210,77,.18),transparent);color:var(--gold-glow);border:1px solid rgba(255,210,77,.4);}
  .ladder-row.current .lvl-num{opacity:1;box-shadow:0 0 10px rgba(255,210,77,.5);}
  .ladder-row.passed{color:var(--off-white);}
  .ladder-row.checkpoint{border-bottom:1px dashed rgba(255,210,77,.4);}

  .mobile-progress{display:none;width:100%;margin-bottom:14px;}
  .mobile-progress .track{display:flex;gap:3px;}
  .mobile-progress .seg{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);}
  .mobile-progress .seg.done{background:var(--blue-light);}
  .mobile-progress .seg.now{background:var(--gold-glow);}
  .mobile-progress .label{font-size:.78rem;color:var(--gold-glow);margin-top:6px;text-align:center;font-weight:700;}

  .lifelines{display:flex;gap:10px;justify-content:center;margin-bottom:16px;}
  .lifeline-btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.25);color:var(--off-white);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease;}
  .lifeline-btn:hover:not(:disabled){background:rgba(79,168,224,.25);border-color:var(--blue-light);transform:scale(1.06);}
  .lifeline-btn:disabled{opacity:.25;cursor:not-allowed;text-decoration:line-through;}

  .level-tag{text-align:center;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--white);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .ods-badge{padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:800;color:#fff;}

  .timer-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .timer-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;}
  .timer-fill{height:100%;background:linear-gradient(90deg,var(--success),var(--gold-glow),var(--danger));width:100%;transition:width 1s linear;}
  .timer-num{min-width:38px;text-align:right;font-weight:800;font-size:.9rem;color:var(--off-white);font-variant-numeric:tabular-nums;}
  .timer-num.warn{color:var(--gold-glow);}
  .timer-num.danger{color:var(--danger);}

  .question-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);padding:24px 22px;text-align:center;font-size:clamp(1.02rem,2.6vw,1.25rem);font-weight:600;line-height:1.5;margin-bottom:18px;box-shadow:var(--shadow-deep);min-height:96px;display:flex;align-items:center;justify-content:center;}

  .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .answer-btn{text-align:left;padding:14px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:var(--off-white);font-size:.95rem;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center;transition:all .15s ease;min-height:56px;}
  .answer-btn .letter{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:rgba(79,168,224,.25);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--blue-light);}
  .answer-btn:hover:not(:disabled){border-color:var(--blue-light);background:rgba(21,101,192,.22);}
  .answer-btn:disabled{cursor:not-allowed;}
  .answer-btn.selected{border-color:var(--gold-glow);background:rgba(255,210,77,.18);animation:pulse 1s infinite;}
  .answer-btn.correct{border-color:var(--success);background:rgba(47,168,79,.35);animation:none;}
  .answer-btn.wrong{border-color:var(--danger);background:rgba(229,36,59,.35);animation:none;}
  .answer-btn.faded{opacity:.2;pointer-events:none;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,210,77,.5);}50%{box-shadow:0 0 16px rgba(255,210,77,.6);}}

  .action-row{display:flex;justify-content:center;gap:12px;margin-top:20px;}

  .hint-box{margin-top:14px;padding:12px 16px;border-radius:10px;background:rgba(79,168,224,.12);border:1px dashed var(--blue-light);font-size:.88rem;color:var(--off-white);text-align:center;display:none;}
  .hint-box.show{display:block;}

  .poll-box{margin-top:14px;display:none;}
  .poll-box.show{display:block;}
  .poll-row{display:flex;align-items:center;gap:8px;font-size:.8rem;margin-bottom:6px;}
  .poll-row .poll-letter{width:16px;font-weight:800;color:var(--blue-light);}
  .poll-bar-track{flex:1;height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;}
  .poll-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-light));width:0%;transition:width .8s ease;}
  .poll-pct{width:32px;text-align:right;font-size:.75rem;color:var(--off-white);opacity:.8;}

  .levelup-overlay{position:fixed;inset:0;background:rgba(6,23,51,.9);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:999;padding:16px;}
  .levelup-overlay.show{display:flex;animation:fadeIn .25s ease;}
  .levelup-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:24px 22px 22px;width:min(92vw,380px);text-align:center;box-shadow:var(--shadow-deep);}
  .levelup-heading{font-size:1.1rem;font-weight:800;color:var(--white);margin-bottom:2px;}
  .levelup-points{font-size:1.9rem;font-weight:900;color:var(--gold-glow);margin:4px 0 14px;text-shadow:0 0 20px rgba(255,210,77,.4);}
  .podium-wrap{max-height:230px;overflow-y:auto;margin:0 auto 14px;padding-right:2px;}
  .podium-ladder{display:flex;flex-direction:column-reverse;gap:3px;}
  .podium-step{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;background:rgba(255,255,255,.04);font-size:.68rem;font-weight:700;color:rgba(234,242,251,.35);transition:background .3s ease, color .3s ease, transform .3s ease;}
  .podium-step .step-num{width:17px;height:17px;border-radius:4px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#fff;opacity:.35;}
  .podium-step.reached{color:var(--off-white);background:rgba(255,255,255,.06);}
  .podium-step.reached .step-num{opacity:1;}
  .podium-step.current{background:rgba(255,210,77,.16);color:var(--gold-glow);transform:scale(1.06);box-shadow:0 0 16px rgba(255,210,77,.25);animation:bounceStep .5s ease;}
  .podium-step.current .step-num{opacity:1;box-shadow:0 0 8px rgba(255,210,77,.6);}
  @keyframes bounceStep{0%{transform:scale(.82);opacity:.4;}60%{transform:scale(1.14);}100%{transform:scale(1.06);}}
  .levelup-total{font-size:.82rem;color:var(--off-white);opacity:.85;margin-bottom:16px;}
  .levelup-total span{font-weight:800;color:var(--white);}

  .end-badge{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;margin:10px 0 18px;border:3px solid var(--gold-glow);box-shadow:0 0 40px rgba(255,210,77,.35);}
  .end-title{text-align:center;font-size:clamp(1.5rem,4.5vw,2.2rem);margin-bottom:8px;}
  .end-sub{text-align:center;max-width:560px;color:var(--off-white);opacity:.85;line-height:1.6;margin-bottom:6px;}
  .end-points{font-size:1.6rem;font-weight:900;color:var(--gold-glow);margin:14px 0;}
  .end-ods-recap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:600px;margin:14px 0 22px;}
  .end-ods-recap span{padding:5px 12px;border-radius:999px;font-size:.72rem;font-weight:700;color:#fff;}

  .leaderboard-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:18px 20px;max-width:460px;width:100%;margin-bottom:22px;}
  .leaderboard-card h3{color:var(--blue-light);font-size:.85rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;text-align:center;}
  .leaderboard-list{max-height:280px;overflow-y:auto;}
  .lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:4px;font-size:.88rem;}
  .lb-row .lb-pos{width:24px;flex:0 0 auto;font-weight:800;color:var(--blue-light);text-align:center;}
  .lb-row .lb-name{flex:1;font-weight:600;color:var(--off-white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-row .lb-pts{font-weight:800;color:var(--gold-glow);font-variant-numeric:tabular-nums;}
  .lb-row.me{background:rgba(255,210,77,.14);border:1px solid rgba(255,210,77,.4);}
  .lb-empty{text-align:center;font-size:.82rem;color:var(--off-white);opacity:.6;padding:10px;}

  footer{margin-top:auto;padding:20px;text-align:center;font-size:.75rem;color:rgba(234,242,251,.5);}

  @media (max-width:760px){
    .ladder-panel{display:none;}
    .mobile-progress{display:block;}
    .answers{grid-template-columns:1fr;}
    .lifeline-btn{width:46px;height:46px;font-size:.65rem;}
  }
</style>
</head>
