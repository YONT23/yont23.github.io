<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Universal a Markdown</title>
    
    <!-- Librerías para procesar los archivos en el cliente -->
    <!-- Mammoth (Para leer .docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- Turndown (Para convertir HTML a Markdown) -->
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <!-- SheetJS (Para leer .xlsx y .csv) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Tesseract.js (Para leer texto de imágenes OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }

        p.subtitle {
            text-align: center;
            color: #6B7280;
            margin-bottom: 2rem;
        }

        .upload-area {
            border: 2px dashed #D1D5DB;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            background-color: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        .custom-file-upload:hover {
            background-color: var(--primary-hover);
        }

        .output-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            font-family: "Courier New", Courier, monospace;
            resize: vertical;
            box-sizing: border-box;
        }

        .btn-copy {
            background-color: #10B981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            align-self: flex-end;
        }

        .btn-copy:hover {
            background-color: #059669;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
        }
        
        #progress {
            font-size: 0.85rem;
            color: #6B7280;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Conversor a Markdown</h1>
    <p class="subtitle">Soporta: <b>.docx</b> (Word), <b>.xlsx</b> (Excel) e <b>Imágenes</b> (PNG, JPG para extraer texto)</p>

    <div class="upload-area">
        <!-- Actualizamos el accept para permitir imágenes -->
        <label for="fileInput" class="custom-file-upload">
            Seleccionar Archivo
        </label>
        <input type="file" id="fileInput" accept=".docx,.xlsx,.png,.jpg,.jpeg" />
        <p id="fileName" style="margin-top: 15px; color: #6B7280;">Ningún archivo seleccionado</p>
    </div>

    <div id="status"></div>
    <div id="progress"></div> <!-- Para mostrar el porcentaje al escanear imágenes -->

    <div class="output-area">
        <label for="markdownOutput"><b>Resultado Markdown / Texto:</b></label>
        <textarea id="markdownOutput" placeholder="El código aparecerá aquí..."></textarea>
        <button class="btn-copy" onclick="copyToClipboard()">Copiar al Portapapeles</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');
    const markdownOutput = document.getElementById('markdownOutput');
    const statusDisplay = document.getElementById('status');
    const progressDisplay = document.getElementById('progress');

    // Inicializar Turndown (Conversor HTML a Markdown)
    const turndownService = new TurndownService({ headingStyle: 'atx' });

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        fileNameDisplay.textContent = `Archivo cargado: ${file.name}`;
        statusDisplay.textContent = "Procesando...";
        progressDisplay.textContent = "";
        markdownOutput.value = "";

        const extension = file.name.split('.').pop().toLowerCase();

        if (extension === 'docx') {
            processWord(file);
        } else if (extension === 'xlsx') {
            processExcel(file);
        } else if (['png', 'jpg', 'jpeg'].includes(extension)) {
            processImage(file);
        } else {
            statusDisplay.textContent = "❌ Formato no soportado en esta demo.";
        }
    });

    // --- PROCESAR WORD (.docx) ---
    function processWord(file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const arrayBuffer = event.target.result;
            mammoth.convertToHtml({arrayBuffer: arrayBuffer})
                .then(function(result){
                    const html = result.value; 
                    const markdown = turndownService.turndown(html);
                    markdownOutput.value = markdown;
                    statusDisplay.textContent = "✅ Conversión exitosa (Word a MD)";
                })
                .catch(function(err){
                    statusDisplay.textContent = "❌ Error procesando el documento Word.";
                    console.error(err);
                });
        };
        reader.readAsArrayBuffer(file);
    }

    // --- PROCESAR EXCEL (.xlsx) ---
    function processExcel(file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
            
            if(jsonData.length === 0) {
                statusDisplay.textContent = "La hoja de Excel está vacía.";
                return;
            }

            let mdTable = "";
            const headers = jsonData[0];
            mdTable += "| " + headers.join(" | ") + " |\n";
            const separator = headers.map(() => "---");
            mdTable += "| " + separator.join(" | ") + " |\n";
            
            for(let i = 1; i < jsonData.length; i++) {
                const row = jsonData[i];
                while(row.length < headers.length) row.push("");
                mdTable += "| " + row.join(" | ") + " |\n";
            }

            markdownOutput.value = mdTable;
            statusDisplay.textContent = "✅ Conversión exitosa (Excel a MD)";
        };
        reader.readAsArrayBuffer(file);
    }

    // --- PROCESAR IMAGEN (OCR con Tesseract.js) ---
    function processImage(file) {
        statusDisplay.textContent = "Escaneando imagen (esto puede tardar unos segundos)...";
        
        // Configuramos Tesseract para español ('spa')
        Tesseract.recognize(
            file,
            'spa', // Puedes cambiar a 'eng' para inglés, o 'spa+eng' para ambos
            { 
                // Esta función nos permite ver el progreso del escaneo
                logger: m => {
                    if (m.status === 'recognizing text') {
                        const percent = Math.round(m.progress * 100);
                        progressDisplay.textContent = `Progreso: ${percent}%`;
                    }
                }
            }
        ).then(({ data: { text } }) => {
            markdownOutput.value = text;
            statusDisplay.textContent = "✅ Texto extraído de la imagen con éxito";
            progressDisplay.textContent = "";
        }).catch(err => {
            statusDisplay.textContent = "❌ Error procesando la imagen.";
            progressDisplay.textContent = "";
            console.error(err);
        });
    }

    // Función para copiar al portapapeles
    function copyToClipboard() {
        markdownOutput.select();
        document.execCommand("copy");
        alert("¡Copiado al portapapeles!");
    }
</script>

</body>
</html>
