<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mruleta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-muted: #666666;
            --accent-blue: #0056b3;
            --accent-red: #d32f2f;
            --border-light: #e5e5e5;
            --bg-panel: #f9f9f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 10px 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent-red);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 50px;
            font-weight: 300;
        }

        .dashboard {
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        textarea, input[type="number"] {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 15px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        
        textarea {
            height: 180px;
            resize: vertical;
        }

        textarea:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.1);
        }

        #contador {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
            text-align: right;
            margin-top: -5px;
        }

        .btn-spin {
            background: var(--text-main);
            color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 18px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: auto;
        }

        .btn-spin:hover {
            background: var(--accent-blue);
        }
        
        .btn-spin:active {
            transform: scale(0.98);
        }

        .loader-container {
            height: 60px;
            margin: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .roulette-loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-light);
            border-top: 4px solid var(--accent-red);
            border-right: 4px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--bg-color);
            border: 1px solid var(--border-light);
            width: 260px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.4s forwards ease-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            background: var(--text-main);
            color: var(--bg-color);
            padding: 15px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header.blue-header {
            background: var(--accent-blue);
        }

        .card-header span {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0;
            text-transform: none;
        }

        .card-body {
            padding: 0;
            list-style: none;
            margin: 0;
        }

        .card-body li {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            color: var(--text-main);
        }
        
        .card-body li:last-child {
            border-bottom: none;
        }

        .card-body li::before {
            content: '■';
            color: var(--accent-red);
            font-size: 0.5rem;
            margin-right: 12px;
        }
    </style>
</head>
<body>
    <h1>Mruleta<span>.</span></h1>
    <p class="subtitle">Asignación aleatoria de equipos</p>

    <div class="dashboard">
        <div class="col">
            <label>Jugadores (uno por línea)</label>
            <textarea id="nombres">Barrios Nicoll
Gomez Jesus
Hernandez Thomas
Liñan Samuel
Londoño Samuel
Mejía Ilder
Oviedo Matias
Perez Edier
Pestana Francheska
Vidal Liz
Sharon</textarea>
            <div id="contador">11 jugadores en sala</div>
        </div>
        
        <div class="col">
            <label>Personas por grupo</label>
            <input type="number" id="personasGrupo" value="4" min="1">
            
            <button class="btn-spin" onclick="girarMruleta()">Girar Mruleta</button>
        </div>
    </div>

    <div class="loader-container">
        <div class="roulette-loader" id="loader"></div>
    </div>
    
    <div class="results" id="resultados"></div>

    <script>
        // Actualizar contador
        document.getElementById('nombres').addEventListener('input', function() {
            const count = this.value.split('\n').filter(n => n.trim() !== '').length;
            document.getElementById('contador').textContent = count + ' jugadores en sala';
        });

        // Algoritmo Fisher-Yates para mezclar
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function girarMruleta() {
            const resultados = document.getElementById('resultados');
            const loader = document.getElementById('loader');
            
            // Limpiar resultados anteriores
            resultados.innerHTML = '';
            
            const inputNombres = document.getElementById('nombres').value;
            const limit = parseInt(document.getElementById('personasGrupo').value);
            
            let jugadores = inputNombres.split('\n').map(n => n.trim()).filter(n => n !== '');
            
            // Validaciones
            if (jugadores.length === 0) {
                alert('La sala está vacía. Agrega al menos un jugador.');
                return;
            }
            if (isNaN(limit) || limit < 1) {
                alert('El número de personas por mesa debe ser al menos 1.');
                return;
            }

            // Mostrar animación
            loader.style.display = 'block';
            
            setTimeout(() => {
                loader.style.display = 'none';
                
                // 1. Mezclar jugadores
                jugadores = shuffle(jugadores);
                
                // 2. Dividir por cantidad de personas por grupo
                let grupos = [];
                for (let i = 0; i < jugadores.length; i += limit) {
                    grupos.push(jugadores.slice(i, i + limit));
                }
                
                // 3. Renderizar
                grupos.forEach((grupo, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.animationDelay = (index * 0.1) + 's';
                    
                    const header = document.createElement('div');
                    // Alternar color del header (negro y azul) para más dinamismo dentro del minimalismo
                    header.className = index % 2 !== 0 ? 'card-header blue-header' : 'card-header';
                    header.innerHTML = `Mesa ${index + 1} <span>${grupo.length} Jugadores</span>`;
                    
                    const ul = document.createElement('ul');
                    ul.className = 'card-body';
                    
                    grupo.forEach(jugador => {
                        const li = document.createElement('li');
                        li.textContent = jugador;
                        ul.appendChild(li);
                    });
                    
                    card.appendChild(header);
                    card.appendChild(ul);
                    resultados.appendChild(card);
                });
                
            }, 800); 
        }
    </script>
</body>
</html>
