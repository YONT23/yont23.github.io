<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Dinámico de Grupos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 10px;
            text-align: center;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.1rem;
        }

        .config-panel {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            border-top: 5px solid #8b5cf6;
        }

        .input-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 600;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        textarea:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.2rem;
            box-sizing: border-box;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-width: 200px;
        }

        .btn-sortear {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-sortear:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 20px -5px rgba(37, 99, 235, 0.4);
        }

        .btn-sortear:active {
            transform: translateY(1px);
        }

        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .group-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-top: 5px solid var(--primary);
            transition: transform 0.3s ease;
            animation: popIn 0.4s ease forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .group-card:hover {
            transform: translateY(-5px);
        }

        .group-title {
            font-size: 1.4rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-badge {
            background-color: #e2e8f0;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .student-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .student-item {
            padding: 10px 12px;
            background-color: #f8fafc;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 1.05rem;
            color: var(--text-main);
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
        }

        .student-item:hover {
            background-color: #f1f5f9;
            border-left-color: var(--primary);
        }

        .stats {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Generador Dinámico de Grupos</h1>
    <p class="subtitle">Agrega o elimina estudiantes, y elige cuántos grupos quieres formar.</p>

    <div class="config-panel">
        <div class="input-group" style="flex: 2;">
            <label for="listaNombres">Lista de Estudiantes (uno por línea):</label>
            <textarea id="listaNombres">Barrios Nicoll
Gomez Jesus
Hernandez Thomas
Liñan Samuel
Londoño Samuel
Mejía Ilder
Oviedo Matias
Perez Edier
Pestana Francheska
Vidal Liz
Sharon</textarea>
            <div class="stats" id="contador">11 estudiantes en la lista</div>
        </div>
        
        <div class="input-group">
            <label for="numGrupos">Cantidad de Grupos a crear:</label>
            <input type="number" id="numGrupos" value="3" min="1">
            
            <div class="action-group" style="margin-top: auto;">
                <button class="btn-sortear" onclick="generarGrupos()">🎲 Generar Grupos</button>
            </div>
        </div>
    </div>

    <div class="groups-container" id="contenedorGrupos">
        <!-- Los grupos se generarán aquí dinámicamente -->
    </div>

    <script>
        // Actualizar contador al escribir
        document.getElementById('listaNombres').addEventListener('input', function() {
            const nombres = this.value.split('\n').filter(n => n.trim() !== '');
            document.getElementById('contador').textContent = `${nombres.length} estudiantes en la lista`;
        });

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function generarGrupos() {
            // Obtener datos
            const textoNombres = document.getElementById('listaNombres').value;
            const cantidadGrupos = parseInt(document.getElementById('numGrupos').value);
            
            // Limpiar y filtrar nombres vacíos
            let nombres = textoNombres.split('\n').map(n => n.trim()).filter(n => n !== '');

            // Validaciones
            if (nombres.length === 0) {
                alert('Por favor, ingresa al menos un nombre.');
                return;
            }
            if (isNaN(cantidadGrupos) || cantidadGrupos < 1) {
                alert('Por favor, ingresa una cantidad válida de grupos (mínimo 1).');
                return;
            }
            if (cantidadGrupos > nombres.length) {
                alert('No puedes crear más grupos que la cantidad de estudiantes.');
                return;
            }

            // Mezclar aleatoriamente
            nombres = shuffleArray(nombres);

            // Crear arreglo de grupos vacíos
            const grupos = Array.from({ length: cantidadGrupos }, () => []);

            // Distribuir estudiantes (reparte uno por uno a cada grupo secuencialmente)
            nombres.forEach((nombre, index) => {
                grupos[index % cantidadGrupos].push(nombre);
            });

            // Renderizar en el DOM
            const contenedor = document.getElementById('contenedorGrupos');
            contenedor.innerHTML = ''; // Limpiar grupos anteriores

            grupos.forEach((grupo, idx) => {
                const card = document.createElement('div');
                card.className = 'group-card';
                // Añadir un pequeño retraso a la animación de cada tarjeta
                card.style.animationDelay = `${idx * 0.1}s`;

                // Crear la lista de miembros en HTML
                const listaHTML = grupo.map(miembro => `<li class="student-item">${miembro}</li>`).join('');

                card.innerHTML = `
                    <h2 class="group-title">Grupo ${idx + 1} <span class="group-badge">${grupo.length} Miembros</span></h2>
                    <ul class="student-list">
                        ${listaHTML}
                    </ul>
                `;
                
                contenedor.appendChild(card);
            });
        }

        // Generar los grupos la primera vez que carga la página
        window.onload = generarGrupos;
    </script>
</body>
</html>
