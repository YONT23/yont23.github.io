function ReportesModule({ state }) {
  const toast = useToast();

  const exportLeaders = (fmt) => {
    const rows = state.leaders.map((l) => {
      const p = state.passports[l.id];
      const nota = p ? calcFinalNoteStrict(p.scores, state.criteria) : null;
      const team = state.teams.find((t) => t.id === l.teamId);
      return { Nombre: l.fullName, Grupo: l.grupo, Equipo: team ? team.name : '', Rol: l.role, Estado: l.status, 'Nota final': nota != null ? nota.toFixed(1) : '', 'Fecha ingreso': l.joinDate };
    });
    if (!rows.length) { toast('No hay datos de Grado 11° para exportar', 'error'); return; }
    if (fmt === 'csv') downloadFile('LanguageLeaders_11.csv', toCSV(rows), 'text/csv');
    else exportExcel(rows, 'LanguageLeaders_11.xlsx', 'Grado 11');
    toast('Exportación generada', 'success');
  };

  const exportParticipants = (fmt) => {
    const rows = state.participants.map((p) => {
      const act = state.activities.find((a) => a.id === p.activityId);
      const cert = state.certificates.find((c) => c.id === p.certificateId);
      return { Nombre: p.fullName, Grado: p.grade, Grupo: p.group, Actividad: act ? act.name : '', Fecha: p.date, Estado: p.participationStatus, Comportamiento: p.behavior === true ? 'Sí' : p.behavior === false ? 'No' : '', Certificado: cert ? cert.code : '' };
    });
    if (!rows.length) { toast('No hay participantes para exportar', 'error'); return; }
    if (fmt === 'csv') downloadFile('Participantes_ClubLenguas.csv', toCSV(rows), 'text/csv');
    else exportExcel(rows, 'Participantes_ClubLenguas.xlsx', 'Participantes');
    toast('Exportación generada', 'success');
  };

  const exportCertificates = (fmt) => {
    const rows = state.certificates.map((c) => {
      const p = state.participants.find((pp) => pp.id === c.participantId);
      const a = state.activities.find((aa) => aa.id === c.activityId);
      return { Código: c.code, Estudiante: p ? p.fullName : '', Actividad: a ? a.name : '', Tipo: c.recognitionType, Fecha: c.date, Estado: c.status };
    });
    if (!rows.length) { toast('No hay certificados para exportar', 'error'); return; }
    if (fmt === 'csv') downloadFile('Certificados.csv', toCSV(rows), 'text/csv');
    else exportExcel(rows, 'Certificados.xlsx', 'Certificados');
    toast('Exportación generada', 'success');
  };

  const exportBonuses = (fmt) => {
    const rows = state.bonuses.map((b) => {
      const p = state.participants.find((pp) => pp.id === b.participantId);
      return { Estudiante: p ? p.fullName : '', 'Nota original (%)': b.originalScore, Bonificación: b.applied ? `+${b.bonus}` : '0', 'Nota nueva (%)': b.newScore, Aplicada: b.applied ? 'Sí' : 'No', Motivo: b.reason, Fecha: b.date, Responsable: b.responsible };
    });
    if (!rows.length) { toast('No hay bonificaciones registradas', 'error'); return; }
    if (fmt === 'csv') downloadFile('Bonificaciones.csv', toCSV(rows), 'text/csv');
    else exportExcel(rows, 'Bonificaciones.xlsx', 'Bonificaciones');
    toast('Exportación generada', 'success');
  };

  const ReportCard = ({ icon, title, desc, count, onCSV, onExcel }) => (
    <div className="card card-pad">
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', marginBottom: 14 }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: 'var(--blue-50)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--navy-800)', flexShrink: 0 }}><Icon name={icon} size={19} /></div>
        <div>
          <h3 style={{ fontSize: 14.5, color: 'var(--navy-950)' }}>{title}</h3>
          <p style={{ fontSize: 12, color: 'var(--ink-500)', marginTop: 2 }}>{desc}</p>
        </div>
        <div style={{ marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontWeight: 700, color: 'var(--navy-800)' }}>{count}</div>
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn btn-outline btn-sm" onClick={onCSV}><Icon name="download" size={13} /> CSV</button>
        <button className="btn btn-outline btn-sm" onClick={onExcel}><Icon name="download" size={13} /> Excel</button>
      </div>
    </div>
  );

  return (
    <div className="grid-2">
      <ReportCard icon="leaders" title="Listado y evaluación — Grado 11°" desc="Nombre, equipo, rol, estado y nota final." count={state.leaders.length} onCSV={() => exportLeaders('csv')} onExcel={() => exportLeaders('xlsx')} />
      <ReportCard icon="participants" title="Participantes" desc="Registro completo por grado y actividad." count={state.participants.length} onCSV={() => exportParticipants('csv')} onExcel={() => exportParticipants('xlsx')} />
      <ReportCard icon="certificates" title="Certificados" desc="Códigos, estudiantes y actividades certificadas." count={state.certificates.length} onCSV={() => exportCertificates('csv')} onExcel={() => exportCertificates('xlsx')} />
      <ReportCard icon="bonus" title="Bonificaciones académicas" desc="Notas originales, bonificación aplicada y nota final." count={state.bonuses.length} onCSV={() => exportBonuses('csv')} onExcel={() => exportBonuses('xlsx')} />
    </div>
  );
}
/* ============================================================
   CONFIGURACIÓN MODULE
   ============================================================ */
function TeamFormModal({ initial, onClose, onSave }) {
  const [form, setForm] = useState(initial || { id: '', name: '', description: '', color: '#2851a8' });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  return (
    <Modal title={initial ? 'Editar equipo' : 'Nuevo equipo'} onClose={onClose} footer={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!form.name.trim()} onClick={() => onSave(form)}>Guardar</button>
      </>
    }>
      <Field label="Nombre del equipo" required><input type="text" value={form.name} onChange={(e) => set('name', e.target.value)} /></Field>
      <Field label="Descripción"><input type="text" value={form.description} onChange={(e) => set('description', e.target.value)} /></Field>
      <Field label="Color"><input type="color" value={form.color} onChange={(e) => set('color', e.target.value)} style={{ width: 70, height: 36, padding: 2 }} /></Field>
    </Modal>
  );
}

function TeamsConfig({ state, update }) {
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const toast = useToast();

  const save = (form) => {
    if (form.id) update((s) => ({ ...s, teams: s.teams.map((t) => (t.id === form.id ? form : t)) }));
    else update((s) => ({ ...s, teams: [...s.teams, { ...form, id: uid('tm') }] }));
    toast('Equipo guardado', 'success');
    setEditing(null); setCreating(false);
  };
  const remove = (id) => {
    update((s) => ({ ...s, teams: s.teams.filter((t) => t.id !== id), leaders: s.leaders.map((l) => (l.teamId === id ? { ...l, teamId: '' } : l)) }));
    toast('Equipo eliminado', 'default');
  };

  return (
    <div className="card">
      <div className="card-header"><h3>Equipos y roles</h3><button className="btn btn-primary btn-sm" onClick={() => setCreating(true)}><Icon name="plus" size={14} /> Nuevo equipo</button></div>
      <div className="table-wrap">
        <table className="data-table">
          <thead><tr><th>Equipo</th><th>Descripción</th><th>Miembros</th><th></th></tr></thead>
          <tbody>
            {state.teams.map((t) => (
              <tr key={t.id}>
                <td><TeamPill team={t} /></td>
                <td style={{ fontSize: 12.5, color: 'var(--ink-500)' }}>{t.description}</td>
                <td>{state.leaders.filter((l) => l.teamId === t.id).length}</td>
                <td><div className="row-actions"><button className="icon-btn" onClick={() => setEditing(t)}><Icon name="edit" size={14} /></button><button className="icon-btn" onClick={() => setDeleting(t)}><Icon name="trash" size={14} /></button></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {(creating || editing) && <TeamFormModal initial={editing} onClose={() => { setCreating(false); setEditing(null); }} onSave={save} />}
      {deleting && <ConfirmModal title="Eliminar equipo" danger message={`¿Eliminar el equipo "${deleting.name}"? Los Leaders asignados quedarán sin equipo.`} onConfirm={() => remove(deleting.id)} onClose={() => setDeleting(null)} />}
    </div>
  );
}

function CriteriaConfig({ state, update }) {
  const [local, setLocal] = useState(state.criteria);
  const toast = useToast();
  useEffect(() => setLocal(state.criteria), [state.criteria]);
  const sum = local.reduce((a, c) => a + Number(c.weight || 0), 0);

  const setWeight = (id, w) => setLocal((cs) => cs.map((c) => (c.id === id ? { ...c, weight: w } : c)));
  const setName = (id, n) => setLocal((cs) => cs.map((c) => (c.id === id ? { ...c, name: n } : c)));
  const addCriterion = () => setLocal((cs) => [...cs, { id: uid('cr'), name: 'Nuevo criterio', weight: 0 }]);
  const removeCriterion = (id) => setLocal((cs) => cs.filter((c) => c.id !== id));
  const save = () => {
    update((s) => ({ ...s, criteria: local }));
    toast(sum === 100 ? 'Criterios guardados (100%)' : `Criterios guardados — atención: suman ${sum}%`, sum === 100 ? 'success' : 'default');
  };

  return (
    <div className="card">
      <div className="card-header"><h3>Criterios de evaluación (Grado 11°)</h3><span style={{ fontSize: 12.5, fontFamily: 'var(--font-mono)', fontWeight: 700, color: sum === 100 ? 'var(--green-600)' : 'var(--red-600)' }}>Suma: {sum}%</span></div>
      <div className="card-pad">
        {local.map((c) => (
          <div key={c.id} className="field-row" style={{ alignItems: 'center', marginBottom: 8 }}>
            <input type="text" value={c.name} onChange={(e) => setName(c.id, e.target.value)} style={{ flex: 3, padding: '8px 10px', border: '1px solid var(--ink-100)', borderRadius: 8, fontSize: 13 }} />
            <input type="number" min="0" max="100" value={c.weight} onChange={(e) => setWeight(c.id, Number(e.target.value))} style={{ flex: 1, padding: '8px 10px', border: '1px solid var(--ink-100)', borderRadius: 8, fontSize: 13 }} />
            <span style={{ fontSize: 12, color: 'var(--ink-500)' }}>%</span>
            <button className="icon-btn" onClick={() => removeCriterion(c.id)}><Icon name="trash" size={13} /></button>
          </div>
        ))}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 14 }}>
          <button className="btn btn-outline btn-sm" onClick={addCriterion}><Icon name="plus" size={14} /> Añadir criterio</button>
          <button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14} /> Guardar criterios</button>
        </div>
        {sum !== 100 && <div style={{ fontSize: 12, color: 'var(--red-600)', marginTop: 8 }}>Los porcentajes deben sumar 100% para que la nota final sea exacta.</div>}
      </div>
    </div>
  );
}

function GeneralConfig({ state, update }) {
  const [local, setLocal] = useState(state.config);
  const toast = useToast();
  useEffect(() => setLocal(state.config), [state.config]);
  const set = (k, v) => setLocal((c) => ({ ...c, [k]: v }));
  const save = () => { update((s) => ({ ...s, config: local })); toast('Configuración guardada', 'success'); };

  return (
    <div className="card card-pad">
      <div className="field-row">
        <Field label="Institución"><input type="text" value={local.institution} onChange={(e) => set('institution', e.target.value)} /></Field>
        <Field label="Ubicación"><input type="text" value={local.location} onChange={(e) => set('location', e.target.value)} /></Field>
      </div>
      <div className="field-row">
        <Field label="Nombre del programa"><input type="text" value={local.programName} onChange={(e) => set('programName', e.target.value)} /></Field>
        <Field label="Año"><input type="number" value={local.year} onChange={(e) => set('year', Number(e.target.value))} /></Field>
      </div>
      <div className="field-row">
        <Field label="Coordinador(a)"><input type="text" value={local.coordinatorName} onChange={(e) => set('coordinatorName', e.target.value)} /></Field>
        <Field label="Cargo"><input type="text" value={local.coordinatorRole} onChange={(e) => set('coordinatorRole', e.target.value)} /></Field>
      </div>
      <Field label="Puntos de bonificación por certificado (puntos porcentuales)" hint="Se suman directamente sobre la nota de actividades, nunca se multiplican.">
        <input type="number" step="0.1" value={local.bonusPoints} onChange={(e) => set('bonusPoints', Number(e.target.value))} style={{ maxWidth: 140 }} />
      </Field>
      <div style={{ textAlign: 'right' }}><button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14} /> Guardar</button></div>
    </div>
  );
}

function DataConfig({ state, replaceState }) {
  const toast = useToast();
  const fileRef = useRef(null);
  const [resetting, setResetting] = useState(false);

  const exportBackup = () => {
    downloadFile(`LanguageLeadersXXI_backup_${todayISO()}.json`, JSON.stringify(state, null, 2), 'application/json');
    toast('Copia de seguridad descargada', 'success');
  };
  const importBackup = async (file) => {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      replaceState(parsed);
      toast('Datos importados correctamente', 'success');
    } catch (e) {
      toast('El archivo no es una copia de seguridad válida', 'error');
    }
  };
  const doReset = () => {
    replaceState(seedState());
    toast('La aplicación se reinició a sus valores iniciales', 'default');
    setResetting(false);
  };

  return (
    <div className="card card-pad">
      <h3 style={{ fontSize: 14.5, marginBottom: 6, color: 'var(--navy-950)' }}>Copia de seguridad</h3>
      <p style={{ fontSize: 12.5, color: 'var(--ink-500)', marginBottom: 14 }}>Todos los datos se guardan localmente en este dispositivo. Exporta una copia periódicamente para no perder información.</p>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <button className="btn btn-outline" onClick={exportBackup}><Icon name="download" size={15} /> Exportar copia (.json)</button>
        <button className="btn btn-outline" onClick={() => fileRef.current.click()}><Icon name="upload" size={15} /> Importar copia</button>
        <input ref={fileRef} type="file" accept=".json" style={{ display: 'none' }} onChange={(e) => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; }} />
        <button className="btn btn-danger" onClick={() => setResetting(true)}><Icon name="trash" size={15} /> Reiniciar aplicación</button>
      </div>
      {resetting && <ConfirmModal title="Reiniciar aplicación" danger message="Esto borrará todos los Leaders, participantes, certificados y evaluaciones registrados en este dispositivo. Esta acción no se puede deshacer." onConfirm={doReset} onClose={() => setResetting(false)} />}
    </div>
  );
}

function ConfiguracionModule({ state, update, replaceState }) {
  const [tab, setTab] = useState('general');
  return (
    <>
      <div className="tabs">
        <button className={`tab ${tab === 'general' ? 'active' : ''}`} onClick={() => setTab('general')}>General</button>
        <button className={`tab ${tab === 'equipos' ? 'active' : ''}`} onClick={() => setTab('equipos')}>Equipos y roles</button>
        <button className={`tab ${tab === 'criterios' ? 'active' : ''}`} onClick={() => setTab('criterios')}>Criterios de evaluación</button>
        <button className={`tab ${tab === 'datos' ? 'active' : ''}`} onClick={() => setTab('datos')}>Datos y copia de seguridad</button>
      </div>
      {tab === 'general' && <GeneralConfig state={state} update={update} />}
      {tab === 'equipos' && <TeamsConfig state={state} update={update} />}
      {tab === 'criterios' && <CriteriaConfig state={state} update={update} />}
      {tab === 'datos' && <DataConfig state={state} replaceState={replaceState} />}
    </>
  );
}
/* ============================================================
   ROOT APP
   ============================================================ */
const VIEW_TITLES = {
  dashboard: 'Dashboard del Docente',
  grado11: 'Grado 11° — Language Leaders',
  participantes: 'Participantes — Club de Lenguas',
  actividades: 'Actividades del Club',
  evaluaciones: 'Evaluaciones — Grado 11°',
  certificados: 'Certificados',
  carnets: 'Carnets digitales',
  reportes: 'Reportes y exportación',
  configuracion: 'Configuración',
};
const VIEW_CRUMBS = {
  dashboard: 'Resumen general del proyecto',
  grado11: 'Language Leaders · Equipos · Roles',
  participantes: 'Registro de participación por grado',
  actividades: 'Misiones y encuentros del club',
  evaluaciones: 'Notas 0.0–10.0 y desempeño por criterio',
  certificados: 'Generación, listado y verificación',
  carnets: 'Carnet digital con QR de verificación',
  reportes: 'Exportar a PDF, Excel y CSV',
  configuracion: 'Equipos, criterios e institución',
};

function App() {
  const [state, setState] = useState(loadState);
  const [view, setView] = useState('home');
  const [mobileOpen, setMobileOpen] = useState(false);
  const [passportLeaderId, setPassportLeaderId] = useState(null);
  const [carnetLeaderId, setCarnetLeaderId] = useState(null);
  const [pendingParticipant, setPendingParticipant] = useState(null);

  useEffect(() => { saveState(state); }, [state]);

  const update = useCallback((fn) => setState((s) => fn(s)), []);
  const replaceState = useCallback((newState) => setState(newState), []);

  const openPassport = (leaderId) => { setPassportLeaderId(leaderId); setView('grado11'); };
  const openCarnet = (leaderId) => { setCarnetLeaderId(leaderId); setView('carnets'); };
  const handleGenerateCertificate = (participant) => { setPendingParticipant(participant); setView('certificados'); };

  if (view === 'home') {
    return (
      <ToastMount>
        <Landing setView={setView} state={state} />
      </ToastMount>
    );
  }

  const counts = {
    grado11: state.leaders.length || null,
    participantes: state.participants.length || null,
    certificados: state.certificates.length || null,
  };

  let body = null;
  if (view === 'dashboard') body = <Dashboard state={state} setView={setView} />;
  else if (view === 'grado11') {
    const leader = passportLeaderId ? state.leaders.find((l) => l.id === passportLeaderId) : null;
    body = leader
      ? <PassportView leader={leader} state={state} update={update} onBack={() => setPassportLeaderId(null)} onOpenCarnet={openCarnet} />
      : <Grado11Module state={state} update={update} setView={setView} openPassport={openPassport} openCarnet={openCarnet} />;
  }
  else if (view === 'participantes') body = <ParticipantesModule state={state} update={update} setView={setView} onGenerateCertificate={handleGenerateCertificate} />;
  else if (view === 'actividades') body = <ActividadesModule state={state} update={update} />;
  else if (view === 'evaluaciones') body = <EvaluacionesModule state={state} setView={setView} openPassport={openPassport} />;
  else if (view === 'certificados') body = <CertificatesModule state={state} update={update} setView={setView} pendingParticipant={pendingParticipant} clearPending={() => setPendingParticipant(null)} />;
  else if (view === 'carnets') {
    const leader = carnetLeaderId ? state.leaders.find((l) => l.id === carnetLeaderId) : null;
    body = leader
      ? <CarnetView leader={leader} state={state} onBack={() => setCarnetLeaderId(null)} />
      : <CarnetsGallery state={state} setView={setView} openCarnet={openCarnet} />;
  }
  else if (view === 'reportes') body = <ReportesModule state={state} />;
  else if (view === 'configuracion') body = <ConfiguracionModule state={state} update={update} replaceState={replaceState} />;

  return (
    <ToastMount>
      <div className="app-shell">
        <Sidebar view={view} setView={(v) => { setView(v); setPassportLeaderId(null); setCarnetLeaderId(null); }} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} counts={counts} />
        <div className="main">
          <MobileTopbar setMobileOpen={setMobileOpen} title={VIEW_TITLES[view]} />
          <Topbar title={VIEW_TITLES[view]} crumbs={VIEW_CRUMBS[view]} />
          <div className="content">{body}</div>
        </div>
      </div>
    </ToastMount>
  );
}

function ToastMount({ children }) {
  return <ToastProvider>{children}</ToastProvider>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>

</body>
