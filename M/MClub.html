<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>LANGUAGE LEADERS XXI · Club de Lenguas — Institución Educativa Siglo XXI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ============================================================
   LANGUAGE LEADERS XXI — Design tokens
   Palette: institutional navy dominant, white base, CO accents used sparingly
   ============================================================ */
:root{
  --navy-950:#0a1c3d;
  --navy-900:#0f2557;
  --navy-800:#15316f;
  --navy-700:#1c3d87;
  --navy-600:#2851a8;
  --blue-500:#3d6bc4;
  --blue-100:#e8eefb;
  --blue-50:#f4f7fd;
  --yellow-500:#ffc72c;
  --yellow-600:#e6ac00;
  --red-500:#ce1126;
  --red-600:#a80e1f;
  --ink-900:#101826;
  --ink-700:#3a4356;
  --ink-500:#6b7488;
  --ink-300:#b7bfd0;
  --ink-100:#e7eaf2;
  --paper:#ffffff;
  --canvas:#f6f8fc;
  --green-600:#1c8a5a;
  --green-100:#e3f6ec;
  --amber-100:#fff3d6;
  --red-100:#fbe6e9;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:22px;
  --shadow-sm:0 1px 2px rgba(15,37,87,.06), 0 1px 1px rgba(15,37,87,.04);
  --shadow-md:0 8px 24px rgba(15,37,87,.10), 0 2px 6px rgba(15,37,87,.06);
  --shadow-lg:0 20px 48px rgba(10,28,61,.18);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--canvas);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--yellow-500);color:var(--navy-950);}

.app-shell{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:264px;flex-shrink:0;
  background:linear-gradient(180deg,var(--navy-950) 0%, var(--navy-800) 100%);
  color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  z-index:40;
}
.sidebar-brand{
  display:flex;align-items:center;gap:12px;
  padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.10);
}
.sidebar-brand img{width:44px;height:auto;border-radius:6px;background:#fff;padding:3px;}
.sidebar-brand .name{font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.25;}
.sidebar-brand .sub{font-size:10.5px;color:var(--blue-100);opacity:.8;letter-spacing:.04em;text-transform:uppercase;}
.sidebar-flag{height:4px;width:100%;background:linear-gradient(90deg,var(--yellow-500) 0 50%, var(--blue-500) 50% 75%, var(--red-500) 75% 100%);}

.nav-group-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4);
  padding:18px 20px 6px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 20px;margin:2px 10px;border-radius:10px;
  color:rgba(255,255,255,.82);font-size:13.6px;font-weight:500;text-decoration:none;
  transition:background .15s,color .15s;border:none;background:transparent;width:calc(100% - 20px);text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--yellow-500);}
.nav-item .icon{width:18px;height:18px;flex-shrink:0;opacity:.9;}
.nav-item .badge{margin-left:auto;background:var(--yellow-500);color:var(--navy-950);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;}

.sidebar-footer{margin-top:auto;padding:16px 20px;font-size:11px;color:rgba(255,255,255,.45);border-top:1px solid rgba(255,255,255,.08);}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;background:#fff;border-bottom:1px solid var(--ink-100);
  position:sticky;top:0;z-index:30;
}
.topbar h1{font-size:19px;color:var(--navy-950);}
.topbar .crumbs{font-size:12px;color:var(--ink-500);margin-top:2px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.content{padding:26px 28px 60px;max-width:1400px;width:100%;margin:0 auto;}

.mobile-topbar{display:none;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;
  font-size:13.5px;font-weight:600;border:1px solid transparent;transition:all .15s;white-space:nowrap;
}
.btn-primary{background:var(--navy-800);color:#fff;}
.btn-primary:hover{background:var(--navy-900);}
.btn-accent{background:var(--yellow-500);color:var(--navy-950);}
.btn-accent:hover{background:var(--yellow-600);}
.btn-outline{background:#fff;color:var(--navy-800);border-color:var(--ink-100);}
.btn-outline:hover{border-color:var(--navy-700);background:var(--blue-50);}
.btn-ghost{background:transparent;color:var(--ink-700);}
.btn-ghost:hover{background:var(--ink-100);}
.btn-danger{background:var(--red-100);color:var(--red-600);}
.btn-danger:hover{background:#f7d0d6;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--ink-100);background:#fff;color:var(--ink-700);}
.icon-btn:hover{background:var(--blue-50);color:var(--navy-800);}

/* ---------- Cards ---------- */
.card{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid var(--ink-100);}
.card-pad{padding:20px;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--ink-100);}
.card-header h3{font-size:15px;color:var(--navy-950);}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{
  background:#fff;border-radius:var(--radius-md);padding:18px 20px;border:1px solid var(--ink-100);
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent,var(--navy-700));}
.stat-card .label{font-size:11.5px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.stat-card .value{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--navy-950);margin-top:4px;}
.stat-card .sub{font-size:12px;color:var(--ink-500);margin-top:3px;}
.stat-card .icon-wrap{position:absolute;top:14px;right:16px;font-size:22px;opacity:.85;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px;}
.section-title h2{font-size:16px;color:var(--navy-950);}
.section-title .hint{font-size:12px;color:var(--ink-500);}

/* ---------- Grid split ---------- */
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table.data-table{width:100%;border-collapse:collapse;font-size:13.2px;}
table.data-table th{
  text-align:left;padding:10px 14px;background:var(--blue-50);color:var(--navy-800);
  font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--ink-100);white-space:nowrap;position:sticky;top:0;
}
table.data-table td{padding:10px 14px;border-bottom:1px solid var(--ink-100);vertical-align:middle;color:var(--ink-900);}
table.data-table tr:hover td{background:var(--blue-50);}
table.data-table tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:6px;}

.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--blue-100);flex-shrink:0;border:1px solid var(--ink-100);}
.avatar-lg{width:96px;height:96px;border-radius:16px;object-fit:cover;background:var(--blue-100);border:2px solid #fff;box-shadow:var(--shadow-sm);}
.name-cell{display:flex;align-items:center;gap:10px;}
.name-cell .n{font-weight:600;color:var(--navy-950);}
.name-cell .s{font-size:11.5px;color:var(--ink-500);}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge-blue{background:var(--blue-100);color:var(--navy-800);}
.badge-green{background:var(--green-100);color:var(--green-600);}
.badge-amber{background:var(--amber-100);color:#8a5c00;}
.badge-red{background:var(--red-100);color:var(--red-600);}
.badge-gray{background:var(--ink-100);color:var(--ink-700);}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ---------- Progress ---------- */
.progress{height:8px;border-radius:20px;background:var(--ink-100);overflow:hidden;}
.progress > div{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--navy-700),var(--blue-500));}
.progress.thick{height:12px;}
.mini-bar-row{display:flex;align-items:center;gap:10px;margin:6px 0;}
.mini-bar-row .lbl{width:140px;font-size:12.5px;color:var(--ink-700);flex-shrink:0;}
.mini-bar-row .progress{flex:1;}
.mini-bar-row .pct{width:48px;text-align:right;font-size:12.5px;font-weight:700;color:var(--navy-800);font-family:var(--font-mono);}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-700);margin-bottom:5px;}
.field .req{color:var(--red-500);}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea,.field input[type=file]{
  width:100%;padding:9px 12px;border:1px solid var(--ink-100);border-radius:9px;font-size:13.5px;background:#fbfcfe;color:var(--ink-900);
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-600);box-shadow:0 0 0 3px var(--blue-100);background:#fff;}
.field textarea{resize:vertical;min-height:70px;}
.field .hint{font-size:11px;color:var(--ink-500);margin-top:4px;}
.field-row{display:flex;gap:12px;}
.field-row > .field{flex:1;}
.checkbox-row{display:flex;align-items:center;gap:9px;padding:8px 0;}
.radio-pills{display:flex;gap:8px;flex-wrap:wrap;}
.radio-pill{padding:7px 14px;border-radius:20px;border:1.5px solid var(--ink-100);font-size:12.5px;font-weight:600;color:var(--ink-700);cursor:pointer;transition:all .15s;}
.radio-pill.selected-yes{background:var(--green-100);border-color:var(--green-600);color:var(--green-600);}
.radio-pill.selected-no{background:var(--red-100);border-color:var(--red-500);color:var(--red-600);}

.search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ink-100);border-radius:10px;padding:8px 12px;flex:1;max-width:340px;}
.search-bar input{border:none;outline:none;flex:1;font-size:13px;background:transparent;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filter-bar select{padding:8px 10px;border:1px solid var(--ink-100);border-radius:9px;font-size:12.5px;background:#fff;color:var(--ink-700);}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ink-100);margin-bottom:18px;overflow-x:auto;}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--ink-500);border-bottom:2.5px solid transparent;white-space:nowrap;background:none;border-radius:0;}
.tab.active{color:var(--navy-800);border-color:var(--navy-800);}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,45,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;}
.modal.modal-wide{max-width:820px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--ink-100);flex-shrink:0;}
.modal-header h3{font-size:16px;color:var(--navy-950);}
.modal-body{padding:22px;overflow-y:auto;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--ink-100);flex-shrink:0;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-500);width:30px;height:30px;border-radius:8px;}
.modal-close:hover{background:var(--ink-100);}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:56px 20px;color:var(--ink-500);}
.empty-state .emoji{font-size:34px;margin-bottom:10px;}
.empty-state h4{color:var(--ink-700);font-size:15px;margin-bottom:4px;}
.empty-state p{font-size:13px;}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-950);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slideIn .2s ease;}
.toast.success{background:var(--green-600);}
.toast.error{background:var(--red-600);}
@keyframes slideIn{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* ---------- Landing (home) ---------- */
.landing{min-height:100vh;background:linear-gradient(160deg,var(--navy-950) 0%, var(--navy-800) 55%, var(--navy-700) 100%);color:#fff;position:relative;overflow:hidden;}
.landing::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 10%, rgba(255,199,44,.13), transparent 45%), radial-gradient(circle at 10% 90%, rgba(206,17,38,.14), transparent 45%);pointer-events:none;}
.landing-inner{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:50px 28px 70px;}
.landing-header{display:flex;align-items:center;gap:16px;margin-bottom:44px;}
.landing-header img{width:64px;background:#fff;border-radius:10px;padding:5px;}
.landing-header .t1{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.02em;}
.landing-header .t2{font-size:12px;color:var(--blue-100);opacity:.85;}
.landing-hero{text-align:center;margin-bottom:52px;}
.landing-hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);padding:6px 16px;border-radius:20px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px;}
.landing-hero h1{font-size:clamp(30px,5vw,52px);line-height:1.08;margin-bottom:14px;}
.landing-hero h1 span{background:linear-gradient(90deg,var(--yellow-500),#ffe08a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.landing-hero p{font-size:15.5px;color:var(--blue-100);max-width:560px;margin:0 auto;line-height:1.6;}

.landing-cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:26px;}
.lcard{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:30px 28px;
  cursor:pointer;transition:transform .18s, background .18s;text-align:left;
}
.lcard:hover{transform:translateY(-4px);background:rgba(255,255,255,.1);}
.lcard .lc-emoji{font-size:30px;margin-bottom:14px;display:inline-block;}
.lcard h3{font-size:20px;margin-bottom:8px;}
.lcard p{font-size:13px;color:var(--blue-100);line-height:1.55;margin-bottom:16px;}
.lcard .lc-stats{display:flex;gap:18px;margin-bottom:16px;}
.lcard .lc-stats div{font-family:var(--font-display);font-size:22px;font-weight:700;}
.lcard .lc-stats span{display:block;font-size:10.5px;color:var(--blue-100);opacity:.7;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.lcard.leaders{border-top:3px solid var(--yellow-500);}
.lcard.participants{border-top:3px solid var(--blue-500);}
.lcard-cta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--yellow-500);}

.lcard-activities{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;cursor:pointer;transition:background .18s;}
.lcard-activities:hover{background:rgba(255,255,255,.1);}

.landing-enter{text-align:center;margin-top:30px;}

/* ---------- Passport (signature element) ---------- */
.passport{
  background:linear-gradient(160deg,var(--navy-900),var(--navy-700));
  border-radius:20px;color:#fff;padding:26px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.passport::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 16px);}
.passport-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;margin-bottom:18px;}
.passport-title{font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow-500);font-weight:700;}
.passport-sub{font-size:20px;font-family:var(--font-display);font-weight:700;margin-top:4px;}
.passport-photo{width:74px;height:74px;border-radius:12px;object-fit:cover;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);}
.passport-grade{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;font-size:11px;text-align:center;}
.stamps-row{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:2;margin-top:14px;}
.stamp{
  width:58px;height:58px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;transform:rotate(-6deg);
}
.stamp.done{border-style:solid;border-color:var(--yellow-500);background:rgba(255,199,44,.14);}
.stamp.pending{opacity:.35;}

/* ---------- Carnet ---------- */
.carnet-wrap{display:flex;justify-content:center;padding:10px;}
.carnet{
  width:min(340px,88vw);border-radius:20px;overflow:hidden;background:#fff;box-shadow:var(--shadow-lg);
  border:1px solid var(--ink-100);font-family:var(--font-body);
}
.carnet-head{background:linear-gradient(120deg,var(--navy-900),var(--navy-700));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;position:relative;}
.carnet-head::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--yellow-500) 0 50%, var(--blue-500) 50% 75%, var(--red-500) 75% 100%);}
.carnet-head img.shield{width:30px;background:#fff;border-radius:6px;padding:2px;}
.carnet-head .ct{font-family:var(--font-display);font-weight:800;font-size:12.5px;letter-spacing:.03em;}
.carnet-head .cs{font-size:9.5px;opacity:.8;}
.carnet-body{padding:18px;display:flex;gap:14px;}
.carnet-body .photo{width:82px;height:98px;border-radius:10px;object-fit:cover;background:var(--blue-100);border:1px solid var(--ink-100);flex-shrink:0;}
.carnet-info .nm{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--navy-950);line-height:1.2;}
.carnet-info .row{font-size:11px;color:var(--ink-500);margin-top:6px;}
.carnet-info .row b{color:var(--ink-900);font-weight:600;}
.carnet-foot{padding:12px 18px 18px;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px dashed var(--ink-100);}
.carnet-foot .sig img{height:26px;opacity:.85;}
.carnet-foot .sig span{display:block;font-size:8.5px;color:var(--ink-500);border-top:1px solid var(--ink-300);padding-top:3px;margin-top:2px;}
.carnet-foot .qr{width:64px;height:64px;background:#fff;border:1px solid var(--ink-100);border-radius:6px;padding:3px;}
.carnet-id{font-family:var(--font-mono);font-size:9px;color:var(--ink-500);text-align:center;padding:0 18px 14px;letter-spacing:.03em;}

/* ---------- Certificate ---------- */
.cert-wrap{display:flex;justify-content:center;padding:4px;}
.certificate{
  width:100%;max-width:760px;aspect-ratio:1.414/1;background:
    radial-gradient(ellipse at 50% 8%, rgba(61,107,196,.05), transparent 55%),
    linear-gradient(180deg,#ffffff 0%, #fdfdfe 100%);
  border-radius:clamp(8px,1.6vw,14px);position:relative;
  box-shadow:var(--shadow-lg);
  padding:clamp(14px,4.6%,38px) clamp(16px,6.2%,52px);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  border:clamp(4px,1.4%,9px) solid var(--navy-900);overflow:hidden;
}
.certificate::before{content:'';position:absolute;inset:clamp(6px,1.7%,15px);border:1.4px solid var(--yellow-500);border-radius:6px;pointer-events:none;z-index:3;}
.cert-flagbar{position:absolute;top:0;left:0;width:100%;height:clamp(4px,1%,8px);background:linear-gradient(90deg,var(--yellow-500) 0 50%, var(--blue-500) 50% 75%, var(--red-500) 75% 100%);z-index:3;}
.cert-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56%;max-width:340px;opacity:.05;z-index:0;filter:grayscale(1);pointer-events:none;}
.cert-corner{position:absolute;width:clamp(20px,5%,34px);height:clamp(20px,5%,34px);z-index:3;opacity:.55;pointer-events:none;}
.cert-corner.tl{top:clamp(8px,2%,16px);left:clamp(8px,2%,16px);border-top:2px solid var(--yellow-500);border-left:2px solid var(--yellow-500);}
.cert-corner.tr{top:clamp(8px,2%,16px);right:clamp(8px,2%,16px);border-top:2px solid var(--yellow-500);border-right:2px solid var(--yellow-500);}
.cert-corner.bl{bottom:clamp(8px,2%,16px);left:clamp(8px,2%,16px);border-bottom:2px solid var(--yellow-500);border-left:2px solid var(--yellow-500);}
.cert-corner.br{bottom:clamp(8px,2%,16px);right:clamp(8px,2%,16px);border-bottom:2px solid var(--yellow-500);border-right:2px solid var(--yellow-500);}
.cert-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;height:100%;}
.cert-shield{width:clamp(30px,8%,54px);margin-bottom:clamp(2px,.8%,7px);flex-shrink:0;}
.cert-org{font-size:clamp(7.5px,1.8vw,11px);letter-spacing:.09em;text-transform:uppercase;color:var(--navy-800);font-weight:700;}
.cert-club{font-family:var(--font-display);font-weight:800;color:var(--navy-950);font-size:clamp(10.5px,2.6vw,15px);margin-top:2px;letter-spacing:.02em;}
.cert-ribbon{display:inline-flex;align-items:center;gap:6px;margin-top:clamp(8px,2.6%,20px);}
.cert-ribbon .line{height:1px;width:clamp(18px,5%,46px);background:var(--ink-300);}
.cert-word{font-family:var(--font-display);font-size:clamp(8px,1.9vw,12px);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-500);}
.cert-name{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(17px,4.6vw,36px);color:var(--navy-950);margin:clamp(4px,1.6%,10px) 0;border-bottom:2px solid var(--yellow-500);padding-bottom:clamp(3px,1%,8px);display:inline-block;max-width:92%;line-height:1.15;}
.cert-body{font-size:clamp(8.5px,2vw,13px);color:var(--ink-700);max-width:88%;line-height:1.6;margin-top:clamp(2px,.8%,6px);}
.cert-body b{color:var(--navy-900);}
.cert-bottom{display:flex;justify-content:space-between;align-items:flex-end;width:100%;margin-top:auto;padding-top:clamp(8px,2.6%,22px);}
.cert-sig{text-align:center;}
.cert-sig img{height:clamp(16px,4.4vw,32px);}
.cert-sig .line2{width:clamp(90px,22%,150px);border-top:1.2px solid var(--ink-300);margin-top:3px;padding-top:4px;font-size:clamp(6.5px,1.5vw,10.5px);color:var(--ink-500);line-height:1.3;}
.cert-code{font-family:var(--font-mono);font-size:clamp(6px,1.4vw,9.5px);color:var(--ink-500);text-align:center;margin-top:2px;}
.cert-qr{width:clamp(34px,9%,58px);height:clamp(34px,9%,58px);}
.cert-qr > div{width:100% !important;height:100% !important;}
.cert-qr img,.cert-qr canvas{width:100% !important;height:100% !important;}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.no-print{display:none !important;}
  .content{padding:0;}
  body{background:#fff;}
}

/* ---------- Responsive ---------- */
.hamburger{display:none;}
@media (max-width: 960px){
  .two-col{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
}
@media (max-width: 780px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .app-shell{display:block;}
  .mobile-topbar{
    display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--navy-950);color:#fff;position:sticky;top:0;z-index:50;
  }
  .hamburger{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.1);border:none;color:#fff;flex-shrink:0;}
  .mobile-topbar img{width:26px;background:#fff;border-radius:5px;padding:2px;}
  .mobile-topbar .t{font-family:var(--font-display);font-weight:700;font-size:13px;}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;}
  .topbar{position:static;}
  .content{padding:18px 14px 50px;}
  .grid-3{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
  .field-row{flex-direction:column;gap:0;}
  .landing-cards{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  table.data-table{font-size:12px;}
  .modal-body{padding:12px;}
  .modal-header{padding:14px 16px;}
  .modal-footer{padding:12px 16px;flex-wrap:wrap;}
  .cert-wrap,.carnet-wrap{padding:2px;}
}

</style>
</head>

/* ============================================================
   UTILITIES
   ============================================================ */
function uid(prefix) {
  return (prefix ? prefix + '-' : '') + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

function fmtDate(d) {
  if (!d) return '—';
  try {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch (e) { return d; }
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function round1(n) {
  return Math.round(n * 10) / 10;
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function calcFinalNote(scores, criteria) {
  let total = 0;
  let weightSum = 0;
  criteria.forEach((c) => {
    const s = scores && scores[c.id] != null ? Number(scores[c.id]) : null;
    if (s != null && !isNaN(s)) {
      total += s * (c.weight / 100);
      weightSum += c.weight;
    }
  });
  if (weightSum === 0) return null;
  // scale in case not all criteria are scored yet, normalize by weight answered
  return round1(total * (100 / weightSum) * (weightSum / 100) * (100 / 100));
}

// Simpler, correct weighted average assuming all criteria eventually scored;
// if partial, still compute proportionally over criteria answered.
function calcFinalNoteStrict(scores, criteria) {
  const answered = criteria.filter((c) => scores && scores[c.id] != null && scores[c.id] !== '');
  if (answered.length === 0) return null;
  const answeredWeight = answered.reduce((a, c) => a + c.weight, 0);
  const weighted = answered.reduce((a, c) => a + Number(scores[c.id]) * c.weight, 0);
  if (answeredWeight === 0) return null;
  return round1(weighted / answeredWeight);
}

function calcBonus(originalScorePercent, bonusPoints, cumpleComportamiento) {
  const orig = Number(originalScorePercent) || 0;
  if (!cumpleComportamiento) return { newScore: orig, applied: false };
  return { newScore: round1(orig + Number(bonusPoints)), applied: true };
}

function genCertCode(seq) {
  return `LLXXI-${APP_YEAR}-${String(seq).padStart(4, '0')}`;
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toCSV(rows) {
  if (!rows.length) return '';
  const headers = Object.keys(rows[0]);
  const esc = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const lines = [headers.map(esc).join(',')];
  rows.forEach((r) => lines.push(headers.map((h) => esc(r[h])).join(',')));
  return lines.join('\n');
}

function exportExcel(rows, filename, sheetName) {
  if (!rows.length) { return false; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Datos');
  XLSX.writeFile(wb, filename);
  return true;
}

async function exportNodeAsPDF(node, filename, opts) {
  const options = opts || {};
  const canvas = await html2canvas(node, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true });
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const orientation = options.orientation || (canvas.width > canvas.height ? 'landscape' : 'portrait');
  const pdf = new jsPDF({ orientation, unit: 'pt', format: options.format || 'letter' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const ratio = Math.min((pageW - 60) / canvas.width, (pageH - 60) / canvas.height);
  const w = canvas.width * ratio;
  const h = canvas.height * ratio;
  pdf.addImage(imgData, 'PNG', (pageW - w) / 2, (pageH - h) / 2, w, h);
  pdf.save(filename);
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, type) => {
    const id = uid('t');
    setToasts((t) => [...t, { id, message, type: type || 'default' }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-wrap">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.type}`}>{t.message}</div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function Dashboard({ state, setView }) {
  const leaders = state.leaders;
  const participants = state.participants;
  const activities = state.activities;
  const certificates = state.certificates;
  const bonuses = state.bonuses;

  const evaluatedLeaders = leaders.filter((l) => {
    const p = state.passports[l.id];
    return p && calcFinalNoteStrict(p.scores, state.criteria) != null;
  });
  const avgNote = evaluatedLeaders.length
    ? round1(evaluatedLeaders.reduce((a, l) => a + calcFinalNoteStrict(state.passports[l.id].scores, state.criteria), 0) / evaluatedLeaders.length)
    : null;

  const pendingEvidences = leaders.reduce((acc, l) => {
    const p = state.passports[l.id];
    const assigned = (p && p.assignedActivities) || [];
    const done = (p && p.evidences) || [];
    return acc + Math.max(0, assigned.length - done.length);
  }, 0);

  const bonusesApplied = bonuses.filter((b) => b.applied).length;
  const bonusesNotApplied = bonuses.filter((b) => !b.applied).length;

  const byGrade = {};
  participants.forEach((p) => { byGrade[p.grade] = (byGrade[p.grade] || 0) + 1; });
  const byGradeArr = Object.entries(byGrade).sort((a, b) => b[1] - a[1]);
  const maxGrade = Math.max(1, ...byGradeArr.map((x) => x[1]));

  const byActivity = {};
  activities.forEach((a) => { byActivity[a.name] = 0; });
  participants.forEach((p) => { const a = activities.find((x) => x.id === p.activityId); if (a) byActivity[a.name] = (byActivity[a.name] || 0) + 1; });
  const byActivityArr = Object.entries(byActivity);
  const maxAct = Math.max(1, ...byActivityArr.map((x) => x[1]));

  const doneActivities = activities.filter((a) => a.status === 'realizada').length;
  const pendingActivities = activities.filter((a) => a.status !== 'realizada').length;

  return (
    <>
      <div className="stat-grid">
        <StatCard label="Language Leaders" value={leaders.length} sub={`${leaders.filter(l=>l.status==='Activo').length} activos`} accent="var(--navy-700)" emoji="🪪" />
        <StatCard label="Participantes" value={participants.length} sub="Otros grados" accent="var(--blue-500)" emoji="🎓" />
        <StatCard label="Actividades realizadas" value={doneActivities} sub={`${pendingActivities} pendientes`} accent="var(--yellow-600)" emoji="🎯" />
        <StatCard label="Certificados generados" value={certificates.length} sub="Total histórico" accent="var(--red-500)" emoji="📜" />
        <StatCard label="11° evaluados" value={evaluatedLeaders.length} sub={`de ${leaders.length} leaders`} accent="var(--green-600)" emoji="✅" />
        <StatCard label="Promedio del proyecto" value={avgNote != null ? avgNote.toFixed(1) : '—'} sub="Escala 0.0–10.0" accent="var(--navy-900)" emoji="⭐" />
        <StatCard label="Evidencias pendientes" value={pendingEvidences} sub="Actividades asignadas sin evidencia" accent="#8a5c00" emoji="🗂️" />
        <StatCard label="Bonificaciones" value={bonusesApplied} sub={`${bonusesNotApplied} no aplicadas`} accent="var(--red-600)" emoji="➕" />
      </div>

      <div className="two-col">
        <div className="card">
          <div className="card-header">
            <h3>Resumen por grado (participantes)</h3>
            <button className="btn btn-ghost btn-sm" onClick={() => setView('reportes')}>Ver reportes</button>
          </div>
          <div className="card-pad">
            {byGradeArr.length === 0 ? <EmptyState emoji="📊" title="Sin datos aún" text="Registra participantes para ver el resumen por grado." /> :
              byGradeArr.map(([grade, count]) => (
                <div className="mini-bar-row" key={grade}>
                  <div className="lbl">{grade}</div>
                  <div className="progress"><div style={{ width: `${(count / maxGrade) * 100}%` }} /></div>
                  <div className="pct">{count}</div>
                </div>
              ))}
          </div>
        </div>

        <div className="card">
          <div className="card-header"><h3>Estado del proyecto</h3></div>
          <div className="card-pad">
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, color: 'var(--ink-500)', marginBottom: 6 }}>
                <span>Leaders evaluados</span><span>{evaluatedLeaders.length}/{leaders.length || 0}</span>
              </div>
              <ProgressBar pct={leaders.length ? (evaluatedLeaders.length / leaders.length) * 100 : 0} thick />
            </div>
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, color: 'var(--ink-500)', marginBottom: 6 }}>
                <span>Actividades realizadas</span><span>{doneActivities}/{activities.length}</span>
              </div>
              <ProgressBar pct={activities.length ? (doneActivities / activities.length) * 100 : 0} thick />
            </div>
            <div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, color: 'var(--ink-500)', marginBottom: 6 }}>
                <span>Bonificaciones aplicadas</span><span>{bonusesApplied}/{bonuses.length || 0}</span>
              </div>
              <ProgressBar pct={bonuses.length ? (bonusesApplied / bonuses.length) * 100 : 0} thick />
            </div>
          </div>
        </div>
      </div>

      <div className="section-title"><h2>Participación por actividad</h2></div>
      <div className="card card-pad">
        {byActivityArr.length === 0 ? <EmptyState emoji="🎯" title="Sin actividades con participantes" text="Registra participación en las misiones del club." /> :
          byActivityArr.map(([name, count]) => (
            <div className="mini-bar-row" key={name}>
              <div className="lbl" title={name}>{name}</div>
              <div className="progress"><div style={{ width: `${(count / maxAct) * 100}%` }} /></div>
              <div className="pct">{count}</div>
            </div>
          ))}
      </div>
    </>
  );
}

function emptyLeader() {
  return { id: '', fullName: '', docId: '', photo: null, grado: '11°', grupo: '', teamId: '', role: '', status: 'Activo', joinDate: todayISO(), notes: '' };
}

            <Field label="Estado">

function TeamPill({ team }) {
  if (!team) return <span style={{ color: 'var(--ink-500)', fontSize: 12.5 }}>Sin equipo</span>;
  return <span className="badge" style={{ background: team.color + '1a', color: team.color }}><span className="badge-dot" />{team.name}</span>;
}

function statusTone(status) {
  return { Activo: 'green', 'En formación': 'blue', Inactivo: 'amber', Retirado: 'red' }[status] || 'gray';
}

function Grado11Module({ state, update, setView, openPassport, openCarnet }) {
  const [query, setQuery] = useState('');
  const [teamFilter, setTeamFilter] = useState('');
  const [statusFilter, setStatusFilter] = useState('');
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const toast = useToast();

  const filtered = state.leaders.filter((l) => {
    if (query && !l.fullName.toLowerCase().includes(query.toLowerCase()) && !l.grupo.toLowerCase().includes(query.toLowerCase())) return false;
    if (teamFilter && l.teamId !== teamFilter) return false;
    if (statusFilter && l.status !== statusFilter) return false;
    return true;
  });

  const saveLeader = (form) => {
    if (form.id) {
      update((s) => ({ ...s, leaders: s.leaders.map((l) => (l.id === form.id ? form : l)) }));
      toast('Language Leader actualizado', 'success');
    } else {
      const id = uid('ld');
      update((s) => ({
        ...s,
        leaders: [...s.leaders, { ...form, id }],
        passports: { ...s.passports, [id]: { assignedActivities: [], completedActivities: [], evidences: [], scores: {}, feedback: '' } },
      }));
      toast('Language Leader registrado', 'success');
    }
    setEditing(null); setCreating(false);
  };

  const removeLeader = (id) => {
    update((s) => {
      const passports = { ...s.passports }; delete passports[id];
      return { ...s, leaders: s.leaders.filter((l) => l.id !== id), passports };
    });
    toast('Registro eliminado', 'default');
  };

  return (
    <>
      <div className="filter-bar">
        <SearchInput value={query} onChange={setQuery} placeholder="Buscar por nombre o grupo..." />
        <select value={teamFilter} onChange={(e) => setTeamFilter(e.target.value)}>
          <option value="">Todos los equipos</option>
          {state.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
          <option value="">Todos los estados</option>
          {ESTADOS_LEADER.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        <button className="btn btn-primary" style={{ marginLeft: 'auto' }} onClick={() => setCreating(true)}>
          <Icon name="plus" size={15} /> Nuevo Leader
        </button>
      </div>

      {filtered.length === 0 ? (
        <div className="card"><EmptyState emoji="🪪" title="Aún no hay Language Leaders registrados" text="Registra a los estudiantes de grado 11° que liderarán el Club de Lenguas." action={<button className="btn btn-primary" onClick={() => setCreating(true)}><Icon name="plus" size={15} /> Registrar Leader</button>} /></div>
      ) : (
        <div className="card table-wrap">
          <table className="data-table">
            <thead><tr><th>Estudiante</th><th>Equipo</th><th>Rol</th><th>Estado</th><th>Nota</th><th>Ingreso</th><th></th></tr></thead>
            <tbody>
              {filtered.map((l) => {
                const team = state.teams.find((t) => t.id === l.teamId);
                const passport = state.passports[l.id];
                const nota = passport ? calcFinalNoteStrict(passport.scores, state.criteria) : null;
                return (
                  <tr key={l.id}>
                    <td>
                      <div className="name-cell">
                        {l.photo ? <img src={l.photo} className="avatar" /> : <div className="avatar" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="leaders" size={15} /></div>}
                        <div>
                          <div className="n">{l.fullName}</div>
                          <div className="s">11° · {l.grupo}</div>
                        </div>
                      </div>
                    </td>
                    <td><TeamPill team={team} /></td>
                    <td>{l.role || '—'}</td>
                    <td><Badge tone={statusTone(l.status)}>{l.status}</Badge></td>
                    <td>{nota != null ? <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 700, color: 'var(--navy-800)' }}>{nota.toFixed(1)}</span> : <span style={{ color: 'var(--ink-500)' }}>Sin evaluar</span>}</td>
                    <td>{fmtDate(l.joinDate)}</td>
                    <td>
                      <div className="row-actions">
                        <button className="icon-btn" title="Language Passport" onClick={() => openPassport(l.id)}><Icon name="passport" size={15} /></button>
                        <button className="icon-btn" title="Carnet digital" onClick={() => openCarnet(l.id)}><Icon name="id" size={15} /></button>
                        <button className="icon-btn" title="Editar" onClick={() => setEditing(l)}><Icon name="edit" size={15} /></button>
                        <button className="icon-btn" title="Eliminar" onClick={() => setDeleting(l)}><Icon name="trash" size={15} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {(creating || editing) && (
        <LeaderFormModal initial={editing} teams={state.teams} onClose={() => { setCreating(false); setEditing(null); }} onSave={saveLeader} />
      )}
      {deleting && (
        <ConfirmModal title="Eliminar Language Leader" danger
          message={`¿Eliminar a "${deleting.fullName}"? Se eliminará también su Language Passport. Esta acción no se puede deshacer.`}
          onConfirm={() => removeLeader(deleting.id)} onClose={() => setDeleting(null)} />
      )}
    </>
  );
}

/* ============================================================
   LANGUAGE PASSPORT (per-leader detail: activities, evidence, evaluation)
   ============================================================ */
function PassportView({ leader, state, update, onBack, onOpenCarnet }) {
  const toast = useToast();
  const passport = state.passports[leader.id] || { assignedActivities: [], completedActivities: [], evidences: [], scores: {}, feedback: '' };
  const [tab, setTab] = useState('actividades');
  const [addingEvidence, setAddingEvidence] = useState(false);

  const updatePassport = (patch) => {
    update((s) => ({ ...s, passports: { ...s.passports, [leader.id]: { ...s.passports[leader.id], ...patch } } }));
  };

  const toggleAssigned = (actId) => {
    const cur = passport.assignedActivities || [];
    const next = cur.includes(actId) ? cur.filter((x) => x !== actId) : [...cur, actId];
    updatePassport({ assignedActivities: next });
  };
  const toggleCompleted = (actId) => {
    const cur = passport.completedActivities || [];
    const next = cur.includes(actId) ? cur.filter((x) => x !== actId) : [...cur, actId];
    updatePassport({ completedActivities: next });
  };

  const setScore = (critId, val) => {
    updatePassport({ scores: { ...passport.scores, [critId]: val === '' ? undefined : clamp(Number(val), 0, 10) } });
  };

  const finalNote = calcFinalNoteStrict(passport.scores, state.criteria);
  const assignedCount = (passport.assignedActivities || []).length;
  const completedCount = (passport.completedActivities || []).length;
  const evidenceCount = (passport.evidences || []).length;

  const removeEvidence = (id) => updatePassport({ evidences: passport.evidences.filter((e) => e.id !== id) });

  return (
    <>
      <button className="btn btn-ghost btn-sm" onClick={onBack} style={{ marginBottom: 14 }}>← Volver a Grado 11°</button>

      <div className="two-col" style={{ alignItems: 'start', marginBottom: 8 }}>
        <div className="passport">
          <div className="passport-top">
            <div>
              <div className="passport-title">Language Passport XXI · {APP_YEAR}</div>
              <div className="passport-sub">{leader.fullName}</div>
              <div style={{ fontSize: 12, opacity: .8, marginTop: 4 }}>{leader.grupo} · {state.teams.find(t => t.id === leader.teamId)?.name || 'Sin equipo'} · {leader.role || 'Sin rol'}</div>
            </div>
            {leader.photo ? <img src={leader.photo} className="passport-photo" /> : <div className="passport-photo" />}
          </div>
          <div style={{ display: 'flex', gap: 10, position: 'relative', zIndex: 2 }}>
            <div className="passport-grade"><b style={{ fontSize: 18 }}>{finalNote != null ? finalNote.toFixed(1) : '—'}</b><br />/ 10.0</div>
            <div className="passport-grade"><b style={{ fontSize: 18 }}>{completedCount}/{assignedCount || 0}</b><br />Misiones</div>
            <div className="passport-grade"><b style={{ fontSize: 18 }}>{evidenceCount}</b><br />Evidencias</div>
          </div>
          <div className="stamps-row">
            {state.activities.map((a) => {
              const done = (passport.completedActivities || []).includes(a.id);
              const assigned = (passport.assignedActivities || []).includes(a.id);
              return <div key={a.id} className={`stamp ${done ? 'done' : assigned ? '' : 'pending'}`} title={a.name}>{done ? '✅' : '🌐'}</div>;
            })}
          </div>
        </div>

        <div className="card card-pad">
          <h3 style={{ fontSize: 14, marginBottom: 10, color: 'var(--navy-950)' }}>Acciones</h3>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button className="btn btn-outline" onClick={() => onOpenCarnet(leader.id)}><Icon name="id" size={15} /> Ver carnet digital</button>
            <button className="btn btn-outline" onClick={() => setAddingEvidence(true)}><Icon name="camera" size={15} /> Registrar evidencia</button>
          </div>
          <div style={{ marginTop: 16 }}>
            <div style={{ fontSize: 12, color: 'var(--ink-500)', marginBottom: 6 }}>Progreso general</div>
            <ProgressBar pct={state.activities.length ? (completedCount / state.activities.length) * 100 : 0} thick />
          </div>
        </div>
      </div>

      <div className="tabs" style={{ marginTop: 22 }}>
        <button className={`tab ${tab === 'actividades' ? 'active' : ''}`} onClick={() => setTab('actividades')}>Actividades y misiones</button>
        <button className={`tab ${tab === 'evidencias' ? 'active' : ''}`} onClick={() => setTab('evidencias')}>Evidencias ({evidenceCount})</button>
        <button className={`tab ${tab === 'evaluacion' ? 'active' : ''}`} onClick={() => setTab('evaluacion')}>Evaluación</button>
        <button className={`tab ${tab === 'feedback' ? 'active' : ''}`} onClick={() => setTab('feedback')}>Retroalimentación</button>
      </div>

      {tab === 'actividades' && (
        <div className="card table-wrap">
          <table className="data-table">
            <thead><tr><th>Misión / Actividad</th><th>Fecha</th><th>Asignada</th><th>Realizada</th></tr></thead>
            <tbody>
              {state.activities.map((a) => (
                <tr key={a.id}>
                  <td><div className="n" style={{ fontWeight: 600 }}>{a.code ? `${a.code} — ` : ''}{a.name}</div></td>
                  <td>{fmtDate(a.date)}</td>
                  <td><input type="checkbox" checked={(passport.assignedActivities || []).includes(a.id)} onChange={() => toggleAssigned(a.id)} /></td>
                  <td><input type="checkbox" checked={(passport.completedActivities || []).includes(a.id)} onChange={() => toggleCompleted(a.id)} disabled={!(passport.assignedActivities || []).includes(a.id)} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab === 'evidencias' && (
        <div className="card card-pad">
          {evidenceCount === 0 ? <EmptyState emoji="🗂️" title="Sin evidencias registradas" text="Registra fotos, videos, documentos u observaciones del trabajo del Leader." action={<button className="btn btn-primary" onClick={() => setAddingEvidence(true)}><Icon name="plus" size={15} /> Registrar evidencia</button>} /> : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {passport.evidences.map((ev) => {
                const act = state.activities.find((a) => a.id === ev.activityId);
                return (
                  <div key={ev.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 4px', borderBottom: '1px solid var(--ink-100)' }}>
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 13.5 }}>{ev.type} {act ? `· ${act.name}` : ''}</div>
                      <div style={{ fontSize: 12, color: 'var(--ink-500)' }}>{fmtDate(ev.date)} — {ev.desc}</div>
                    </div>
                    <button className="icon-btn" onClick={() => removeEvidence(ev.id)}><Icon name="trash" size={14} /></button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {tab === 'evaluacion' && (
        <div className="card card-pad">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
            <div style={{ fontSize: 12.5, color: 'var(--ink-500)' }}>Escala 0.0 – 10.0 · Ponderación configurable en Configuración</div>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 22, color: 'var(--navy-900)' }}>
              {finalNote != null ? finalNote.toFixed(1) : '—'} <span style={{ fontSize: 13, color: 'var(--ink-500)', fontWeight: 500 }}>/ 10.0</span>
            </div>
          </div>
          {state.criteria.map((c) => (
            <div key={c.id} style={{ marginBottom: 14 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 5 }}>
                <label style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink-700)' }}>{c.name} <span style={{ color: 'var(--ink-500)', fontWeight: 400 }}>({c.weight}%)</span></label>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, fontWeight: 700, color: 'var(--navy-800)' }}>{passport.scores[c.id] != null ? Number(passport.scores[c.id]).toFixed(1) : '—'}</span>
              </div>
              <input type="range" min="0" max="10" step="0.5" value={passport.scores[c.id] != null ? passport.scores[c.id] : 0}
                onChange={(e) => setScore(c.id, e.target.value)} style={{ width: '100%' }} />
            </div>
          ))}
        </div>
      )}

      {tab === 'feedback' && (
        <div className="card card-pad">
          <Field label="Retroalimentación y observaciones del docente">
            <textarea value={passport.feedback || ''} onChange={(e) => updatePassport({ feedback: e.target.value })} style={{ minHeight: 160 }} placeholder="Escribe observaciones, fortalezas, aspectos a mejorar..." />
          </Field>
          <div style={{ textAlign: 'right' }}>
            <button className="btn btn-primary btn-sm" onClick={() => toast('Retroalimentación guardada', 'success')}><Icon name="check" size={14} /> Guardar</button>
          </div>
        </div>
      )}

      {addingEvidence && (
        <EvidenceModal activities={state.activities} onClose={() => setAddingEvidence(false)} onSave={(ev) => {
          updatePassport({ evidences: [...(passport.evidences || []), { ...ev, id: uid('ev') }] });
          setAddingEvidence(false);
          toast('Evidencia registrada', 'success');
        }} />
      )}
    </>
  );
}

function EvidenceModal({ activities, onClose, onSave }) {
  const [form, setForm] = useState({ type: TIPOS_EVIDENCIA[0], desc: '', date: todayISO(), activityId: activities[0]?.id || '' });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  return (
    <Modal title="Registrar evidencia" onClose={onClose} footer={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={() => onSave(form)} disabled={!form.desc.trim()}>Guardar</button>
      </>
    }>
      <div className="field-row">
        <Field label="Tipo de evidencia">

function CarnetsGallery({ state, setView, openCarnet }) {
  const toast = useToast();
  const [selected, setSelected] = useState([]);
  const [generatingBulk, setGeneratingBulk] = useState(false);
  const bulkRef = useRef(null);

  const toggle = (id) => setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  const selectAll = () => setSelected(state.leaders.map((l) => l.id));

  const handleBulkDownload = async () => {
    if (!selected.length) { toast('Selecciona al menos un Leader', 'error'); return; }
    setGeneratingBulk(true);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: [400, 620] });
    for (let i = 0; i < selected.length; i++) {
      const node = document.getElementById(`bulk-carnet-${selected[i]}`);
      if (!node) continue;
      const canvas = await html2canvas(node, { scale: 2.2, backgroundColor: '#fff' });
      const img = canvas.toDataURL('image/png');
      if (i > 0) pdf.addPage([400, 620], 'portrait');
      const ratio = Math.min(380 / canvas.width, 600 / canvas.height);
      pdf.addImage(img, 'PNG', (400 - canvas.width * ratio) / 2, (620 - canvas.height * ratio) / 2, canvas.width * ratio, canvas.height * ratio);
    }
    pdf.save('Carnets_LanguageLeaders.pdf');
    setGeneratingBulk(false);
    toast(`${selected.length} carnet(s) generados en PDF`, 'success');
  };

  if (state.leaders.length === 0) {
    return <div className="card"><EmptyState emoji="🪪" title="No hay Language Leaders registrados" text="Registra estudiantes de grado 11° en el módulo Grado 11° para generar sus carnets." action={<button className="btn btn-primary" onClick={() => setView('grado11')}>Ir a Grado 11°</button>} /></div>;
  }

  return (
    <>
      <div className="filter-bar">
        <button className="btn btn-outline btn-sm" onClick={selectAll}>Seleccionar todos</button>
        <button className="btn btn-ghost btn-sm" onClick={() => setSelected([])}>Limpiar selección</button>
        <span style={{ fontSize: 12.5, color: 'var(--ink-500)' }}>{selected.length} seleccionados</span>
        <button className="btn btn-primary" style={{ marginLeft: 'auto' }} disabled={generatingBulk} onClick={handleBulkDownload}>
          <Icon name="download" size={15} /> {generatingBulk ? 'Generando...' : 'Generar PDF (varios)'}
        </button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 16 }}>
        {state.leaders.map((l) => {
          const team = state.teams.find((t) => t.id === l.teamId);
          return (
            <div key={l.id} className="card card-pad" style={{ display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center' }}>
              <label style={{ alignSelf: 'flex-start', display: 'flex', gap: 8, alignItems: 'center', fontSize: 12.5, fontWeight: 600, color: 'var(--ink-700)' }}>
                <input type="checkbox" checked={selected.includes(l.id)} onChange={() => toggle(l.id)} /> Incluir en generación
              </label>
              <div style={{ transform: 'scale(0.72)', transformOrigin: 'top center', marginBottom: -60 }}>
                <div id={`bulk-carnet-${l.id}`}><CarnetCard leader={l} team={team} /></div>
              </div>
              <button className="btn btn-outline btn-sm" onClick={() => openCarnet(l.id)}>Ver / descargar individual</button>
            </div>
          );
        })}
      </div>
    </>
  );
}

function ParticipantesModule({ state, update, setView, onGenerateCertificate }) {
  const [query, setQuery] = useState('');
  const [gradeFilter, setGradeFilter] = useState('');
  const [activityFilter, setActivityFilter] = useState('');
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const toast = useToast();

  const filtered = state.participants.filter((p) => {
    if (query && !p.fullName.toLowerCase().includes(query.toLowerCase())) return false;
    if (gradeFilter && p.grade !== gradeFilter) return false;
    if (activityFilter && p.activityId !== activityFilter) return false;
    return true;
  });

  const save = (form) => {
    if (form.id) {
      update((s) => ({ ...s, participants: s.participants.map((p) => (p.id === form.id ? form : p)) }));
      toast('Participante actualizado', 'success');
    } else {
      update((s) => ({ ...s, participants: [...s.participants, { ...form, id: uid('pt') }] }));
      toast('Participante registrado', 'success');
    }
    setEditing(null); setCreating(false);
  };

  const remove = (id) => {
    update((s) => ({ ...s, participants: s.participants.filter((p) => p.id !== id) }));
    toast('Registro eliminado', 'default');
  };

  return (
    <>
      <div className="filter-bar">
        <SearchInput value={query} onChange={setQuery} placeholder="Buscar participante..." />
        <select value={gradeFilter} onChange={(e) => setGradeFilter(e.target.value)}>
          <option value="">Todos los grados</option>
          {GRADOS_PARTICIPANTES.map((g) => <option key={g}>{g}</option>)}
        </select>
        <select value={activityFilter} onChange={(e) => setActivityFilter(e.target.value)}>
          <option value="">Todas las actividades</option>
          {state.activities.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
        </select>
        <button className="btn btn-primary" style={{ marginLeft: 'auto' }} onClick={() => setCreating(true)}><Icon name="plus" size={15} /> Nuevo participante</button>

        <div className="card"><EmptyState emoji="🎓" title="Aún no hay participantes registrados" text="Registra a los estudiantes de otros grados que participan en las actividades del club." action={<button className="btn btn-primary" onClick={() => setCreating(true)}><Icon name="plus" size={15} /> Registrar participante</button>} /></div>
      ) : (
        <div className="card table-wrap">
          <table className="data-table">
            <thead><tr><th>Estudiante</th><th>Actividad</th><th>Fecha</th><th>Estado</th><th>Comportamiento</th><th>Certificado</th><th></th></tr></thead>
            <tbody>
              {filtered.map((p) => {
                const act = state.activities.find((a) => a.id === p.activityId);
                const cert = state.certificates.find((c) => c.id === p.certificateId);
                return (
                  <tr key={p.id}>
                    <td><div className="name-cell"><div><div className="n">{p.fullName}</div><div className="s">{p.grade}{p.group ? ` · ${p.group}` : ''}</div></div></div></td>
                    <td>{act ? act.name : '—'}</td>
                    <td>{fmtDate(p.date)}</td>
                    <td><Badge tone={participationTone(p.participationStatus)}>{p.participationStatus}</Badge></td>
                    <td>{p.behavior === true ? <Badge tone="green">Sí</Badge> : p.behavior === false ? <Badge tone="red">No</Badge> : <Badge tone="gray">Sin registrar</Badge>}</td>
                    <td>{cert ? <Badge tone="blue">{cert.code}</Badge> : <span style={{ color: 'var(--ink-500)', fontSize: 12.5 }}>Sin generar</span>}</td>
                    <td>
                      <div className="row-actions">
                        {!cert && <button className="icon-btn" title="Generar certificado" onClick={() => onGenerateCertificate(p)}><Icon name="certificates" size={15} /></button>}
                        <button className="icon-btn" title="Editar" onClick={() => setEditing(p)}><Icon name="edit" size={15} /></button>
                        <button className="icon-btn" title="Eliminar" onClick={() => setDeleting(p)}><Icon name="trash" size={15} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {(creating || editing) && (
        <ParticipantFormModal initial={editing} activities={state.activities} onClose={() => { setCreating(false); setEditing(null); }} onSave={save} />
      )}
      {deleting && (
        <ConfirmModal title="Eliminar participante" danger
          message={`¿Eliminar a "${deleting.fullName}"? Esta acción no se puede deshacer.`}
          onConfirm={() => remove(deleting.id)} onClose={() => setDeleting(null)} />
      )}
    </>
  );
