function CertificatesModule({ state, update, setView, pendingParticipant, clearPending }) {
  const toast = useToast();
  const [generatingFor, setGeneratingFor] = useState(null);
  const [viewingCert, setViewingCert] = useState(null);
  const [query, setQuery] = useState('');
  const [tab, setTab] = useState('lista');
  const [verifyCode, setVerifyCode] = useState('');
  const [verifyResult, setVerifyResult] = useState(undefined);

  useEffect(() => {
    if (pendingParticipant) { setGeneratingFor(pendingParticipant); clearPending(); }
  }, [pendingParticipant]);

  const filteredCerts = state.certificates.filter((c) => {
    const p = state.participants.find((pp) => pp.id === c.participantId);
    if (!p) return false;
    return !query || p.fullName.toLowerCase().includes(query.toLowerCase()) || c.code.toLowerCase().includes(query.toLowerCase());
  });

  const doGenerate = ({ recognitionType, date, applyBonus, originalScore }) => {
    const participant = generatingFor;
    const seq = state.certificates.length + 1;
    const code = genCertCode(seq);
    const certId = uid('ct');
    const cert = { id: certId, code, participantId: participant.id, activityId: participant.activityId, recognitionType, date, status: 'valido' };

    update((s) => {
      let bonuses = s.bonuses;
      if (originalScore != null) {
        const result = calcBonus(originalScore, s.config.bonusPoints, applyBonus);
        bonuses = [...bonuses, {
          id: uid('bn'), participantId: participant.id, originalScore: Number(originalScore),
          bonus: s.config.bonusPoints, applied: result.applied, newScore: result.newScore,
          reason: result.applied ? 'Certificado + buen comportamiento' : 'No cumple condición de buen comportamiento',
          date, responsible: s.config.coordinatorName,
        }];
      }
      return {
        ...s,
        certificates: [...s.certificates, cert],
        participants: s.participants.map((p) => (p.id === participant.id ? { ...p, certificateId: certId } : p)),
        bonuses,
        auditLog: [...s.auditLog, { id: uid('log'), timestamp: new Date().toISOString(), action: 'Certificado generado', details: `${code} — ${participant.fullName}` }],
      };
    });
    setGeneratingFor(null);
    toast(`Certificado ${code} generado`, 'success');
  };

  const runVerify = () => {
    const found = state.certificates.find((c) => c.code.toLowerCase() === verifyCode.trim().toLowerCase());
    setVerifyResult(found || null);
  };

  return (
    <>
      <div className="tabs">
        <button className={`tab ${tab === 'lista' ? 'active' : ''}`} onClick={() => setTab('lista')}>Certificados generados</button>
        <button className={`tab ${tab === 'verificar' ? 'active' : ''}`} onClick={() => setTab('verificar')}>Verificar certificado</button>
      </div>

      {tab === 'lista' && (
        <>
          <div className="filter-bar">
            <SearchInput value={query} onChange={setQuery} placeholder="Buscar por nombre o código..." />
            <button className="btn btn-primary" style={{ marginLeft: 'auto' }} onClick={() => setView('participantes')}><Icon name="plus" size={15} /> Generar desde Participantes</button>
          </div>
          {filteredCerts.length === 0 ? (
            <div className="card"><EmptyState emoji="📜" title="Aún no hay certificados" text="Genera certificados desde el módulo Participantes, seleccionando el estudiante y la actividad." /></div>
          ) : (
            <div className="card table-wrap">
              <table className="data-table">
                <thead><tr><th>Código</th><th>Estudiante</th><th>Actividad</th><th>Tipo</th><th>Fecha</th><th></th></tr></thead>
                <tbody>
                  {filteredCerts.map((c) => {
                    const p = state.participants.find((pp) => pp.id === c.participantId);
                    const a = state.activities.find((aa) => aa.id === c.activityId);
                    return (
                      <tr key={c.id}>
                        <td style={{ fontFamily: 'var(--font-mono)', fontSize: 12 }}>{c.code}</td>
                        <td>{p ? p.fullName : '—'}</td>
                        <td>{a ? a.name : '—'}</td>
                        <td><Badge tone="blue">{c.recognitionType}</Badge></td>
                        <td>{fmtDate(c.date)}</td>
                        <td><button className="btn btn-outline btn-sm" onClick={() => setViewingCert(c)}>Ver / Descargar</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </>
      )}

      {tab === 'verificar' && (
        <div className="card card-pad" style={{ maxWidth: 520, margin: '0 auto' }}>
          <div style={{ textAlign: 'center', marginBottom: 18 }}>
            <Icon name="qr" size={30} />
            <h3 style={{ fontSize: 15, marginTop: 8 }}>Verificación de certificados</h3>
            <p style={{ fontSize: 12.5, color: 'var(--ink-500)', marginTop: 4 }}>Ingresa el código impreso bajo el QR del certificado.</p>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <input type="text" value={verifyCode} onChange={(e) => setVerifyCode(e.target.value)} placeholder="Ej: LLXXI-2026-0001" style={{ flex: 1, padding: '9px 12px', border: '1px solid var(--ink-100)', borderRadius: 9 }} />
            <button className="btn btn-primary" onClick={runVerify}>Verificar</button>
          </div>
          {verifyResult !== undefined && (
            <div style={{ marginTop: 18 }}>
              {verifyResult === null ? (
                <div style={{ background: 'var(--red-100)', color: 'var(--red-600)', padding: '12px 14px', borderRadius: 10, fontSize: 13 }}>No se encontró ningún certificado con ese código.</div>
              ) : (() => {
                const p = state.participants.find((pp) => pp.id === verifyResult.participantId);
                const a = state.activities.find((aa) => aa.id === verifyResult.activityId);
                return (
                  <div style={{ background: 'var(--green-100)', borderRadius: 12, padding: '16px 18px' }}>
                    <Badge tone="green">Certificado válido</Badge>
                    <div style={{ marginTop: 10, fontSize: 13.5 }}>
                      <div><b>Estudiante:</b> {p ? p.fullName : '—'}</div>
                      <div><b>Actividad:</b> {a ? a.name : '—'}</div>
                      <div><b>Fecha:</b> {fmtDate(verifyResult.date)}</div>
                      <div><b>Tipo:</b> {verifyResult.recognitionType}</div>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      )}

      {generatingFor && (
        <CertificateGenerateModal participant={generatingFor} activities={state.activities} bonusPoints={state.config.bonusPoints} onClose={() => setGeneratingFor(null)} onGenerate={doGenerate} />
      )}
      {viewingCert && (
        <CertificateViewModal cert={viewingCert} participant={state.participants.find((p) => p.id === viewingCert.participantId)} activity={state.activities.find((a) => a.id === viewingCert.activityId)} onClose={() => setViewingCert(null)} />
      )}
    </>
  );
}
/* ============================================================
   ACTIVIDADES MODULE
   ============================================================ */
function emptyActivity() {
  return { id: '', code: '', name: '', description: '', objective: '', type: '', place: '', date: '', responsibleLeaders: [], responsibleTeams: [], grades: [], status: 'planificada' };
}

function ActivityFormModal({ initial, leaders, teams, onClose, onSave }) {
  const [form, setForm] = useState(initial || emptyActivity());
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const toggleLeader = (id) => set('responsibleLeaders', form.responsibleLeaders.includes(id) ? form.responsibleLeaders.filter((x) => x !== id) : [...form.responsibleLeaders, id]);
  const toggleTeam = (id) => set('responsibleTeams', form.responsibleTeams.includes(id) ? form.responsibleTeams.filter((x) => x !== id) : [...form.responsibleTeams, id]);
  const toggleGrade = (g) => set('grades', form.grades.includes(g) ? form.grades.filter((x) => x !== g) : [...form.grades, g]);
  const valid = form.name.trim().length > 1;

  return (
    <Modal title={initial ? 'Editar actividad' : 'Nueva actividad'} onClose={onClose} wide footer={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!valid} onClick={() => onSave(form)}><Icon name="check" size={15} /> Guardar</button>
      </>
    }>
      <div className="two-col">
        <div>
          <div className="field-row">
            <Field label="Código / Misión"><input type="text" value={form.code} onChange={(e) => set('code', e.target.value)} placeholder="Ej: MISSION 05" /></Field>
            <Field label="Fecha"><input type="date" value={form.date} onChange={(e) => set('date', e.target.value)} /></Field>
          </div>
          <Field label="Nombre de la actividad" required><input type="text" value={form.name} onChange={(e) => set('name', e.target.value)} placeholder="Ej: LEVEL B1 – Around the World" /></Field>
          <Field label="Descripción"><textarea value={form.description} onChange={(e) => set('description', e.target.value)} /></Field>
          <Field label="Objetivo"><textarea value={form.objective} onChange={(e) => set('objective', e.target.value)} style={{ minHeight: 50 }} /></Field>
          <div className="field-row">
            <Field label="Tipo de actividad"><input type="text" value={form.type} onChange={(e) => set('type', e.target.value)} placeholder="Ej: Encuentro institucional" /></Field>
            <Field label="Lugar"><input type="text" value={form.place} onChange={(e) => set('place', e.target.value)} /></Field>
          </div>
          <Field label="Estado">
            <select value={form.status} onChange={(e) => set('status', e.target.value)}>
              <option value="planificada">Planificada</option>
              <option value="en curso">En curso</option>
              <option value="realizada">Realizada</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </Field>
        </div>
        <div>
          <Field label="Language Leaders responsables">
            <div style={{ maxHeight: 130, overflowY: 'auto', border: '1px solid var(--ink-100)', borderRadius: 9, padding: 8 }}>
              {leaders.length === 0 ? <div style={{ fontSize: 12, color: 'var(--ink-500)' }}>No hay leaders registrados</div> :
                leaders.map((l) => (
                  <label key={l.id} style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 12.5, padding: '4px 0' }}>
                    <input type="checkbox" checked={form.responsibleLeaders.includes(l.id)} onChange={() => toggleLeader(l.id)} /> {l.fullName}
                  </label>
                ))}
            </div>
          </Field>
          <Field label="Equipos responsables">
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {teams.map((t) => (
                <div key={t.id} onClick={() => toggleTeam(t.id)} className={`radio-pill ${form.responsibleTeams.includes(t.id) ? 'selected-yes' : ''}`}>{t.name}</div>
              ))}
            </div>
          </Field>
          <Field label="Grados participantes">
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {['11°', ...GRADOS_PARTICIPANTES].map((g) => (
                <div key={g} onClick={() => toggleGrade(g)} className={`radio-pill ${form.grades.includes(g) ? 'selected-yes' : ''}`}>{g}</div>
              ))}
            </div>
          </Field>
        </div>
      </div>
    </Modal>
  );
}

function activityStatusTone(s) {
  return { planificada: 'blue', 'en curso': 'amber', realizada: 'green', cancelada: 'red' }[s] || 'gray';
}

function ActividadesModule({ state, update }) {
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const toast = useToast();

  const save = (form) => {
    if (form.id) {
      update((s) => ({ ...s, activities: s.activities.map((a) => (a.id === form.id ? form : a)) }));
      toast('Actividad actualizada', 'success');
    } else {
      update((s) => ({ ...s, activities: [...s.activities, { ...form, id: uid('act') }] }));
      toast('Actividad creada', 'success');
    }
    setEditing(null); setCreating(false);
  };
  const remove = (id) => {
    update((s) => ({ ...s, activities: s.activities.filter((a) => a.id !== id) }));
    toast('Actividad eliminada', 'default');
  };

  const participantsOf = (actId) => state.participants.filter((p) => p.activityId === actId);

  return (
    <>
      <div className="filter-bar">
        <div style={{ fontSize: 12.5, color: 'var(--ink-500)' }}>Incluye las 4 misiones base — puedes crear actividades adicionales.</div>
        <button className="btn btn-primary" style={{ marginLeft: 'auto' }} onClick={() => setCreating(true)}><Icon name="plus" size={15} /> Nueva actividad</button>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {state.activities.map((a) => {
          const leaders = a.responsibleLeaders.map((id) => state.leaders.find((l) => l.id === id)).filter(Boolean);
          const teams = a.responsibleTeams.map((id) => state.teams.find((t) => t.id === id)).filter(Boolean);
          const parts = participantsOf(a.id);
          const isOpen = expanded === a.id;
          return (
            <div className="card" key={a.id}>
              <div className="card-pad" style={{ display: 'flex', justifyContent: 'space-between', gap: 14, alignItems: 'flex-start', flexWrap: 'wrap' }}>
                <div style={{ cursor: 'pointer', flex: 1, minWidth: 240 }} onClick={() => setExpanded(isOpen ? null : a.id)}>
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                    {a.code && <Badge tone="blue">{a.code}</Badge>}
                    <Badge tone={activityStatusTone(a.status)}>{a.status}</Badge>
                    <span style={{ fontSize: 12, color: 'var(--ink-500)' }}>{a.date ? fmtDate(a.date) : 'Sin fecha'}</span>
                  </div>
                  <h3 style={{ fontSize: 16, marginTop: 6, color: 'var(--navy-950)' }}>{a.name}</h3>
                  <p style={{ fontSize: 12.5, color: 'var(--ink-500)', marginTop: 4 }}>{a.place || 'Lugar por definir'} · {parts.length} participantes · {leaders.length} leaders responsables</p>
                </div>
                <div className="row-actions">
                  <button className="icon-btn" onClick={() => setEditing(a)}><Icon name="edit" size={15} /></button>
                  <button className="icon-btn" onClick={() => setDeleting(a)}><Icon name="trash" size={15} /></button>
                </div>
              </div>
              {isOpen && (
                <div style={{ borderTop: '1px solid var(--ink-100)', padding: 20 }}>
                  {a.description && <p style={{ fontSize: 13, color: 'var(--ink-700)', marginBottom: 10 }}>{a.description}</p>}
                  {a.objective && <p style={{ fontSize: 12.5, color: 'var(--ink-500)', marginBottom: 14 }}><b>Objetivo:</b> {a.objective}</p>}
                  <div className="grid-3">
                    <div>
                      <div style={{ fontSize: 11.5, textTransform: 'uppercase', color: 'var(--ink-500)', fontWeight: 700, marginBottom: 6 }}>Leaders responsables</div>
                      {leaders.length ? leaders.map((l) => <div key={l.id} style={{ fontSize: 12.5, padding: '3px 0' }}>{l.fullName}</div>) : <div style={{ fontSize: 12, color: 'var(--ink-500)' }}>—</div>}
                    </div>
                    <div>
                      <div style={{ fontSize: 11.5, textTransform: 'uppercase', color: 'var(--ink-500)', fontWeight: 700, marginBottom: 6 }}>Equipos</div>
                      {teams.length ? teams.map((t) => <TeamPill key={t.id} team={t} />) : <div style={{ fontSize: 12, color: 'var(--ink-500)' }}>—</div>}
                    </div>
                    <div>
                      <div style={{ fontSize: 11.5, textTransform: 'uppercase', color: 'var(--ink-500)', fontWeight: 700, marginBottom: 6 }}>Grados participantes</div>
                      {a.grades.length ? a.grades.map((g) => <Badge key={g} tone="gray">{g}</Badge>) : <div style={{ fontSize: 12, color: 'var(--ink-500)' }}>—</div>}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {(creating || editing) && (
        <ActivityFormModal initial={editing} leaders={state.leaders} teams={state.teams} onClose={() => { setCreating(false); setEditing(null); }} onSave={save} />
      )}
      {deleting && (
        <ConfirmModal title="Eliminar actividad" danger message={`¿Eliminar "${deleting.name}"? Los registros de participantes que la referencian conservarán el vínculo roto.`} onConfirm={() => remove(deleting.id)} onClose={() => setDeleting(null)} />
      )}
    </>
  );
}
/* ============================================================
   EVALUACIONES MODULE
   ============================================================ */
function EvaluacionesModule({ state, setView, openPassport }) {
  const [sortDesc, setSortDesc] = useState(true);
  const weightSum = state.criteria.reduce((a, c) => a + c.weight, 0);

  const rows = state.leaders.map((l) => {
    const p = state.passports[l.id];
    const nota = p ? calcFinalNoteStrict(p.scores, state.criteria) : null;
    const team = state.teams.find((t) => t.id === l.teamId);
    return { leader: l, team, nota };
  }).sort((a, b) => {
    if (a.nota == null && b.nota == null) return 0;
    if (a.nota == null) return 1;
    if (b.nota == null) return -1;
    return sortDesc ? b.nota - a.nota : a.nota - b.nota;
  });

  const evaluated = rows.filter((r) => r.nota != null);
  const avg = evaluated.length ? round1(evaluated.reduce((a, r) => a + r.nota, 0) / evaluated.length) : null;

  return (
    <>
      {weightSum !== 100 && (
        <div style={{ background: 'var(--amber-100)', color: '#8a5c00', padding: '10px 14px', borderRadius: 10, fontSize: 13, marginBottom: 16 }}>
          ⚠️ Los criterios de evaluación suman {weightSum}%, no 100%. Ajusta los porcentajes en <b>Configuración</b> para que el cálculo sea exacto.
        </div>
      )}
      <div className="stat-grid" style={{ marginBottom: 20 }}>
        <StatCard label="Promedio del proyecto" value={avg != null ? avg.toFixed(1) : '—'} sub="Escala 0.0 – 10.0" accent="var(--navy-900)" emoji="⭐" />
        <StatCard label="Leaders evaluados" value={evaluated.length} sub={`de ${state.leaders.length} registrados`} accent="var(--green-600)" emoji="✅" />
        <StatCard label="Criterios activos" value={state.criteria.length} sub={`Suman ${weightSum}%`} accent="var(--blue-500)" emoji="📐" />
      </div>

      <div className="section-title">
        <h2>Desempeño por criterio (promedio del grupo)</h2>
      </div>
      <div className="card card-pad" style={{ marginBottom: 22 }}>
        {evaluated.length === 0 ? <EmptyState emoji="📊" title="Sin evaluaciones registradas" text="Evalúa a los Language Leaders desde su Language Passport." /> :
          state.criteria.map((c) => {
            const scores = evaluated.map((r) => state.passports[r.leader.id].scores[c.id]).filter((v) => v != null);
            const avgC = scores.length ? scores.reduce((a, b) => a + Number(b), 0) / scores.length : 0;
            return (
              <div className="mini-bar-row" key={c.id}>
                <div className="lbl">{c.name}</div>
                <div className="progress"><div style={{ width: `${(avgC / 10) * 100}%` }} /></div>
                <div className="pct">{scores.length ? avgC.toFixed(1) : '—'}</div>
              </div>
            );
          })}
      </div>

      <div className="section-title">
        <h2>Notas individuales</h2>
        <button className="btn btn-ghost btn-sm" onClick={() => setSortDesc((s) => !s)}>Ordenar {sortDesc ? '↓' : '↑'}</button>
      </div>
      {rows.length === 0 ? (
        <div className="card"><EmptyState emoji="🪪" title="No hay Language Leaders" text="Registra estudiantes en el módulo Grado 11°." action={<button className="btn btn-primary" onClick={() => setView('grado11')}>Ir a Grado 11°</button>} /></div>
      ) : (
        <div className="card table-wrap">
          <table className="data-table">
            <thead><tr><th>Estudiante</th><th>Equipo</th><th>Nota final</th><th></th></tr></thead>
            <tbody>
              {rows.map(({ leader, team, nota }) => (
                <tr key={leader.id}>
                  <td><div className="name-cell">{leader.photo ? <img src={leader.photo} className="avatar" /> : <div className="avatar" />}<div className="n">{leader.fullName}</div></div></td>
                  <td><TeamPill team={team} /></td>
                  <td>{nota != null ? <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 15, color: nota >= 8 ? 'var(--green-600)' : nota >= 6 ? '#8a5c00' : 'var(--red-600)' }}>{nota.toFixed(1)} / 10.0</span> : <span style={{ color: 'var(--ink-500)' }}>Pendiente</span>}</td>
                  <td><button className="btn btn-outline btn-sm" onClick={() => openPassport(leader.id)}>Ver Passport</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

/* ============================================================
   REPORTES MODULE
   ============================================================ */
function ReportesModule({ state }) {
  const toast = useToast();

  const exportLeaders = (fmt) => {
    const rows = state.leaders.map((l) => {
      const p = state.passports[l.id];
      const nota = p ? calcFinalNoteStrict(p.scores, state.criteria) : null;
      const team = state.teams.find((t) => t.id === l.teamId);
      return { Nombre: l.fullName, Grupo: l.grupo, Equipo: team ? team.name : '', Rol: l.role, Estado: l.status, 'Nota final': nota != null ? nota.toFixed(1) : '', 'Fecha ingreso': l.joinDate };
    });
    if (!rows.length) { toast('No hay datos de Grado 11° para exportar', 'error'); return; }
    if (fmt === 'csv') downloadFile('LanguageLeaders_11.csv', toCSV(rows), 'text/csv');
    else exportExcel(rows, 'LanguageLeaders_11.xlsx', 'Grado 11');
    toast('Exportación generada', 'success');
  };

  const exportParticipants = (fmt) => {
    const rows = state.participants.map((p) => {
      const act = state.activities.find((a) => a.id === p.activityId);
      const cert = state.certificates.find((c) => c.id === p.certificateId);
      return { Nombre: p.fullName, Grado: p.grade, Grupo: p.group, Actividad: act ? act.name : '', Fecha: p.date, Estado: p.participationStatus, Comportamiento: p.behavior === true ? 'Sí' : p.behavior === false ? 'No' : '', Certificado: cert ? cert.code : '' };
    });
    if (!rows.length) { toast('No hay participantes para exportar', 'error'); return; }
    if (fmt === 'csv') downloadFile('Participantes_ClubLenguas.csv', toCSV(rows), 'text/csv');
    else exportExcel(rows, 'Participantes_ClubLenguas.xlsx', 'Participantes');
    toast('Exportación generada', 'success');
  };

  const exportCertificates = (fmt) => {
    const rows = state.certificates.map((c) => {
      const p = state.participants.find((pp) => pp.id === c.participantId);
      const a = state.activities.find((aa) => aa.id === c.activityId);
      return { Código: c.code, Estudiante: p ? p.fullName : '', Actividad: a ? a.name : '', Tipo: c.recognitionType, Fecha: c.date, Estado: c.status };
    });
    if (!rows.length) { toast('No hay certificados para exportar', 'error'); return; }
    if (fmt === 'csv') downloadFile('Certificados.csv', toCSV(rows), 'text/csv');
    else exportExcel(rows, 'Certificados.xlsx', 'Certificados');
    toast('Exportación generada', 'success');
  };

  const exportBonuses = (fmt) => {
    const rows = state.bonuses.map((b) => {
      const p = state.participants.find((pp) => pp.id === b.participantId);
      return { Estudiante: p ? p.fullName : '', 'Nota original (%)': b.originalScore, Bonificación: b.applied ? `+${b.bonus}` : '0', 'Nota nueva (%)': b.newScore, Aplicada: b.applied ? 'Sí' : 'No', Motivo: b.reason, Fecha: b.date, Responsable: b.responsible };
    });
    if (!rows.length) { toast('No hay bonificaciones registradas', 'error'); return; }
    if (fmt === 'csv') downloadFile('Bonificaciones.csv', toCSV(rows), 'text/csv');
    else exportExcel(rows, 'Bonificaciones.xlsx', 'Bonificaciones');
    toast('Exportación generada', 'success');
  };

  const ReportCard = ({ icon, title, desc, count, onCSV, onExcel }) => (
    <div className="card card-pad">
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', marginBottom: 14 }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: 'var(--blue-50)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--navy-800)', flexShrink: 0 }}><Icon name={icon} size={19} /></div>
        <div>
          <h3 style={{ fontSize: 14.5, color: 'var(--navy-950)' }}>{title}</h3>
          <p style={{ fontSize: 12, color: 'var(--ink-500)', marginTop: 2 }}>{desc}</p>
        </div>
        <div style={{ marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontWeight: 700, color: 'var(--navy-800)' }}>{count}</div>
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn btn-outline btn-sm" onClick={onCSV}><Icon name="download" size={13} /> CSV</button>
        <button className="btn btn-outline btn-sm" onClick={onExcel}><Icon name="download" size={13} /> Excel</button>
      </div>
    </div>
  );

  return (
    <div className="grid-2">
      <ReportCard icon="leaders" title="Listado y evaluación — Grado 11°" desc="Nombre, equipo, rol, estado y nota final." count={state.leaders.length} onCSV={() => exportLeaders('csv')} onExcel={() => exportLeaders('xlsx')} />
      <ReportCard icon="participants" title="Participantes" desc="Registro completo por grado y actividad." count={state.participants.length} onCSV={() => exportParticipants('csv')} onExcel={() => exportParticipants('xlsx')} />
      <ReportCard icon="certificates" title="Certificados" desc="Códigos, estudiantes y actividades certificadas." count={state.certificates.length} onCSV={() => exportCertificates('csv')} onExcel={() => exportCertificates('xlsx')} />
      <ReportCard icon="bonus" title="Bonificaciones académicas" desc="Notas originales, bonificación aplicada y nota final." count={state.bonuses.length} onCSV={() => exportBonuses('csv')} onExcel={() => exportBonuses('xlsx')} />
    </div>
  );
}
/* ============================================================
   CONFIGURACIÓN MODULE
   ============================================================ */
function TeamFormModal({ initial, onClose, onSave }) {
  const [form, setForm] = useState(initial || { id: '', name: '', description: '', color: '#2851a8' });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  return (
    <Modal title={initial ? 'Editar equipo' : 'Nuevo equipo'} onClose={onClose} footer={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!form.name.trim()} onClick={() => onSave(form)}>Guardar</button>
      </>
    }>
      <Field label="Nombre del equipo" required><input type="text" value={form.name} onChange={(e) => set('name', e.target.value)} /></Field>
      <Field label="Descripción"><input type="text" value={form.description} onChange={(e) => set('description', e.target.value)} /></Field>
      <Field label="Color"><input type="color" value={form.color} onChange={(e) => set('color', e.target.value)} style={{ width: 70, height: 36, padding: 2 }} /></Field>
    </Modal>
  );
}

function TeamsConfig({ state, update }) {
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const toast = useToast();

  const save = (form) => {
    if (form.id) update((s) => ({ ...s, teams: s.teams.map((t) => (t.id === form.id ? form : t)) }));
    else update((s) => ({ ...s, teams: [...s.teams, { ...form, id: uid('tm') }] }));
    toast('Equipo guardado', 'success');
    setEditing(null); setCreating(false);
  };
  const remove = (id) => {
    update((s) => ({ ...s, teams: s.teams.filter((t) => t.id !== id), leaders: s.leaders.map((l) => (l.teamId === id ? { ...l, teamId: '' } : l)) }));
    toast('Equipo eliminado', 'default');
  };

  return (
    <div className="card">
      <div className="card-header"><h3>Equipos y roles</h3><button className="btn btn-primary btn-sm" onClick={() => setCreating(true)}><Icon name="plus" size={14} /> Nuevo equipo</button></div>
      <div className="table-wrap">
        <table className="data-table">
          <thead><tr><th>Equipo</th><th>Descripción</th><th>Miembros</th><th></th></tr></thead>
          <tbody>
            {state.teams.map((t) => (
              <tr key={t.id}>
                <td><TeamPill team={t} /></td>
                <td style={{ fontSize: 12.5, color: 'var(--ink-500)' }}>{t.description}</td>
                <td>{state.leaders.filter((l) => l.teamId === t.id).length}</td>
                <td><div className="row-actions"><button className="icon-btn" onClick={() => setEditing(t)}><Icon name="edit" size={14} /></button><button className="icon-btn" onClick={() => setDeleting(t)}><Icon name="trash" size={14} /></button></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {(creating || editing) && <TeamFormModal initial={editing} onClose={() => { setCreating(false); setEditing(null); }} onSave={save} />}
      {deleting && <ConfirmModal title="Eliminar equipo" danger message={`¿Eliminar el equipo "${deleting.name}"? Los Leaders asignados quedarán sin equipo.`} onConfirm={() => remove(deleting.id)} onClose={() => setDeleting(null)} />}
    </div>
  );
}

function CriteriaConfig({ state, update }) {
  const [local, setLocal] = useState(state.criteria);
  const toast = useToast();
  useEffect(() => setLocal(state.criteria), [state.criteria]);
  const sum = local.reduce((a, c) => a + Number(c.weight || 0), 0);

  const setWeight = (id, w) => setLocal((cs) => cs.map((c) => (c.id === id ? { ...c, weight: w } : c)));
  const setName = (id, n) => setLocal((cs) => cs.map((c) => (c.id === id ? { ...c, name: n } : c)));
  const addCriterion = () => setLocal((cs) => [...cs, { id: uid('cr'), name: 'Nuevo criterio', weight: 0 }]);
  const removeCriterion = (id) => setLocal((cs) => cs.filter((c) => c.id !== id));
  const save = () => {
    update((s) => ({ ...s, criteria: local }));
    toast(sum === 100 ? 'Criterios guardados (100%)' : `Criterios guardados — atención: suman ${sum}%`, sum === 100 ? 'success' : 'default');
  };

  return (
    <div className="card">
      <div className="card-header"><h3>Criterios de evaluación (Grado 11°)</h3><span style={{ fontSize: 12.5, fontFamily: 'var(--font-mono)', fontWeight: 700, color: sum === 100 ? 'var(--green-600)' : 'var(--red-600)' }}>Suma: {sum}%</span></div>
      <div className="card-pad">
        {local.map((c) => (
          <div key={c.id} className="field-row" style={{ alignItems: 'center', marginBottom: 8 }}>
            <input type="text" value={c.name} onChange={(e) => setName(c.id, e.target.value)} style={{ flex: 3, padding: '8px 10px', border: '1px solid var(--ink-100)', borderRadius: 8, fontSize: 13 }} />
            <input type="number" min="0" max="100" value={c.weight} onChange={(e) => setWeight(c.id, Number(e.target.value))} style={{ flex: 1, padding: '8px 10px', border: '1px solid var(--ink-100)', borderRadius: 8, fontSize: 13 }} />
            <span style={{ fontSize: 12, color: 'var(--ink-500)' }}>%</span>
            <button className="icon-btn" onClick={() => removeCriterion(c.id)}><Icon name="trash" size={13} /></button>
          </div>
        ))}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 14 }}>
          <button className="btn btn-outline btn-sm" onClick={addCriterion}><Icon name="plus" size={14} /> Añadir criterio</button>
          <button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14} /> Guardar criterios</button>
        </div>
        {sum !== 100 && <div style={{ fontSize: 12, color: 'var(--red-600)', marginTop: 8 }}>Los porcentajes deben sumar 100% para que la nota final sea exacta.</div>}
      </div>
    </div>
  );
}

function GeneralConfig({ state, update }) {
  const [local, setLocal] = useState(state.config);
  const toast = useToast();
  useEffect(() => setLocal(state.config), [state.config]);
  const set = (k, v) => setLocal((c) => ({ ...c, [k]: v }));
  const save = () => { update((s) => ({ ...s, config: local })); toast('Configuración guardada', 'success'); };

  return (
    <div className="card card-pad">
      <div className="field-row">
        <Field label="Institución"><input type="text" value={local.institution} onChange={(e) => set('institution', e.target.value)} /></Field>
        <Field label="Ubicación"><input type="text" value={local.location} onChange={(e) => set('location', e.target.value)} /></Field>
      </div>
      <div className="field-row">
        <Field label="Nombre del programa"><input type="text" value={local.programName} onChange={(e) => set('programName', e.target.value)} /></Field>
        <Field label="Año"><input type="number" value={local.year} onChange={(e) => set('year', Number(e.target.value))} /></Field>
      </div>
      <div className="field-row">
        <Field label="Coordinador(a)"><input type="text" value={local.coordinatorName} onChange={(e) => set('coordinatorName', e.target.value)} /></Field>
        <Field label="Cargo"><input type="text" value={local.coordinatorRole} onChange={(e) => set('coordinatorRole', e.target.value)} /></Field>
      </div>
      <Field label="Puntos de bonificación por certificado (puntos porcentuales)" hint="Se suman directamente sobre la nota de actividades, nunca se multiplican.">
        <input type="number" step="0.1" value={local.bonusPoints} onChange={(e) => set('bonusPoints', Number(e.target.value))} style={{ maxWidth: 140 }} />
      </Field>
      <div style={{ textAlign: 'right' }}><button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14} /> Guardar</button></div>
    </div>
  );
}

function DataConfig({ state, replaceState }) {
  const toast = useToast();
  const fileRef = useRef(null);
  const [resetting, setResetting] = useState(false);

  const exportBackup = () => {
    downloadFile(`LanguageLeadersXXI_backup_${todayISO()}.json`, JSON.stringify(state, null, 2), 'application/json');
    toast('Copia de seguridad descargada', 'success');
  };
  const importBackup = async (file) => {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      replaceState(parsed);
      toast('Datos importados correctamente', 'success');
    } catch (e) {
      toast('El archivo no es una copia de seguridad válida', 'error');
    }
  };
  const doReset = () => {
    replaceState(seedState());
    toast('La aplicación se reinició a sus valores iniciales', 'default');
    setResetting(false);
  };

  return (
    <div className="card card-pad">
      <h3 style={{ fontSize: 14.5, marginBottom: 6, color: 'var(--navy-950)' }}>Copia de seguridad</h3>
      <p style={{ fontSize: 12.5, color: 'var(--ink-500)', marginBottom: 14 }}>Todos los datos se guardan localmente en este dispositivo. Exporta una copia periódicamente para no perder información.</p>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <button className="btn btn-outline" onClick={exportBackup}><Icon name="download" size={15} /> Exportar copia (.json)</button>
        <button className="btn btn-outline" onClick={() => fileRef.current.click()}><Icon name="upload" size={15} /> Importar copia</button>
        <input ref={fileRef} type="file" accept=".json" style={{ display: 'none' }} onChange={(e) => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; }} />
        <button className="btn btn-danger" onClick={() => setResetting(true)}><Icon name="trash" size={15} /> Reiniciar aplicación</button>
      </div>
      {resetting && <ConfirmModal title="Reiniciar aplicación" danger message="Esto borrará todos los Leaders, participantes, certificados y evaluaciones registrados en este dispositivo. Esta acción no se puede deshacer." onConfirm={doReset} onClose={() => setResetting(false)} />}
    </div>
  );
}

function ConfiguracionModule({ state, update, replaceState }) {
  const [tab, setTab] = useState('general');
  return (
    <>
      <div className="tabs">
        <button className={`tab ${tab === 'general' ? 'active' : ''}`} onClick={() => setTab('general')}>General</button>
        <button className={`tab ${tab === 'equipos' ? 'active' : ''}`} onClick={() => setTab('equipos')}>Equipos y roles</button>
        <button className={`tab ${tab === 'criterios' ? 'active' : ''}`} onClick={() => setTab('criterios')}>Criterios de evaluación</button>
        <button className={`tab ${tab === 'datos' ? 'active' : ''}`} onClick={() => setTab('datos')}>Datos y copia de seguridad</button>
      </div>
      {tab === 'general' && <GeneralConfig state={state} update={update} />}
      {tab === 'equipos' && <TeamsConfig state={state} update={update} />}
      {tab === 'criterios' && <CriteriaConfig state={state} update={update} />}
      {tab === 'datos' && <DataConfig state={state} replaceState={replaceState} />}
    </>
  );
}
/* ============================================================
   ROOT APP
   ============================================================ */
const VIEW_TITLES = {
  dashboard: 'Dashboard del Docente',
  grado11: 'Grado 11° — Language Leaders',
  participantes: 'Participantes — Club de Lenguas',
  actividades: 'Actividades del Club',
  evaluaciones: 'Evaluaciones — Grado 11°',
  certificados: 'Certificados',
  carnets: 'Carnets digitales',
  reportes: 'Reportes y exportación',
  configuracion: 'Configuración',
};
const VIEW_CRUMBS = {
  dashboard: 'Resumen general del proyecto',
  grado11: 'Language Leaders · Equipos · Roles',
  participantes: 'Registro de participación por grado',
  actividades: 'Misiones y encuentros del club',
  evaluaciones: 'Notas 0.0–10.0 y desempeño por criterio',
  certificados: 'Generación, listado y verificación',
  carnets: 'Carnet digital con QR de verificación',
  reportes: 'Exportar a PDF, Excel y CSV',
  configuracion: 'Equipos, criterios e institución',
};

function App() {
  const [state, setState] = useState(loadState);
  const [view, setView] = useState('home');
  const [mobileOpen, setMobileOpen] = useState(false);
  const [passportLeaderId, setPassportLeaderId] = useState(null);
  const [carnetLeaderId, setCarnetLeaderId] = useState(null);
  const [pendingParticipant, setPendingParticipant] = useState(null);

  useEffect(() => { saveState(state); }, [state]);

  const update = useCallback((fn) => setState((s) => fn(s)), []);
  const replaceState = useCallback((newState) => setState(newState), []);

  const openPassport = (leaderId) => { setPassportLeaderId(leaderId); setView('grado11'); };
  const openCarnet = (leaderId) => { setCarnetLeaderId(leaderId); setView('carnets'); };
  const handleGenerateCertificate = (participant) => { setPendingParticipant(participant); setView('certificados'); };

  if (view === 'home') {
    return (
      <ToastMount>
        <Landing setView={setView} state={state} />
      </ToastMount>
    );
  }

  const counts = {
    grado11: state.leaders.length || null,
    participantes: state.participants.length || null,
    certificados: state.certificates.length || null,
  };

  let body = null;
  if (view === 'dashboard') body = <Dashboard state={state} setView={setView} />;
  else if (view === 'grado11') {
    const leader = passportLeaderId ? state.leaders.find((l) => l.id === passportLeaderId) : null;
    body = leader
      ? <PassportView leader={leader} state={state} update={update} onBack={() => setPassportLeaderId(null)} onOpenCarnet={openCarnet} />
      : <Grado11Module state={state} update={update} setView={setView} openPassport={openPassport} openCarnet={openCarnet} />;
  }
  else if (view === 'participantes') body = <ParticipantesModule state={state} update={update} setView={setView} onGenerateCertificate={handleGenerateCertificate} />;
  else if (view === 'actividades') body = <ActividadesModule state={state} update={update} />;
  else if (view === 'evaluaciones') body = <EvaluacionesModule state={state} setView={setView} openPassport={openPassport} />;
  else if (view === 'certificados') body = <CertificatesModule state={state} update={update} setView={setView} pendingParticipant={pendingParticipant} clearPending={() => setPendingParticipant(null)} />;
  else if (view === 'carnets') {
    const leader = carnetLeaderId ? state.leaders.find((l) => l.id === carnetLeaderId) : null;
    body = leader
      ? <CarnetView leader={leader} state={state} onBack={() => setCarnetLeaderId(null)} />
      : <CarnetsGallery state={state} setView={setView} openCarnet={openCarnet} />;
  }
  else if (view === 'reportes') body = <ReportesModule state={state} />;
  else if (view === 'configuracion') body = <ConfiguracionModule state={state} update={update} replaceState={replaceState} />;

  return (
    <ToastMount>
      <div className="app-shell">
        <Sidebar view={view} setView={(v) => { setView(v); setPassportLeaderId(null); setCarnetLeaderId(null); }} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} counts={counts} />
        <div className="main">
          <MobileTopbar setMobileOpen={setMobileOpen} title={VIEW_TITLES[view]} />
          <Topbar title={VIEW_TITLES[view]} crumbs={VIEW_CRUMBS[view]} />
          <div className="content">{body}</div>
        </div>
      </div>
    </ToastMount>
  );
}

function ToastMount({ children }) {
  return <ToastProvider>{children}</ToastProvider>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>

</body>
</html>
