<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo de Colores Docentes</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --card-bg: #fff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            margin-top: 0;
            color: #7f8c8d;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Zona de Controles */
        #controls {
            margin-bottom: 30px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        button:hover {
            background-color: #34495e;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        /* Indicador de estado */
        #status-message {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 20px;
            height: 25px;
        }

        /* Zona de Resultados Finales (Tabla) */
        #results-zone {
            width: 100%;
            max-width: 800px;
            display: none; 
        }

        #results-zone h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .result-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .color-box {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .docente-name {
            font-size: 1.1em;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>Sorteo de Colores Temáticos 🎨</h1>
    <p class="subtitle">Semana Cultural XXI - Colegio Siglo XXI</p>

    <!-- Controles -->
    <div id="controls">
        <button id="btn-draw" onclick="realizarSorteoCompleto()">¡Realizar Sorteo!</button>
        <button id="btn-reset" onclick="resetSorteo()" style="background-color: #7f8c8d; margin-left: 10px; display:none;">Reiniciar</button>
    </div>

    <!-- Mensaje de estado -->
    <div id="status-message">Esperando inicio...</div>

    <!-- Resultados Finales -->
    <div id="results-zone">
        <h2>Resultados Finales</h2>
        <div class="results-grid" id="final-grid">
            <!-- Las tarjetas de resultados se generarán aquí -->
        </div>
    </div>

    <script>
        // 1. Datos iniciales
        const docentesIniciales = [
            "Eimys", "Maria Isabel", "Yuli", "Alejandro", "Kilian", 
            "Yorlenis", "Luisa", "Dayana", "Zaira", "Lareanys", 
            "Yonatha", "Kelithza", "Administración"
        ];

        // 2. Definición de la Paleta Temática
        const paletaColores = [
            { nombre: "Azul Innovación", hex: "#007bff", text: "white" },
            { nombre: "Verde Sostenible", hex: "#28a745", text: "white" },
            { nombre: "Naranja Emprendedor", hex: "#fd7e14", text: "white" },
            { nombre: "Morado IA", hex: "#6f42c1", text: "white" },
            { nombre: "Rojo Pasión Cultural", hex: "#dc3545", text: "white" },
            { nombre: "Cian Tecnología", hex: "#17a2b8", text: "white" },
            { nombre: "Amarillo Creativo", hex: "#ffc107", text: "black" },
            { nombre: "Rosa Empatía", hex: "#e83e8c", text: "white" },
            { nombre: "Teal Futuro", hex: "#20c997", text: "white" },
            { nombre: "Marrón Tierra ODS", hex: "#795548", text: "white" },
            { nombre: "Gris Sofisticado", hex: "#6c757d", text: "white" },
            { nombre: "Lima Energía", hex: "#ccff00", text: "black" },
            { nombre: "Vinotinto Especial", hex: "#800020", text: "white" } // <-- Color reservado para Yonatha
        ];

        let docentesRestantes = [];
        let coloresRestantes = [];
        let resultadosFinales = [];

        const btnDraw = document.getElementById('btn-draw');
        const btnReset = document.getElementById('btn-reset');
        const statusMessage = document.getElementById('status-message');
        const resultsZone = document.getElementById('results-zone');
        const finalGrid = document.getElementById('final-grid');

        function realizarSorteoCompleto() {
            // Preparamos las listas
            docentesRestantes = [...docentesIniciales];
            coloresRestantes = [...paletaColores];
            resultadosFinales = [];

            btnDraw.disabled = true; 
            statusMessage.innerText = "Sorteando colores...";

            // Bucle para sortear a todos instantáneamente
            while (docentesRestantes.length > 0) {
                // 1. Elegimos al docente al azar
                const indiceDocente = Math.floor(Math.random() * docentesRestantes.length);
                const docenteElegido = docentesRestantes.splice(indiceDocente, 1)[0];

                let indiceColor;
                
                // 2. Lógica trucada para Yonatha
                if (docenteElegido === "Yonatha") {
                    indiceColor = coloresRestantes.findIndex(c => c.nombre === "Vinotinto Especial");
                    if (indiceColor === -1) indiceColor = 0; 
                } else {
                    // Nos aseguramos que nadie más tome el vinotinto mientras Yonatha falte
                    do {
                        indiceColor = Math.floor(Math.random() * coloresRestantes.length);
                    } while (coloresRestantes[indiceColor].nombre === "Vinotinto Especial" && docentesRestantes.includes("Yonatha"));
                }

                const colorElegido = coloresRestantes.splice(indiceColor, 1)[0];
                resultadosFinales.push({ docente: docenteElegido, color: colorElegido });
            }

            // Ponemos un pequeño retraso visual para dar emoción de "carga" (medio segundo)
            setTimeout(() => {
                finalizarSorteo();
            }, 500); 
        }

        function finalizarSorteo() {
            btnDraw.style.display = "none";
            btnReset.style.display = "inline-block";
            statusMessage.innerText = "¡Sorteo Finalizado!";
            
            mostrarResultadosFinales();
        }

        function mostrarResultadosFinales() {
            resultsZone.style.display = "block";
            finalGrid.innerHTML = ""; 

            resultadosFinales.forEach(res => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="color-box" style="background-color: ${res.color.hex};" title="${res.color.nombre}"></div>
                    <div class="docente-name">${res.docente}</div>
                `;
                finalGrid.appendChild(card);
            });
        }

        function resetSorteo() {
            btnDraw.style.display = "inline-block";
            btnDraw.disabled = false;
            btnReset.style.display = "none";
            
            resultsZone.style.display = "none";
            statusMessage.innerText = "Esperando inicio...";
        }
    </script>
</body>
</html>
