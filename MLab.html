<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLab v3 — Mendoza Molina Performance Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212;--card:#1E1E1E;--card2:#242424;--red:#E53935;--red-dim:#7a201d;
  --blue:#2979FF;--text:#FFFFFF;--text2:#CFCFCF;--text3:#8A8A8A;
  --green:#36C26B;--yellow:#E6B400;--border:#2C2C2C;--radius:14px;--side-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.mono{font-family:'Space Mono',monospace;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s ease,visibility .6s ease;}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
#splash .logo-svg{width:120px;height:120px;animation:floatLogo 3.5s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(229,57,53,.4));}
@keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#splash h1{font-size:2.6rem;font-weight:800;letter-spacing:.04em;margin-top:20px;}
#splash .sub{color:var(--text2);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;margin-top:6px;font-family:'Space Mono',monospace;}
#splash .slogan{margin-top:26px;color:var(--text3);font-size:.9rem;font-style:italic;}
#splash .bar{width:200px;height:2px;background:#2a2a2a;margin-top:34px;overflow:hidden;border-radius:2px;}
#splash .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--red),var(--blue));animation:loadBar 1.6s ease forwards;}
@keyframes loadBar{to{width:100%;}}

/* LAYOUT */
#app{display:flex;min-height:100vh;}
#sidebar{width:var(--side-w);background:#161616;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .3s ease;}
.side-logo{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid var(--border);}
.side-logo svg{width:32px;height:32px;flex-shrink:0;}
.side-logo .t{font-weight:800;font-size:1.05rem;}
.side-logo .s{font-size:.58rem;color:var(--text3);letter-spacing:.08em;font-family:'Space Mono',monospace;}
nav.navlist{flex:1;overflow-y:auto;padding:12px 8px;}
nav.navlist .navitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--text2);font-size:.84rem;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s;user-select:none;}
nav.navlist .navitem:hover{background:#1d1d1d;color:#fff;}
nav.navlist .navitem.active{background:linear-gradient(90deg,rgba(229,57,53,.18),rgba(229,57,53,.02));color:#fff;box-shadow:inset 3px 0 0 var(--red);}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:.62rem;color:var(--text3);font-family:'Space Mono',monospace;line-height:1.5;}
#main{margin-left:var(--side-w);flex:1;min-height:100vh;padding:26px 34px 70px;max-width:1180px;}
#topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;}
#topbar .greet h2{font-size:1.5rem;font-weight:700;}
#topbar .greet p{color:var(--text3);font-size:.8rem;margin-top:3px;font-family:'Space Mono',monospace;}
#menuBtn{display:none;background:var(--card);border:1px solid var(--border);color:#fff;width:40px;height:40px;border-radius:10px;font-size:1.1rem;cursor:pointer;}
.view{display:none;animation:fadeIn .3s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* COMPONENTS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:980px){.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.stat-card .label{color:var(--text3);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-family:'Space Mono',monospace;}
.stat-card .value{font-size:1.7rem;font-weight:800;margin-top:6px;}
.stat-card .value span{font-size:.9rem;color:var(--text3);font-weight:500;}
.stat-card.accent{border-color:var(--red-dim);}
.stat-card .bar-bg{height:5px;background:#2a2a2a;border-radius:5px;margin-top:12px;overflow:hidden;}
.stat-card .bar-bg i{display:block;height:100%;background:var(--red);}
h3.section-title{font-size:1.05rem;font-weight:700;margin:28px 0 14px;display:flex;align-items:center;gap:8px;}
h3.section-title:first-child{margin-top:0;}
.badge{display:inline-block;font-size:.63rem;padding:3px 8px;border-radius:20px;background:#2a2a2a;color:var(--text2);font-family:'Space Mono',monospace;}
.badge.red{background:rgba(229,57,53,.15);color:#ff8a85;}
.badge.blue{background:rgba(41,121,255,.15);color:#8fb6ff;}
.badge.green{background:rgba(54,194,107,.15);color:#7fe3a4;}
.badge.yellow{background:rgba(230,180,0,.15);color:#f0d060;}
.badge.gray{background:#2a2a2a;color:var(--text3);}
button{font-family:inherit;}
.btn{background:var(--card2);border:1px solid var(--border);color:#fff;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .15s;}
.btn:hover{border-color:#555;transform:translateY(-1px);}
.btn.primary{background:var(--red);border-color:var(--red);}
.btn.primary:hover{background:#ff4a44;}
.btn.blue{background:var(--blue);border-color:var(--blue);}
.btn.green-btn{background:var(--green);border-color:var(--green);color:#fff;}
.btn.small{padding:6px 12px;font-size:.74rem;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
input,select,textarea{background:#171717;border:1px solid var(--border);color:#fff;border-radius:8px;padding:9px 11px;font-size:.84rem;font-family:inherit;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);}
label.flabel{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px;font-family:'Space Mono',monospace;}
.field{margin-bottom:12px;}
table{width:100%;border-collapse:collapse;}
table th{text-align:left;font-size:.66rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px;font-family:'Space Mono',monospace;border-bottom:1px solid var(--border);}
table td{padding:9px 8px;font-size:.83rem;border-bottom:1px solid #232323;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.tabs .tab{padding:8px 16px;border-radius:9px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:.8rem;font-weight:600;color:var(--text2);}
.tabs .tab.active{background:var(--red);color:#fff;border-color:var(--red);}

/* EXERCISE CARDS */
.exercise{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.exercise.level-S{border-left:3px solid var(--red);}
.exercise.level-A{border-left:3px solid var(--blue);}
.exercise.level-B{border-left:3px solid var(--yellow);}
.exercise.level-C{border-left:3px solid #555;}
.exercise .ex-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;cursor:pointer;}
.exercise .ex-head .name{font-weight:700;font-size:.95rem;}
.exercise .ex-meta{display:flex;gap:12px;color:var(--text3);font-size:.72rem;margin-top:4px;font-family:'Space Mono',monospace;flex-wrap:wrap;}
.exercise .ex-body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 18px;}
.exercise.open .ex-body{max-height:2200px;padding:0 18px 18px;}
.exercise .ex-body .row{margin-bottom:10px;font-size:.82rem;color:var(--text2);line-height:1.55;}
.exercise .ex-body .row b{color:#fff;}
.chev{transition:transform .3s;color:var(--text3);}
.exercise.open .chev{transform:rotate(180deg);}

/* SET LOG TABLE */
.set-section-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:'Space Mono',monospace;padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.set-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.set-row .set-num{width:68px;font-size:.7rem;color:var(--text3);font-family:'Space Mono',monospace;flex-shrink:0;}
.set-row input{flex:1;padding:7px 9px;font-size:.8rem;}
.set-row .rir-input{max-width:62px;}
.set-row input[type=number]{-moz-appearance:textfield;}
.vol-hint{font-size:.68rem;color:var(--text3);font-family:'Space Mono',monospace;margin-bottom:10px;}

/* Double Progression */
.dp-badge{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;font-size:.78rem;font-weight:600;margin-bottom:10px;}
.dp-badge.ready{background:rgba(54,194,107,.12);border:1px solid rgba(54,194,107,.35);color:#7fe3a4;}
.dp-badge.inprogress{background:rgba(41,121,255,.08);border:1px solid rgba(41,121,255,.25);color:#8fb6ff;}
.progress-alert{background:rgba(54,194,107,.12);border:1px solid rgba(54,194,107,.35);color:#7fe3a4;padding:10px 14px;border-radius:9px;font-size:.78rem;margin-top:10px;font-weight:600;}
.warn-alert{background:rgba(230,180,0,.08);border:1px solid rgba(230,180,0,.3);color:#f0d060;padding:8px 12px;border-radius:9px;font-size:.76rem;margin-top:6px;}

/* MODO ENTRENAMIENTO */
#trainMode{display:none;position:fixed;inset:0;background:var(--bg);z-index:1000;overflow-y:auto;padding:20px;}
#trainMode.active{display:block;}
.train-progress{height:3px;background:#222;border-radius:3px;margin-bottom:24px;overflow:hidden;}
.train-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--blue));transition:width .4s ease;}
.train-ex-card{max-width:600px;margin:0 auto;}
.train-ex-name{font-size:1.6rem;font-weight:800;margin-bottom:6px;}
.train-set-row{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:7px;}
.train-set-row .ts-label{width:90px;font-size:.7rem;color:var(--text3);font-family:'Space Mono',monospace;flex-shrink:0;}
.train-set-row input{flex:1;padding:7px 8px;font-size:.82rem;}
.train-set-row .done-btn{background:transparent;border:1px solid var(--border);color:var(--text3);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:.9rem;flex-shrink:0;transition:all .2s;}
.train-set-row.set-done{border-color:var(--green);background:rgba(54,194,107,.06);}
.train-set-row.set-done .done-btn{background:var(--green);color:#fff;border-color:var(--green);}

/* REST TIMER */
#restTimer{display:none;position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 20px;z-index:2000;box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:165px;text-align:center;}
#restTimer.show{display:block;}
#restTimer .rt-label{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;font-family:'Space Mono',monospace;margin-bottom:5px;}
#restTimer .rt-time{font-size:2.2rem;font-weight:800;font-family:'Space Mono',monospace;color:var(--red);}
#restTimer .rt-bar{height:3px;background:#2a2a2a;border-radius:3px;margin-top:8px;overflow:hidden;}
#restTimer .rt-bar i{display:block;height:100%;background:var(--red);transition:width 1s linear;}
#restTimer button{margin-top:10px;width:100%;padding:6px;}

/* CALENDAR & GOALS */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-cell{aspect-ratio:1;border-radius:6px;background:#222;font-size:.6rem;display:flex;align-items:flex-end;justify-content:flex-start;padding:3px;color:var(--text3);}
.cal-cell.done{background:rgba(229,57,53,.55);color:#fff;}
.cal-cell.today{outline:1.5px solid var(--blue);}
.goal-row{margin-bottom:20px;}
.goal-row .gh{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px;}
.goal-row .gbar{height:9px;background:#262626;border-radius:8px;overflow:hidden;}
.goal-row .gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff7b76);}
.empty{color:var(--text3);font-size:.84rem;text-align:center;padding:30px 10px;}

/* TOAST & MODAL */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--card2);border:1px solid var(--border);padding:12px 20px;border-radius:11px;font-size:.84rem;opacity:0;transition:all .3s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:5000;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;}
.modal h4{font-size:1.05rem;margin-bottom:16px;}
.chart-wrap{width:100%;overflow-x:auto;}

/* MIGRATION BANNER */
.migration-banner{background:rgba(41,121,255,.1);border:1px solid rgba(41,121,255,.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:.82rem;color:#8fb6ff;}

@media(max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;padding:20px 16px 70px;}
  #menuBtn{display:block;}
  .set-row{flex-wrap:wrap;}
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polygon points="10,38 30,72 50,28 70,72 90,38 80,78 20,78" fill="#E53935"/>
    <text x="50" y="96" font-family="Sora,sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">MLab</text>
  </svg>
  <h1>MLab</h1>
  <div class="sub">Mendoza Molina Performance Lab</div>

</div>

<!-- REST TIMER -->
<div id="restTimer">
  <div class="rt-label">Descanso</div>

</div>

<!-- MODO ENTRENAMIENTO -->
<div id="trainMode">

  <div style="max-width:600px;margin:20px auto 0;display:flex;gap:10px;flex-wrap:wrap;">
    <button class="btn" id="trainPrevBtn" onclick="trainNav(-1)">← Anterior</button>
    <button class="btn primary" id="trainNextBtn" onclick="trainNav(1)">Siguiente →</button>
    <button class="btn" onclick="exitTrainMode()" style="margin-left:auto;border-color:#5c2222;color:#ff8a85;">Salir</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside id="sidebar">
    <div class="side-logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="10,38 30,72 50,28 70,72 90,38 80,78 20,78" fill="#E53935"/>
      </svg>
      <div><div class="t">MLab</div><div class="s">PERFORMANCE LAB v3</div></div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="side-foot">v3.0 · Datos locales · JSON optimizado</div>
  </aside>
  <main id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="menuBtn">☰</button>
        <div class="greet">
          <h2 id="greetTitle">Bienvenido</h2>
          <p id="greetSub" class="mono"></p>
        </div>
      </div>
      <div id="sessionTimer" style="display:none;background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-family:'Space Mono',monospace;font-size:.78rem;color:var(--text2);">⏱ <span id="sessionTimerTxt">00:00</span></div>
    </div>
    <div id="migrationBanner" style="display:none;" class="migration-banner">
      📦 Se detectó un respaldo antiguo y fue migrado automáticamente al nuevo formato v3.
    </div>
    <div id="views"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<script>
/* =================================================================
   MLab v3.0 — Mendoza Molina Performance Lab
   Refactored storage layer: sessions-based, PR module, DP per-set,
   volume multiplier, migration from v1/v2, no duplicate records.
   ================================================================= */

/* ──────────────────────────────────────────────
   NAV
   ────────────────────────────────────────────── */
const NAV = [
  {id:'inicio',       label:'Inicio',                   icon:'🏠'},
  {id:'hoy',          label:'Entrenamiento del Día',     icon:'⚡'},
  {id:'programa',     label:'Programa de Entrenamiento', icon:'📋'},
  {id:'progresion',   label:'Progresión',               icon:'📈'},
  {id:'bitacora',     label:'Bitácora',                  icon:'📝'},
  {id:'objetivos',    label:'Objetivos',                 icon:'🎯'},
  {id:'estadisticas', label:'Estadísticas',              icon:'📊'},
  {id:'recuperacion', label:'Recuperación',              icon:'🌙'},
  {id:'lesiones',     label:'Prevención de Lesiones',   icon:'🛡️'},
  {id:'config',       label:'Configuración',             icon:'⚙️'},
  {id:'respaldos',    label:'Respaldos',                 icon:'💾'},
];

/* ──────────────────────────────────────────────
   ROUTINE DATA
   Metadata per exercise:
   · level       S|A|B|C  (for ordering & display)
   · restType    compound|secondary|isolation  (→ auto rest timer)
   · restSecs    derived from restType (stored for future reference)
   · equipment   barbell|dumbbell|machine|cable|bodyweight|kettlebell
   · bilateral   true = both sides simultaneously
   · weightMult  1 = user enters total (barbell/machine/cable)
                 2 = user enters ONE dumbbell/side, app ×2 for volume
   · category    compound|isolation
   ────────────────────────────────────────────── */
const REST_SECS = {compound:150, secondary:90, isolation:72};

const ROUTINE = {
lunes:[
  {id:'l1',name:'Sentadilla trasera',      level:'S',restType:'compound', equipment:'barbell',    bilateral:true, weightMult:1,category:'compound',
   muscles:'Cuádriceps, glúteo, core',sets:4,repRange:[6,10],rest:'2-3 min',rir:2,approx:1,effective:4,
   science:'Mayor tensión mecánica posible sobre cuádriceps; base de toda progresión de fuerza en pierna.',
   errors:'Valgo de rodilla, perder tensión abdominal, profundidad inconsistente.',
   tips:'Pecho alto, empuja el piso, excéntrica 2-3s.',variants:'Goblet, frontal, Hack squat.'},
  {id:'l2',name:'Prensa inclinada',        level:'A',restType:'secondary',equipment:'machine',    bilateral:true, weightMult:1,category:'compound',
   muscles:'Cuádriceps, glúteo',sets:3,repRange:[10,14],rest:'90-120s',rir:1,approx:1,effective:3,
   science:'Acumula volumen de cuádriceps con bajo estrés sistémico.',
   errors:'Bloquear rodillas, rango incompleto.',tips:'Pies medios, descenso hasta 90°.',variants:'Prensa unilateral.'},
  {id:'l3',name:'Bulgarian Split Squat',   level:'A',restType:'secondary',equipment:'dumbbell',   bilateral:false,weightMult:2,category:'compound',
   muscles:'Cuádriceps, glúteo (unilateral)',sets:3,repRange:[8,12],rest:'90s',rir:2,approx:1,effective:3,
   science:'Patrón unilateral que corrige desbalances y maximiza tensión en cuádriceps y glúteo.',
   errors:'Rodilla colapsando, torso inclinado.',tips:'Descenso vertical, rodilla sigue la punta del pie.',variants:'Zancada inversa.'},
  {id:'l4',name:'Extensión de cuádriceps', level:'B',restType:'isolation', equipment:'machine',    bilateral:true, weightMult:1,category:'isolation',
   muscles:'Cuádriceps (aislado)',sets:3,repRange:[12,15],rest:'60-75s',rir:1,approx:0,effective:3,
   science:'Tensión directa en recto femoral sin fatiga sistémica.',
   errors:'Impulso, sin pausa arriba.',tips:'Pausa 1s en contracción, control total.',variants:'Extensión unilateral.'},
  {id:'l5',name:'Pantorrilla de pie',      level:'B',restType:'isolation', equipment:'machine',    bilateral:true, weightMult:1,category:'isolation',
   muscles:'Gastrocnemio',sets:4,repRange:[10,15],rest:'60s',rir:1,approx:0,effective:4,
   science:'Gastrocnemio responde mejor con rodilla extendida y rango completo.',
   errors:'Rango parcial, rebotar.',tips:'Pausa en estiramiento y contracción.',variants:'Unilateral, en prensa.'},
  {id:'l6',name:'Step Down',               level:'C',restType:'isolation', equipment:'bodyweight',  bilateral:false,weightMult:1,category:'isolation',

/* ──────────────────────────────────────────────
   STORAGE
   ────────────────────────────────────────────── */
const STORAGE_KEY = 'mlab_v3';
let DATA;

function defaultData(){
  return {
    _version: 3,
    profile:     { name:'Atleta MLab', bodyweight:0, weeklyGoal:'Cumplir las 5 sesiones de la semana' },
    dp:          {},
    sessions:    {},
    prs:         {},
    completions: [],
    goals:       JSON.parse(JSON.stringify(GOALS_DEFAULT)),
    recovery:    {},
  };
}

/** Migrate old v1/v2 format → v3. Returns true if migration occurred. */
function migrateIfNeeded(raw){
  if(raw._version === 3) return false;   // already v3

  const v3 = defaultData();
  v3.profile     = raw.profile     || v3.profile;
  v3.completions = raw.completions || [];
  v3.goals       = raw.goals       || JSON.parse(JSON.stringify(GOALS_DEFAULT));
  v3.recovery    = raw.recovery    || {};

  // Migrate old flat logs[] → sessions[date].exercises[exId]
  const logsArr = raw.logs || [];
  logsArr.forEach(l => {
    const date = l.date || todayStr();
    if(!v3.sessions[date]) v3.sessions[date] = {dayId: l.dayId||'', startTime:'', endTime:'', exercises:{}};
    if(!v3.sessions[date].exercises[l.exerciseId]){
      const ex = exerciseById(l.exerciseId) || {};
      const wSets = Array.isArray(l.reps)
        ? l.reps.map((r,i)=>({ weight: l.weight||0, reps: r, rir: ex.rir||2 }))
        : [{weight: l.weight||0, reps: l.reps||0, rir: ex.rir||2}];
      const vol = wSets.reduce((s,ws)=>s + ws.weight * ws.reps * (ex.weightMult||1), 0);
      v3.sessions[date].exercises[l.exerciseId] = {
        exName: l.exName||'', level: ex.level||'B',
        equipment: ex.equipment||'barbell', bilateral: ex.bilateral!==false,
        weightMult: ex.weightMult||1, restSecs: REST_SECS[ex.restType||'isolation'],
        warmupSets:[], workingSets: wSets,
        totalVolume: vol, pain: l.pain||0, energy: l.energy||3, notes: l.notes||'',
        dp:{readyToIncrease:false,completedRange:false,nextWeight:(l.weight||0)+2.5}
      };
    }
  });

  // Migrate exerciseState → dp + fill in sessions from history
  const oldState = raw.exerciseState || {};
  Object.entries(oldState).forEach(([exId, st]) => {
    v3.dp[exId] = {
      currentWeight: st.weight||0, nextWeight: (st.weight||0)+2.5,
      completedRange:false, readyToIncrease:false, lastSessionDate:''
    };
    // history entries (v2 format)
    if(Array.isArray(st.history)){
      st.history.forEach(h => {
        const date = h.date || todayStr();
        const ex = exerciseById(exId) || {};
        if(!v3.sessions[date]) v3.sessions[date] = {dayId:'', startTime:'', endTime:'', exercises:{}};
        if(!v3.sessions[date].exercises[exId]){
          const wSets = Array.isArray(h.reps)
            ? h.reps.map((r,i)=>({ weight: Array.isArray(h.weights)?h.weights[i]||0:h.weight||0, reps:r, rir: ex.rir||2 }))
            : [];
          const mult = ex.weightMult||1;
          const vol = wSets.reduce((s,ws)=>s + ws.weight*ws.reps*mult, 0);
          v3.sessions[date].exercises[exId] = {
            exName: ex.name||exId, level:ex.level||'B',
            equipment:ex.equipment||'barbell', bilateral:ex.bilateral!==false,
            weightMult:mult, restSecs: REST_SECS[ex.restType||'isolation'],
            warmupSets:[], workingSets:wSets,
            totalVolume:vol, pain:h.pain||0, energy:h.energy||3, notes:h.notes||'',
            dp:{readyToIncrease:false,completedRange:false,nextWeight:(st.weight||0)+2.5}
          };
        }
      });
    }
  });

  // Rebuild PR module from migrated sessions
  Object.values(v3.sessions).forEach(sess => {
    Object.entries(sess.exercises).forEach(([exId, ex]) => {
      updatePR(exId, ex, v3);
    });
  });

  v3._version = 3;
  return {migrated:true, data:v3};
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ DATA = defaultData(); return; }
    const parsed = JSON.parse(raw);
    if(parsed._version !== 3){
      const result = migrateIfNeeded(parsed);
      if(result && result.migrated){
        DATA = result.data;
        save();
        document.getElementById('migrationBanner').style.display='block';
        return;
      }
    }
    DATA = parsed;
    // backfill any missing top-level keys
    const def = defaultData();
    for(const k in def){ if(!(k in DATA)) DATA[k]=def[k]; }
  }catch(e){ DATA = defaultData(); }
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }

/* ──────────────────────────────────────────────
   VOLUME CALCULATION
   Rules:
   · weightMult 1 → user enters total (barbell/machine/cable)
   · weightMult 2 → user enters ONE side (dumbbell), app ×2
   ────────────────────────────────────────────── */
function calcSetVolume(weight, reps, weightMult){
  return (weight || 0) * (reps || 0) * (weightMult || 1);
}
function calcSessionVolume(workingSets, weightMult){
  return workingSets.reduce((s, ws) => s + calcSetVolume(ws.weight, ws.reps, weightMult), 0);
}

/* ──────────────────────────────────────────────
   PR MODULE — updates in-place, no full scan needed
   ────────────────────────────────────────────── */
function updatePR(exId, exSession, targetData){
  const store = targetData || DATA;
  if(!store.prs[exId]) store.prs[exId] = {bestWeight:0, bestReps:0, bestVolume:0, lastUpdated:''};
  const pr = store.prs[exId];
  const wSets = exSession.workingSets || [];
  if(!wSets.length) return;
  const maxW = Math.max(...wSets.map(s=>s.weight||0));
  const maxR = Math.max(...wSets.map(s=>s.reps||0));
  const vol  = exSession.totalVolume || 0;
  let updated = false;
  if(maxW > pr.bestWeight){ pr.bestWeight=maxW; updated=true; }
  if(maxR > pr.bestReps){ pr.bestReps=maxR; updated=true; }
  if(vol  > pr.bestVolume){ pr.bestVolume=vol; updated=true; }
  if(updated) pr.lastUpdated = todayStr();
}

/* ──────────────────────────────────────────────
   DP — Double Progression per exercise
   ────────────────────────────────────────────── */
function getDP(exId){
  if(!DATA.dp[exId]) DATA.dp[exId]={currentWeight:0,nextWeight:0,completedRange:false,readyToIncrease:false,lastSessionDate:''};
  return DATA.dp[exId];
}
function updateDP(exId, ex, workingSets){
  const dp = getDP(exId);
  const maxW = Math.max(...workingSets.map(s=>s.weight||0), dp.currentWeight||0);
  dp.currentWeight = maxW;
  dp.lastSessionDate = todayStr();
  const effSets = workingSets.slice(ex.approx);   // skip warmup-indexed working sets... actually all workingSets are already effective
  const allTop  = effSets.length>0 && effSets.every(s=>(s.reps||0) >= ex.repRange[1]);
  dp.completedRange  = allTop;
  dp.readyToIncrease = allTop;
  dp.nextWeight      = allTop ? maxW + 2.5 : maxW;
  return dp;
}

function todayStr(d){ d=d||new Date(); return d.toISOString().slice(0,10); }
function nowTime(){ const n=new Date(); return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; }
function weekdayIdToday(){ return {0:null,1:'lunes',2:'martes',3:'miercoles',4:'jueves',5:'viernes',6:null}[new Date().getDay()]; }
function allExercises(){ let a=[]; DAYS.forEach(d=>a=a.concat(ROUTINE[d.id].map(e=>({...e,dayId:d.id,dayName:d.name})))); return a; }
function exerciseById(id){ return allExercises().find(e=>e.id===id); }
function motivQuote(){ return MOTIVATIONAL[new Date().getDate()%MOTIVATIONAL.length]; }

/** Get or create today's session record */
function getTodaySession(dayId){
  const date = todayStr();
  if(!DATA.sessions[date]) DATA.sessions[date]={dayId, startTime:nowTime(), endTime:'', exercises:{}};
  return DATA.sessions[date];
}

/** Get all exercise entries across all sessions, sorted newest first */
function getExerciseHistory(exId){
  return Object.entries(DATA.sessions)
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .map(([date, sess])=>({ date, data: sess.exercises[exId] }))
    .filter(x=>x.data);
}

let sessionStartMs = null;
let sessionTimerInterval = null;
function startSessionTimer(){
  if(sessionTimerInterval) return;  // already running
  sessionStartMs = Date.now();
  const el = document.getElementById('sessionTimer');
  const txt = document.getElementById('sessionTimerTxt');
  el.style.display='block';
  sessionTimerInterval = setInterval(()=>{
    const s = Math.floor((Date.now()-sessionStartMs)/1000);
    const m = Math.floor(s/60), ss = s%60;
    txt.textContent = `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  },1000);
}
function stopSessionTimer(){
  clearInterval(sessionTimerInterval); sessionTimerInterval=null;
  document.getElementById('sessionTimer').style.display='none';
}

/* REST TIMER */
let restInterval=null;
function startRestTimer(seconds){
  clearInterval(restInterval);
  const el=document.getElementById('restTimer'), timeEl=document.getElementById('rtTime'), barEl=document.getElementById('rtBar');
  el.classList.add('show');
  let remaining=seconds; const total=seconds;
  function tick(){
    const m=Math.floor(remaining/60), s=remaining%60;
    timeEl.textContent=`${m}:${s<10?'0'+s:s}`;
    barEl.style.width=(remaining/total*100)+'%';
    if(remaining<=0){ clearInterval(restInterval); el.classList.remove('show'); toast('⏰ ¡Descansa terminado!'); return; }
    remaining--;
  }
  tick(); restInterval=setInterval(tick,1000);
}
function stopRestTimer(){ clearInterval(restInterval); document.getElementById('restTimer').classList.remove('show'); }

/* ──────────────────────────────────────────────
   LOG EXERCISE — core v3 save function
   Creates ONE record per exercise per session date.
   Updates existing record if called again same day.
   ────────────────────────────────────────────── */
function logExercise(exId, dayId){
  const e = exerciseById(exId);
  if(!e){ toast('Ejercicio no encontrado'); return; }

  // Collect warmup sets
  const warmupSets = [];
  for(let i=0;i<e.approx;i++){
    const w = parseFloat(document.getElementById(`aw-${exId}-${i}`)?.value)||0;
    const r = parseInt(document.getElementById(`ar-${exId}-${i}`)?.value)||0;
    warmupSets.push({weight:w, reps:r});
  }

  // Collect working sets
  const workingSets = [];
  let any = false;
  for(let i=0;i<e.effective;i++){
    const w = parseFloat(document.getElementById(`ww-${exId}-${i}`)?.value)||0;
    const r = parseInt(document.getElementById(`wr-${exId}-${i}`)?.value)||0;
    const rir = parseInt(document.getElementById(`ri-${exId}-${i}`)?.value) ?? e.rir;
    if(r>0) any=true;
    workingSets.push({weight:w, reps:r, rir});
  }
  if(!any){ toast('Registra al menos las reps de una serie efectiva.'); return; }

  const pain   = parseInt(document.getElementById(`pain-${exId}`)?.value)||0;
  const energy = parseInt(document.getElementById(`energy-${exId}`)?.value)||3;
  const notes  = document.getElementById(`notes-${exId}`)?.value||'';

  // Volume: only working sets count
  const totalVolume = calcSessionVolume(workingSets, e.weightMult);

  // Get or create today's session
  startSessionTimer();
  const sess = getTodaySession(dayId || DAYS.find(d=>ROUTINE[d.id].some(x=>x.id===exId))?.id || '');

  // ONE record per exercise per day (overwrite if re-saved)
  sess.exercises[exId] = {
    exName:     e.name,
    level:      e.level,
    equipment:  e.equipment,
    bilateral:  e.bilateral,
    weightMult: e.weightMult,
    restSecs:   REST_SECS[e.restType],
    warmupSets,
    workingSets,
    totalVolume,
    pain,
    energy,
    notes,
    dp: {}
  };

  // Update DP
  const dp = updateDP(exId, e, workingSets);
  sess.exercises[exId].dp = {readyToIncrease: dp.readyToIncrease, completedRange: dp.completedRange, nextWeight: dp.nextWeight};

  // Update PR module
  updatePR(exId, sess.exercises[exId]);

  // Show DP alert
  const alertBox = document.getElementById(`alert-${exId}`);
  if(alertBox){
    if(dp.readyToIncrease){
      alertBox.innerHTML=`<div class="progress-alert">✅ ¡Doble progresión! Sube a <b>${dp.nextWeight} kg</b> la próxima sesión.</div>`;
    } else {
      const done = workingSets.filter(s=>s.reps>=e.repRange[1]).length;
      alertBox.innerHTML=`<div class="warn-alert">${done}/${e.effective} series en rango máximo (${e.repRange[1]} reps). Volumen: <b>${totalVolume.toLocaleString('es-CO')} kg</b></div>`;
    }
  }

  // Auto-start rest timer
  startRestTimer(REST_SECS[e.restType]);
  save();
  toast(`✓ ${e.name} — Volumen: ${totalVolume.toLocaleString('es-CO')} kg`);
  document.getElementById('ex-'+exId).classList.remove('open');
  // Re-render to show "guardado hoy" badge
  setTimeout(()=>renderView(currentView), 500);
}

function markDayComplete(){
  const date=todayStr();
  if(!DATA.completions.includes(date)) DATA.completions.push(date);
  const sess = DATA.sessions[date];
  if(sess) sess.endTime = nowTime();
  stopSessionTimer();
  save(); toast('🏆 ¡Sesión completada!'); renderView(currentView);
}

  <div class="train-set-row" id="tset-${e.id}-w${i}">
    <div class="ts-label">Efectiva ${i+1}</div>
    <input type="number" step="0.5" placeholder="Peso" id="tww-${e.id}-${i}" value="${dp.currentWeight||''}" style="max-width:90px;">
    <input type="number" placeholder="Reps" id="twr-${e.id}-${i}" style="max-width:66px;">
    <input type="number" placeholder="RIR" id="tri-${e.id}-${i}" value="${e.rir}" style="max-width:54px;">
    <button class="done-btn" onclick="markTrainSet('${e.id}','w${i}')">✓</button>
  </div>`).join('')}

  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
    <button class="btn primary" onclick="saveTrainEx('${e.id}','${trainDayId}')">Guardar ejercicio</button>
    <button class="btn small" onclick="startRestTimer(${REST_SECS[e.restType]})">⏱ ${e.rest}</button>
  </div>
  <div id="train-alert-${e.id}" style="margin-top:10px;"></div>
  <p style="color:var(--text3);font-size:.73rem;margin-top:14px;line-height:1.5;">${e.science}</p>
  <p style="color:var(--text3);font-size:.7rem;margin-top:4px;" class="mono">${trainExIdx+1} / ${exs.length}</p>`;
}
function markTrainSet(exId, key){ document.getElementById(`tset-${exId}-${key}`)?.classList.toggle('set-done'); }

function saveTrainEx(exId, dayId){
  const e=exerciseById(exId); if(!e) return;
  const warmupSets=[];
  for(let i=0;i<e.approx;i++){
    const w=parseFloat(document.getElementById(`taw-${exId}-${i}`)?.value)||0;
    const r=parseInt(document.getElementById(`tar-${exId}-${i}`)?.value)||0;
    warmupSets.push({weight:w,reps:r});
  }
  const workingSets=[]; let any=false;
  for(let i=0;i<e.effective;i++){
    const w=parseFloat(document.getElementById(`tww-${exId}-${i}`)?.value)||0;
    const r=parseInt(document.getElementById(`twr-${exId}-${i}`)?.value)||0;
    const rir=parseInt(document.getElementById(`tri-${exId}-${i}`)?.value)??e.rir;
    if(r>0) any=true; workingSets.push({weight:w,reps:r,rir});
  }
  if(!any){ toast('Registra al menos una repetición.'); return; }
  const totalVolume=calcSessionVolume(workingSets,e.weightMult);
  const sess=getTodaySession(dayId);
  sess.exercises[exId]={exName:e.name,level:e.level,equipment:e.equipment,bilateral:e.bilateral,weightMult:e.weightMult,restSecs:REST_SECS[e.restType],warmupSets,workingSets,totalVolume,pain:0,energy:3,notes:'',dp:{}};
  const dp=updateDP(exId,e,workingSets);
  sess.exercises[exId].dp={readyToIncrease:dp.readyToIncrease,completedRange:dp.completedRange,nextWeight:dp.nextWeight};
  updatePR(exId,sess.exercises[exId]);
  const alertEl=document.getElementById(`train-alert-${exId}`);
  if(alertEl) alertEl.innerHTML=dp.readyToIncrease?`<div class="progress-alert">✅ ¡Sube a <b>${dp.nextWeight} kg</b>!</div>`:`<div class="warn-alert">Volumen: <b>${totalVolume.toLocaleString('es-CO')} kg</b></div>`;
  startRestTimer(REST_SECS[e.restType]);
  save(); toast(`✓ ${e.name} guardado`);
}

/* ──────────────────────────────────────────────
   PROGRESIÓN
   ────────────────────────────────────────────── */
function viewProgresion(){
  const exsWithData=allExercises().filter(e=>getExerciseHistory(e.id).length>0);
  if(!exsWithData.length) return `<h3 class="section-title">📈 Progresión</h3><div class="card empty">Aún no hay historial. Registra sesiones para ver tu evolución.</div>`;
  return `<h3 class="section-title">📈 Progresión por ejercicio</h3>
  <select id="progSel" style="max-width:320px;margin-bottom:18px;">
    ${exsWithData.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}
  </select>
  <div id="progChart"></div>
  <div id="progDetail"></div>`;
}
function renderProgChart(){
  const sel=document.getElementById('progSel'); if(!sel) return;
  const id=sel.value; const ex=exerciseById(id); if(!ex) return;
  const hist=getExerciseHistory(id).reverse(); // oldest first for chart
  if(!hist.length) return;
  const maxW=Math.max(...hist.map(h=>Math.max(...(h.data.workingSets||[]).map(s=>s.weight||0))),1);
  const W=Math.max(hist.length*64,300), H=200, P=28;
  const bars=hist.map((h,i)=>{
    const mw=Math.max(...(h.data.workingSets||[]).map(s=>s.weight||0));
    const bh=(mw/maxW)*(H-P*2);
    return `<g>
      <rect x="${i*64+12}" y="${H-P-bh}" width="40" height="${bh}" fill="${mw>=(ex.weightMult===2?DATA.prs[id]?.bestWeight||0:DATA.prs[id]?.bestWeight||0)?'#2979FF':'#E53935'}" rx="4" opacity=".9"/>
      <text x="${i*64+32}" y="${H-P-bh-7}" fill="#fff" font-size="10" text-anchor="middle" font-family="Space Mono,monospace">${mw}</text>
      <text x="${i*64+32}" y="${H-7}" fill="#8A8A8A" font-size="9" text-anchor="middle">${h.date.slice(5)}</text>
    </g>`;
  }).join('');
  // DP summary
  const dp=getDP(id);
  const pr=DATA.prs[id]||{};
  document.getElementById('progChart').innerHTML=`<div class="card chart-wrap" style="margin-bottom:14px;"><svg width="${W}" height="${H}">${bars}</svg></div>`;
  document.getElementById('progDetail').innerHTML=`
  <div class="grid cols-3">
    <div class="stat-card"><div class="label">Mejor peso</div><div class="value">${pr.bestWeight||0} <span>kg</span></div></div>
    <div class="stat-card"><div class="label">Mejor reps</div><div class="value">${pr.bestReps||0}</div></div>
    <div class="stat-card ${dp.readyToIncrease?'accent':''}"><div class="label">Próximo peso</div><div class="value">${dp.nextWeight||dp.currentWeight||0} <span>kg</span></div></div>
  </div>`;
}

/* ──────────────────────────────────────────────
   BITÁCORA — reads from sessions (v3 structure)
   ────────────────────────────────────────────── */
function viewBitacora(){
  const sessEntries=Object.entries(DATA.sessions).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!sessEntries.length) return `<h3 class="section-title">📝 Bitácora</h3><div class="card empty">No hay sesiones registradas aún.</div>`;
  return `<h3 class="section-title">📝 Bitácora de entrenamiento</h3>
  ${sessEntries.slice(0,30).map(([date, sess])=>{
    const exEntries=Object.values(sess.exercises);
    const totalVol=exEntries.reduce((s,ex)=>s+(ex.totalVolume||0),0);
    return `<div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        <div><b class="mono">${date}</b> <span class="badge" style="margin-left:6px;">${DAYS.find(d=>d.id===sess.dayId)?.name||sess.dayId||'Sesión'}</span></div>
        <div style="font-size:.76rem;color:var(--text3);" class="mono">Vol total: <b style="color:var(--text2);">${(totalVol/1000).toFixed(2)} t</b> ${sess.startTime?'· '+sess.startTime+(sess.endTime?'→'+sess.endTime:''):''}</div>
      </div>
      <table>
        <thead><tr><th>Ejercicio</th><th>Nivel</th><th>Series efectivas</th><th>Mejor peso</th><th>Vol sesión</th><th>RIR prom.</th></tr></thead>
        <tbody>
          ${exEntries.map(ex=>{
            const wSets=ex.workingSets||[];
            const bestW=wSets.length?Math.max(...wSets.map(s=>s.weight||0)):0;
            const avgRir=wSets.length?Math.round(wSets.reduce((s,ws)=>s+(ws.rir||0),0)/wSets.length):'-';
            const setsStr=wSets.map(s=>`${s.reps}`).join('-');
            return `<tr>
              <td>${ex.exName}</td>
              <td><span class="badge ${{S:'red',A:'blue',B:'yellow',C:'gray'}[ex.level]||''}">${ex.level}</span></td>
              <td class="mono">${setsStr}</td>
              <td>${bestW} kg</td>
              <td class="mono">${(ex.totalVolume||0).toLocaleString('es-CO')} kg</td>
              <td>${avgRir}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }).join('')}`;
}

/* ──────────────────────────────────────────────
   OBJETIVOS
   ────────────────────────────────────────────── */
function viewObjetivos(){
  return `<h3 class="section-title">🎯 Objetivos</h3>
  <div class="card">${DATA.goals.map(g=>{
    const pct=Math.min(100,Math.round(((g.currentW*g.currentR)/(g.targetW*g.targetR))*100)||0);
    return `<div class="goal-row">
      <div class="gh"><b>${g.name}</b><span class="mono">${pct}% — meta ${g.target}</span></div>
      <div class="gbar"><i style="width:${pct}%"></i></div>
      <div style="margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;">
        <input type="number" placeholder="Peso actual (kg)" id="gw-${g.id}" value="${g.currentW||''}" style="max-width:140px;">
        <input type="number" placeholder="Reps" id="gr-${g.id}" value="${g.currentR||''}" style="max-width:100px;">
        <button class="btn small" onclick="saveGoal('${g.id}')">Guardar</button>
      </div>
    </div>`;}).join('')}
  </div>`;
}
function saveGoal(id){
  const g=DATA.goals.find(x=>x.id===id);
  g.currentW=parseFloat(document.getElementById('gw-'+id).value)||0;
  g.currentR=parseInt(document.getElementById('gr-'+id).value)||0;
  save(); toast('Objetivo actualizado'); renderView('objetivos');
}

/* ──────────────────────────────────────────────
   ESTADÍSTICAS — reads from sessions + PRs module
   Only working sets count toward volume
   ────────────────────────────────────────────── */
function viewEstadisticas(){
  let totalVol=0, totalSets=0, totalReps=0, totalSessions=0;
  Object.values(DATA.sessions).forEach(sess=>{
    totalSessions++;
    Object.values(sess.exercises).forEach(ex=>{
      const wSets=ex.workingSets||[];
      wSets.forEach(s=>{ totalVol+=(s.weight||0)*(s.reps||0)*(ex.weightMult||1); totalReps+=s.reps||0; totalSets++; });
    });
  });

  // PRs list
  const prList=Object.entries(DATA.prs).map(([exId,pr])=>({name:exerciseById(exId)?.name||exId,...pr})).sort((a,b)=>b.bestWeight-a.bestWeight);

  // Calendar
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  const off=(new Date(y,m,1).getDay()+6)%7; const dim=new Date(y,m+1,0).getDate();
  let cal=''; for(let i=0;i<off;i++) cal+='<div class="cal-cell"></div>';
  for(let d=1;d<=dim;d++){ const ds=todayStr(new Date(y,m,d)); cal+=`<div class="cal-cell ${DATA.completions.includes(ds)?'done':''} ${ds===todayStr()?'today':''}">${d}</div>`; }

  let streak=0; let dd=new Date();
  while(DATA.completions.includes(todayStr(dd))){ streak++; dd.setDate(dd.getDate()-1); }

  return `<h3 class="section-title">📊 Estadísticas globales</h3>
  <div class="grid cols-4">
    <div class="stat-card accent"><div class="label">Toneladas levantadas</div><div class="value">${(totalVol/1000).toFixed(2)} <span>t</span></div></div>
    <div class="stat-card"><div class="label">Sesiones registradas</div><div class="value">${totalSessions}</div></div>
    <div class="stat-card"><div class="label">Series efectivas</div><div class="value">${totalSets}</div></div>
    <div class="stat-card"><div class="label">Racha actual</div><div class="value">${streak} <span>días</span></div></div>
  </div>
  <div class="grid cols-2" style="margin-top:16px;">
    <div class="stat-card"><div class="label">Repeticiones totales</div><div class="value">${totalReps.toLocaleString('es-CO')}</div></div>
    <div class="stat-card"><div class="label">Ejercicios con PR</div><div class="value">${prList.length}</div></div>
  </div>
  <h3 class="section-title">🗓️ Cumplimiento mensual</h3>
  <div class="card"><div class="cal-grid">${cal}</div></div>
  <h3 class="section-title">🏆 Récords personales (módulo independiente)</h3>
  <div class="card">${prList.length?`<table>
    <thead><tr><th>Ejercicio</th><th>Mejor peso</th><th>Mejor reps</th><th>Mejor vol. sesión</th><th>Actualizado</th></tr></thead>
    <tbody>${prList.map(p=>`<tr>
      <td>${p.name}</td><td><b>${p.bestWeight} kg</b></td><td>${p.bestReps}</td>
      <td class="mono">${(p.bestVolume||0).toLocaleString('es-CO')} kg</td>
      <td class="mono">${p.lastUpdated||'—'}</td>
    </tr>`).join('')}</tbody>
  </table>`:`<div class="empty">Sin récords todavía.</div>`}</div>`;
}

/* ──────────────────────────────────────────────
   RECUPERACIÓN
   ────────────────────────────────────────────── */
function viewRecuperacion(){
  const state=DATA.recovery[todayStr()];
  const advice={green:'✅ Listo para alta intensidad. Busca PRs si corresponde.',yellow:'⚠️ Respeta el RIR; prioriza técnica sobre carga.',red:'🔴 Sesión ligera o descanso completo. Duerme e hidratación.'};
  return `<h3 class="section-title">🌙 Recuperación</h3>
  <div class="card">
    <p style="margin-bottom:14px;color:var(--text2);">¿Cómo te sientes hoy?</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn ${state==='green'?'green-btn':''}" onclick="setRecovery('green')">🟢 Verde — Óptimo</button>
      <button class="btn ${state==='yellow'?'primary':''}" style="${state==='yellow'?'background:var(--yellow);border-color:var(--yellow);color:#111;':''}" onclick="setRecovery('yellow')">🟡 Amarillo — Moderado</button>
      <button class="btn ${state==='red'?'primary':''}" onclick="setRecovery('red')">🔴 Rojo — Necesito descanso</button>
    </div>
    ${state?`<div class="progress-alert" style="margin-top:16px;background:rgba(255,255,255,.04);border-color:var(--border);color:var(--text2);">${advice[state]}</div>`:''}
  </div>`;
}
function setRecovery(s){ DATA.recovery[todayStr()]=s; save(); renderView('recuperacion'); }

/* ──────────────────────────────────────────────
   PREVENCIÓN DE LESIONES
   ────────────────────────────────────────────── */
function viewLesiones(){
  return `<h3 class="section-title">🛡️ Prevención de Lesiones</h3>
  <div class="grid cols-2">${INJURY_AREAS.map(a=>`<div class="card"><b>${a.area}</b><p style="color:var(--text2);font-size:.83rem;margin-top:8px;line-height:1.55;">${a.ex}</p><span class="badge" style="margin-top:10px;display:inline-block;">${a.freq}</span></div>`).join('')}</div>`;
}

/* ──────────────────────────────────────────────
   CONFIGURACIÓN
   ────────────────────────────────────────────── */
function viewConfig(){
  const p=DATA.profile;
  return `<h3 class="section-title">⚙️ Configuración</h3>
  <div class="card grid cols-2">
    <div class="field"><label class="flabel">Nombre</label><input id="cfgName" value="${p.name||''}"></div>
    <div class="field"><label class="flabel">Peso corporal (kg)</label><input id="cfgWeight" type="number" step="0.1" value="${p.bodyweight||''}"></div>
  </div>
  <div class="card" style="margin-top:12px;"><label class="flabel">Objetivo semanal</label><textarea id="cfgWeekly" rows="2">${p.weeklyGoal||''}</textarea></div>
  <button class="btn primary" style="margin-top:12px;" onclick="saveConfig()">Guardar configuración</button>`;
}
function saveConfig(){
  DATA.profile.name=document.getElementById('cfgName').value;
  DATA.profile.bodyweight=parseFloat(document.getElementById('cfgWeight').value)||0;
  DATA.profile.weeklyGoal=document.getElementById('cfgWeekly').value;
  save(); renderTop(); toast('Configuración guardada');
}

/* ──────────────────────────────────────────────
   RESPALDOS
   ────────────────────────────────────────────── */
function viewRespaldos(){
  const sizeBytes=new Blob([JSON.stringify(DATA)]).size;
  const sessions=Object.keys(DATA.sessions).length;
  return `<h3 class="section-title">💾 Respaldos</h3>
  <div class="card" style="margin-bottom:14px;">
    <p style="color:var(--text3);font-size:.76rem;font-family:'Space Mono',monospace;margin-bottom:14px;">
      Formato JSON v3 · ${sessions} sesiones · ${(sizeBytes/1024).toFixed(1)} KB · Sin duplicados
    </p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn primary" onclick="exportBackup()">⬇ Exportar JSON</button>
      <label class="btn blue" style="cursor:pointer;">⬆ Importar JSON<input type="file" accept=".json" style="display:none;" onchange="importBackup(event)"></label>
      <button class="btn" style="border-color:#5c2222;color:#ff8a85;" onclick="resetAll()">⚠ Restablecer todo</button>
    </div>
  </div>
  <div class="card">
    <h4 style="font-size:.9rem;margin-bottom:10px;">📋 Arquitectura del JSON v3</h4>
    <table>
      <thead><tr><th>Campo</th><th>Descripción</th></tr></thead>
      <tbody>
        <tr><td class="mono">_version</td><td>Versión del esquema (3)</td></tr>
        <tr><td class="mono">profile</td><td>Datos del atleta</td></tr>
        <tr><td class="mono">dp[exId]</td><td>Double Progression por ejercicio: currentWeight, nextWeight, completedRange, readyToIncrease</td></tr>
        <tr><td class="mono">sessions[date]</td><td>UNA sesión por día con exercises[exId]: warmupSets, workingSets (peso+reps+RIR), volumen calculado</td></tr>
        <tr><td class="mono">prs[exId]</td><td>Módulo independiente de récords: bestWeight, bestReps, bestVolume, lastUpdated</td></tr>
        <tr><td class="mono">completions</td><td>Días de entrenamiento completado</td></tr>
        <tr><td class="mono">goals</td><td>Objetivos con progreso</td></tr>
        <tr><td class="mono">recovery</td><td>Estado de recuperación diario</td></tr>
      </tbody>
    </table>
  </div>`;
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'MLab_v3_backup_'+todayStr()+'.json'});
  a.click(); URL.revokeObjectURL(a.href); toast('Respaldo exportado');
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      if(parsed._version!==3){
        const result=migrateIfNeeded(parsed);
        if(result&&result.migrated){ DATA=result.data; }
        else { DATA=parsed; }
      } else { DATA=parsed; }
      save(); toast('Respaldo importado y migrado si era necesario'); renderTop(); renderView(currentView);
    }catch(e){ toast('Error: archivo JSON inválido'); }
  };
  r.readAsText(f);
}
function resetAll(){
  openModal(`<h4>⚠ Restablecer toda la información</h4>
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:18px;">Esta acción borrará permanentemente todos tus registros. ¿Continuar?</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="doReset()">Borrar todo</button>
    </div>`);
}
function doReset(){ DATA=defaultData(); save(); closeModal(); renderTop(); goTo('inicio'); toast('Datos restablecidos'); }

/* ──────────────────────────────────────────────
   BIND POST-RENDER
   ────────────────────────────────────────────── */
function bindView(view){
  if(view==='programa'){
    document.querySelectorAll('#dayTabs .tab').forEach(t=>{
      t.addEventListener('click',()=>{
        rutinaActiveDay=t.dataset.day;
        document.querySelectorAll('#dayTabs .tab').forEach(x=>x.classList.toggle('active',x===t));
        document.getElementById('dayContent').innerHTML=renderDayContent(rutinaActiveDay,false);
      });
    });
  }
  if(view==='progresion'){
    const sel=document.getElementById('progSel');
    if(sel){ sel.addEventListener('change',renderProgChart); renderProgChart(); }
  }
}

/* ──────────────────────────────────────────────
   INIT
   ────────────────────────────────────────────── */
function init(){
  load();
  buildNav();
  renderTop();
  goTo('inicio');
  setTimeout(()=>document.getElementById('splash').classList.add('hide'),1700);
  setInterval(renderTop,30000);
}
init();
</script>
