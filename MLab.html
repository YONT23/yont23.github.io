<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLab — Mendoza Molina Performance Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212;
  --card:#1E1E1E;
  --card2:#242424;
  --red:#E53935;
  --red-dim:#7a201d;
  --blue:#2979FF;
  --text:#FFFFFF;
  --text2:#CFCFCF;
  --text3:#8A8A8A;
  --green:#36C26B;
  --yellow:#E6B400;
  --border:#2C2C2C;
  --radius:14px;
  --side-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Sora',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.mono{font-family:'Space Mono',monospace;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- SPLASH ---------- */
#splash{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;
  transition:opacity .6s ease, visibility .6s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
#splash .logo-placeholder {
  font-size: 4rem;
  animation: floatLogo 3.5s ease-in-out infinite;
}
@keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#splash h1{font-size:2.4rem;font-weight:800;letter-spacing:.04em;margin-top:22px;}
#splash .sub{color:var(--text2);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;margin-top:6px;font-family:'Space Mono',monospace;}
#splash .slogan{margin-top:28px;color:var(--text3);font-size:.92rem;font-style:italic;}
#splash .bar{width:200px;height:2px;background:#2a2a2a;margin-top:34px;overflow:hidden;border-radius:2px;}
#splash .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--red),var(--blue));animation:loadBar 1.6s ease forwards;}
@keyframes loadBar{to{width:100%;}}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:var(--side-w);
  background:#161616;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;
  z-index:200;
  transition:transform .3s ease;
}
.side-logo{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;border-bottom:1px solid var(--border);}
.side-logo .t{font-weight:800;font-size:1.05rem;letter-spacing:.03em;}
.side-logo .s{font-size:.6rem;color:var(--text3);letter-spacing:.08em;font-family:'Space Mono',monospace;}
nav.navlist{flex:1;overflow-y:auto;padding:14px 10px;}
nav.navlist .navitem{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  color:var(--text2);font-size:.86rem;font-weight:500;
  margin-bottom:2px;transition:background .15s,color .15s;
  user-select:none;
}
nav.navlist .navitem .ic{width:18px;text-align:center;font-size:.95rem;opacity:.85;}
nav.navlist .navitem:hover{background:#1d1d1d;color:#fff;}
nav.navlist .navitem.active{background:linear-gradient(90deg,rgba(229,57,53,.18),rgba(229,57,53,.02));color:#fff;box-shadow:inset 3px 0 0 var(--red);}
.side-foot{padding:14px 18px;border-top:1px solid var(--border);font-size:.65rem;color:var(--text3);font-family:'Space Mono',monospace;line-height:1.5;}

#main{margin-left:var(--side-w);flex:1;min-height:100vh;padding:26px 34px 70px;max-width:1180px;}
#topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;}
#topbar .greet h2{font-size:1.5rem;font-weight:700;}
#topbar .greet p{color:var(--text3);font-size:.82rem;margin-top:3px;font-family:'Space Mono',monospace;}
#menuBtn{display:none;background:var(--card);border:1px solid var(--border);color:#fff;width:40px;height:40px;border-radius:10px;font-size:1.1rem;cursor:pointer;}
.xpchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);padding:8px 14px;border-radius:30px;font-size:.78rem;}
.xpchip b{color:var(--red);}

.view{display:none;animation:fadeIn .35s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- GENERIC ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:980px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;}
.stat-card .label{color:var(--text3);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-family:'Space Mono',monospace;}
.stat-card .value{font-size:1.7rem;font-weight:800;margin-top:6px;}
.stat-card .value span{font-size:.9rem;color:var(--text3);font-weight:500;}
.stat-card.accent{border-color:var(--red-dim);}
.stat-card .bar-bg{height:5px;background:#2a2a2a;border-radius:5px;margin-top:12px;overflow:hidden;}
.stat-card .bar-bg i{display:block;height:100%;background:var(--red);}

h3.section-title{font-size:1.05rem;font-weight:700;margin:30px 0 14px;display:flex;align-items:center;gap:8px;}
h3.section-title:first-child{margin-top:0;}
.badge{display:inline-block;font-size:.65rem;padding:3px 9px;border-radius:20px;background:#2a2a2a;color:var(--text2);font-family:'Space Mono',monospace;}
.badge.red{background:rgba(229,57,53,.15);color:#ff8a85;}
.badge.blue{background:rgba(41,121,255,.15);color:#8fb6ff;}
.badge.green{background:rgba(54,194,107,.15);color:#7fe3a4;}

button{font-family:inherit;}
.btn{background:var(--card2);border:1px solid var(--border);color:#fff;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .15s;}
.btn:hover{border-color:#444;transform:translateY(-1px);}
.btn.primary{background:var(--red);border-color:var(--red);}
.btn.primary:hover{background:#ff4a44;}
.btn.blue{background:var(--blue);border-color:var(--blue);}
.btn.ghost{background:transparent;}
.btn.small{padding:6px 12px;font-size:.74rem;}
input,select,textarea{
  background:#171717;border:1px solid var(--border);color:#fff;
  border-radius:8px;padding:9px 11px;font-size:.84rem;font-family:inherit;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);}
label.flabel{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px;font-family:'Space Mono',monospace;}
.field{margin-bottom:12px;}

table{width:100%;border-collapse:collapse;}
table th{text-align:left;font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px;font-family:'Space Mono',monospace;border-bottom:1px solid var(--border);}
table td{padding:9px 8px;font-size:.84rem;border-bottom:1px solid #232323;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.tabs .tab{padding:8px 16px;border-radius:9px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:.8rem;font-weight:600;color:var(--text2);}
.tabs .tab.active{background:var(--red);color:#fff;border-color:var(--red);}

.exercise{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.exercise .ex-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer;}
.exercise .ex-head .name{font-weight:700;font-size:.96rem;}
.exercise .stars{color:var(--red);font-size:.78rem;letter-spacing:1px;}
.exercise .ex-meta{display:flex;gap:14px;color:var(--text3);font-size:.74rem;margin-top:4px;font-family:'Space Mono',monospace;}
.exercise .ex-body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 18px;}
.exercise.open .ex-body{max-height:1400px;padding:0 18px 18px;}
.exercise .ex-body .row{margin-bottom:10px;font-size:.82rem;color:var(--text2);line-height:1.55;}
.exercise .ex-body .row b{color:#fff;}
.chev{transition:transform .3s;color:var(--text3);}
.exercise.open .chev{transform:rotate(180deg);}

.setlog-table input{padding:6px 8px;font-size:.8rem;}
.progress-alert{background:rgba(54,194,107,.12);border:1px solid rgba(54,194,107,.35);color:#7fe3a4;padding:10px 14px;border-radius:9px;font-size:.78rem;margin-top:10px;font-weight:600;}

.day-pill{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:10px;cursor:pointer;}
.day-pill .dn{width:36px;height:36px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;}
.day-pill .di{flex:1;}
.day-pill .di b{display:block;font-size:.9rem;}
.day-pill .di span{font-size:.72rem;color:var(--text3);}
.day-pill.today{border-color:var(--red);}

.chart-wrap{width:100%;overflow-x:auto;}
svg.barchart rect{transition:height .3s;}

.recovery-dot{width:13px;height:13px;border-radius:50%;display:inline-block;margin-right:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-cell{aspect-ratio:1;border-radius:6px;background:#222;font-size:.6rem;display:flex;align-items:flex-end;justify-content:flex-start;padding:3px;color:var(--text3);}
.cal-cell.done{background:rgba(229,57,53,.55);color:#fff;}
.cal-cell.today{outline:1px solid var(--blue);}

.goal-row{margin-bottom:18px;}
.goal-row .gh{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px;}
.goal-row .gh b{font-weight:700;}
.goal-row .gbar{height:9px;background:#262626;border-radius:8px;overflow:hidden;}
.goal-row .gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff7b76);}

.empty{color:var(--text3);font-size:.84rem;text-align:center;padding:30px 10px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--card2);border:1px solid var(--border);padding:12px 20px;border-radius:11px;font-size:.84rem;opacity:0;transition:all .3s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}
.modal h4{font-size:1.05rem;margin-bottom:16px;}

@media(max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;padding:20px 16px 70px;}
  #menuBtn{display:block;}
  .grid.cols-4{grid-template-columns:1fr 1fr;}
}

/* Optimización nativa de impresión para guardar reportes PDF limpios */
@media print {
  #sidebar, #menuBtn, .btn, input, select, textarea, .tabs { display: none !important; }
  #main { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
  .card, .stat-card { border: 1px solid #000 !important; background: #fff !important; color: #000 !important; page-break-inside: avoid; }
  body { background: #fff !important; color: #000 !important; }
  .badge { border: 1px solid #000 !important; color: #000 !important; background: transparent !important; }
}
</style>
</head>
<body>

<div id="splash">
  <div class="logo-placeholder">🏋️‍♂️</div>
  <h1>MLab</h1>
  <div class="sub">Mendoza Molina Performance Lab</div>
  <div class="slogan">Entrena con inteligencia. Registra todo. Mejora siempre.</div>
  <div class="bar"><i></i></div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="side-logo">
      <div style="font-size: 1.5rem;">🏋️‍♂️</div>
      <div><div class="t">MLab</div><div class="s">PERFORMANCE LAB</div></div>

    <nav class="navlist" id="navlist"></nav>

    <div id="views"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

  miercoles: [

let DATA = null;

function defaultData(){
  return {
    profile:{name:'Atleta MLab', bodyweight:80, calorieGoal:3000, proteinGoal:180, carbGoal:350, fatGoal:80, waterGoal:3.8, weeklyGoal:'Completar las 5 sesiones de entrenamiento con un RIR estricto.'},
    exerciseState:{}, 
    logs:[], 
    bodyLog:[], 
    nutrition:{meals:[]}, 
    supplements:{}, 
    recovery:{}, 
    completions:[], 
    goals: JSON.parse(JSON.stringify(GOALS_DEFAULT)),
    xp:0, level:1, badges:[],
  };
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    DATA = raw ? JSON.parse(raw) : defaultData();
    const def = defaultData();
    for(const k in def){ if(!(k in DATA)) DATA[k] = def[k]; }
  }catch(e){ DATA = defaultData(); }
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }

function todayStr(d){ d = d || new Date(); return d.toISOString().slice(0,10); }

function fmtDate(s){
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
}

function weekdayIdToday(){
  const map = {1:'lunes',2:'martes',3:'miercoles',4:'jueves',5:'viernes',6:null,0:null};
  return map[new Date().getDay()];
}

function exState(id){
  if(!DATA.exerciseState[id]) DATA.exerciseState[id] = {weight:0, history:[]};
  return DATA.exerciseState[id];
}

function allExercises(){
  let all = [];
  DAYS.forEach(d=> {
    if(ROUTINE[d.id]) {
      all = all.concat(ROUTINE[d.id].map(e=>({...e, dayId:d.id, dayName:d.name})));
    }
  });
  return all;
}

function exerciseById(id){ return allExercises().find(e=>e.id===id); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function addXP(amount){
  DATA.xp += amount;
  const needed = DATA.level * 150;
  while(DATA.xp >= needed){
    DATA.xp -= needed;
    DATA.level++;
    toast('🎉 ¡Felicidades! Has aumentado el rango a Nivel ' + DATA.level + '!');
  }
  save();
  renderTop();
}

function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

/* ---------------- NAVIGATION ---------------- */
let currentView = 'inicio';
function buildNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = NAV.map(n=>`<div class="navitem" data-view="${n.id}"><span class="ic">${n.icon}</span>${n.label}</div>`).join('');
  nav.querySelectorAll('.navitem').forEach(el=>{
    el.addEventListener('click', ()=> {
      goTo(el.dataset.view);
      document.getElementById('sidebar').classList.remove('open');
    });
  });
}

function goTo(view){
  currentView = view;
  document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  renderView(view);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('menuBtn').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));

function renderTop(){
  document.getElementById('xpLevel').textContent = DATA.level;
  document.getElementById('xpPts').textContent = DATA.xp+'/'+(DATA.level*150);
  const now = new Date();
  const dayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  document.getElementById('greetSub').textContent = dayNames[now.getDay()]+' · '+now.toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'})+' · '+now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  const hr = now.getHours();
  const greet = hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches';
  document.getElementById('greetTitle').textContent = greet+', '+(DATA.profile.name||'Atleta');
}

function renderView(view){
  const root = document.getElementById('views');
  const fns = {
    inicio: viewInicio, hoy: viewHoy, rutina: viewRutina, progresion: viewProgresion,
    registro: viewRegistro, objetivos: viewObjetivos, calendario: viewCalendario,
    estadisticas: viewEstadisticas, nutricion: viewNutricion, suplementos: viewSuplementos,
    recuperacion: viewRecuperacion, lesiones: viewLesiones, corporal: viewCorporal,
    filosofia: viewFilosofia, config: viewConfig, respaldos: viewRespaldos,
  };
  root.innerHTML = `<div id="pdf-report-content" class="view active">${(fns[view]||viewInicio)()}</div>`;
  bindView(view);
}

  return MOTIVATIONAL[new Date().getDate() % MOTIVATIONAL.length];

function weekCompletionStats(){
  const now = new Date();
  const day = now.getDay()===0?7:now.getDay();
  const monday = new Date(now); monday.setDate(now.getDate()-day+1); monday.setHours(0,0,0,0);
  let done = 0;
  for(let i=0;i<5;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    if(DATA.completions.includes(todayStr(d))) done++;
  }
  return {done, total:5};
}

let rutinaActiveDay = weekdayIdToday() || 'lunes';

function viewHoy(){
  const id = weekdayIdToday();
  if(!id){
    return `<h3 class="section-title">⚡ Entrenamiento del día</h3><div class="card empty">Hoy el laboratorio se encuentra en fase de recuperación celular. Prioriza nutrición y descanso.</div>`;
  }
  rutinaActiveDay = id;
  return renderDayContent(id, true);
}

function viewRutina(){
  return `
  <h3 class="section-title">📋 Distribución del Microciclo</h3>
  <div class="tabs" id="dayTabs">
    ${DAYS.map(d=>`<div class="tab ${d.id===rutinaActiveDay?'active':''}" data-day="${d.id}">${d.icon} ${d.name}</div>`).join('')}
  </div>
  <div id="dayContent">${renderDayContent(rutinaActiveDay,false)}</div>
  `;
}

function renderDayContent(dayId, isToday){
  const day = DAYS.find(d=>d.id===dayId);
  const exs = ROUTINE[dayId];
  if (!exs) return `<div class="card empty">No hay ejercicios configurados para este día.</div>`;
  const totalDuration = exs.reduce((s,e)=>s+parseInt(e.duration),0);
  const completedToday = DATA.completions.includes(todayStr());
  return `
  <div class="card" style="margin-bottom:18px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <h4 style="font-size:1.1rem;">${day.icon} ${day.name} — ${day.focus}</h4>
        <p style="color:var(--text3);font-size:.78rem;margin-top:4px;" class="mono">Tiempo de sesión estimado: ~${totalDuration} min · ${exs.length} movimientos mecánicos</p>
      </div>
      ${isToday?`<button class="btn primary" id="completeDayBtn" ${completedToday?'disabled':''}>${completedToday?'✓ Completado':'Finalizar Sesión y Registrar'}</button>`:''}
    </div>
  </div>
  ${exs.map(e=>renderExerciseCard(e, dayId)).join('')}
  `;
}

function renderExerciseCard(e, dayId){
  const st = exState(e.id);
  const lastEntry = st.history[st.history.length-1];
  return `
  <div class="exercise" id="ex-${e.id}">

      <div>
        <div class="name">${e.name} <span class="badge ${e.level==='S'?'red':e.level==='A'?'blue':''}" style="margin-left:6px;">${STAR[e.level]} ${e.level}</span></div>
        <div class="ex-meta">
          <span>${e.muscles}</span><span>⏱ ${e.duration}</span><span>${e.sets}×${e.repRange[0]}-${e.repRange[1]}</span><span>RIR ${e.rir}</span>
        </div>
      </div>
      <span class="chev">▾</span>
    </div>
    <div class="ex-body">
      <div class="row"><b>Clasificación:</b> ${STAR_LABEL[e.level]}</div>
      <div class="row"><b>Justificación científica:</b> ${e.science}</div>

function toggleExercise(id){
  document.getElementById('ex-'+id).classList.toggle('open');
}

function logExercise(exId, dayId){
  const e = exerciseById(exId);
  const st = exState(exId);
  const weights = [], reps = [];
  let anyData = false;
  for(let i=0;i<e.sets;i++){
    const w = parseFloat(document.getElementById(`w-${exId}-${i}`).value) || st.weight || 0;
    const r = parseInt(document.getElementById(`r-${exId}-${i}`).value) || 0;
    if(r>0) anyData = true;
    weights.push(w); reps.push(r);
  }
  if(!anyData){ toast('Introduce repeticiones válidas para computar la serie.'); return; }
  const pain = parseInt(document.getElementById(`pain-${exId}`).value)||0;
  const energy = parseInt(document.getElementById(`energy-${exId}`).value)||3;
  const notes = document.getElementById(`notes-${exId}`).value;
  const date = todayStr();
  
  const entry = {date, weights, reps, pain, energy, notes};
  st.history.push(entry);
  const maxW = Math.max(...weights.filter(w=>w>0), st.weight||0);
  st.weight = maxW;

  const logEntry = {date, dayId, exerciseId:exId, exName:e.name, weight:maxW, reps, pain, energy, notes};
  DATA.logs.push(logEntry);

  const effIdx = Array.from({length:e.sets}).map((_,i)=>i).slice(e.approx);
  const effReps = effIdx.map(i=>reps[i]);
  const allTop = effReps.length>0 && effReps.every(r=>r>=e.repRange[1]);
  const alertBox = document.getElementById(`alert-${exId}`);
  if(allTop){
    alertBox.innerHTML = `<div class="progress-alert">🚨 SISTEMA DE DOBLE PROGRESIÓN: Has completado el rango máximo (${e.repRange[1]} reps) en todas las series efectivas. Incrementa la carga del peso un 2.5% - 5% la próxima sesión de forma obligatoria.</div>`;
  } else { alertBox.innerHTML=''; }

  addXP(25);
  save();
  toast('Datos guardados analíticamente para ' + e.name);
  document.getElementById('ex-'+exId).classList.remove('open');
}

function markDayComplete(){
  const date = todayStr();

    DATA.completions.push(date);

function renderProgChart(){
  const sel = document.getElementById('progExSelect');
  if(!sel) return;
  const id = sel.value;
  const hist = exState(id).history;
  const maxW = Math.max(...hist.map(h=>Math.max(...h.weights)),1);
  const w = Math.max(hist.length*60, 320), h=240, pad=35;
  const bars = hist.map((entry,i)=>{
    const mw = Math.max(...entry.weights);
    const bh = (mw/maxW)*(h-pad*2);
    return `<g>
      <rect x="${i*60+15}" y="${h-pad-bh}" width="35" height="${bh}" fill="#E53935" rx="3"></rect>
      <text x="${i*60+30}" y="${h-pad-bh-8}" fill="#fff" font-size="10" text-anchor="middle" font-family="Space Mono">${mw}kg</text>
      <text x="${i*60+30}" y="${h-8}" fill="#8A8A8A" font-size="9" text-anchor="middle" class="mono">${entry.date.slice(5)}</text>
    </g>`;
  }).join('');
  document.getElementById('progChartWrap').innerHTML = `<div class="card chart-wrap"><svg class="barchart" width="${w}" height="${h}">${bars}</svg></div>`;
}

/* ---------------- CALENDARIO ---------------- */
function viewCalendario(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = todayStr(new Date(year,month,d));
    const done = DATA.completions.includes(dateStr);
    const isToday = dateStr===todayStr();
    cells += `<div class="cal-cell ${done?'done':''} ${isToday?'today':''}">${d}</div>`;
  }
  let streak = 0;
  let currentCheck = new Date();
  while(DATA.completions.includes(todayStr(currentCheck))){ streak++; currentCheck.setDate(currentCheck.getDate()-1); }
  const monthCompletions = DATA.completions.filter(c=>c.startsWith(todayStr().slice(0,7))).length;
  const pctMonth = Math.round((monthCompletions/20)*100); 
  return `<h3 class="section-title">🗓️ Calendario de Adherencia</h3>
  <div class="grid cols-3" style="margin-bottom:18px;">
    <div class="stat-card accent"><div class="label">Racha Ininterrumpida</div><div class="value">${streak} <span>días</span></div></div>
    <div class="stat-card"><div class="label">Sesiones Ejecutadas (Mes)</div><div class="value">${monthCompletions}</div></div>
    <div class="stat-card"><div class="label">Tasa de Adherencia Mensual</div><div class="value">${pctMonth}%</div></div>
  </div>
  <div class="card"><div class="cal-grid">${cells}</div></div>`;
}

     <div class="card"><b>Tensión Mecánica</b><p style="color:var(--text3); font-size:0.8rem; margin-top:5px;">Fuerza mecanotransductora primaria que altera la permeabilidad de la membrana celular activando la vía mTOR celular.</p></div>
     <div class="card"><b>Hipertrofia Muscular</b><p style="color:var(--text3); font-size:0.8rem; margin-top:5px;">Remodelación del tejido muscular esquelético mediante el incremento del área transversal de las fibras del sarcómero.</p></div>
     <div class="card"><b>Gestión de Recuperación</b><p style="color:var(--text3); font-size:0.8rem; margin-top:5px;">Reorganización homeostática del sustrato de glucógeno y reparación microestructural dependiente del descanso y la ventana metabólica.</p></div>
     <div class="card"><b>Volumen de Carga</b><p style="color:var(--text3); font-size:0.8rem; margin-top:5px;">Series efectivas totales llevadas cerca del fallo íntimo multiplicadas por las repeticiones y la masa de la carga externa.</p></div>
     <div class="card"><b>Intensidad Relativa</b><p style="color:var(--text3); font-size:0.8rem; margin-top:5px;">Aproximación real al fallo muscular técnico medido bajo el parámetro RIR (Repeticiones en Reserva).</p></div>
     <div class="card"><b>Técnica y Biomecánica</b><p style="color:var(--text3); font-size:0.8rem; margin-top:5px;">Alineación de los vectores de fuerza externos con los planos de deslizamiento anatómicos del sarcómero.</p></div>
     <div class="card"><b>Doble Progresión Automática</b><p style="color:var(--text3); font-size:0.8rem; margin-top:5px;">Estrategia analítica del laboratorio: consolidar el espectro superior de repeticiones antes de escalar el peso.</p></div>
  </div>`;
}

  const p = DATA.profile;

  <div class="card grid cols-2">
    <div class="field"><label class="flabel">Identificación / Nombre</label><input id="cfgName" value="${p.name||''}"></div>
    <div class="field"><label class="flabel">Masa Corporal Inicial (kg)</label><input id="cfgWeight" type="number" step="0.1" value="${p.bodyweight||''}"></div>
    <div class="field"><label class="flabel">Límite Calórico Diario (kcal)</label><input id="cfgKcal" type="number" value="${p.calorieGoal||''}"></div>
    <div class="field"><label class="flabel">Suministro de Proteína (g)</label><input id="cfgProt" type="number" value="${p.proteinGoal||''}"></div>
    <div class="field"><label class="flabel">Carbohidratos (g)</label><input id="cfgCarb" type="number" value="${p.carbGoal||''}"></div>
    <div class="field"><label class="flabel">Lípidos / Grasas (g)</label><input id="cfgFat" type="number" value="${p.fatGoal||''}"></div>
    <div class="field"><label class="flabel">Hidratación Mínima (L)</label><input id="cfgWater" type="number" step="0.1" value="${p.waterGoal||''}"></div>
  </div>
  <div class="card" style="margin-top:12px;">
    <label class="flabel">Enfoque y Objetivo del Ciclo Actual</label>
    <textarea id="cfgWeeklyGoal" rows="2">${p.weeklyGoal||''}</textarea>
  </div>
  <button class="btn primary" style="margin-top:12px;" onclick="saveConfig()">Actualizar Perfil de Atleta</button>`;
}
function saveConfig(){
  DATA.profile.name = document.getElementById('cfgName').value;
  DATA.profile.bodyweight = parseFloat(document.getElementById('cfgWeight').value)||0;
  DATA.profile.calorieGoal = parseInt(document.getElementById('cfgKcal').value)||0;
  DATA.profile.proteinGoal = parseInt(document.getElementById('cfgProt').value)||0;
  DATA.profile.carbGoal = parseInt(document.getElementById('cfgCarb').value)||0;
  DATA.profile.fatGoal = parseInt(document.getElementById('cfgFat').value)||0;
  DATA.profile.waterGoal = parseFloat(document.getElementById('cfgWater').value)||0;
  DATA.profile.weeklyGoal = document.getElementById('cfgWeeklyGoal').value;
  save(); renderTop(); toast('Perfil actualizado en el almacenamiento local.');
}

/* ---------------- RESPALDOS ---------------- */
function viewRespaldos(){
  return `<h3 class="section-title">💾 Integridad e Importación de Datos (JSON)</h3>
  <div class="card">
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:14px;">Administre la persistencia de datos mediante copias de respaldo local seguras.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn primary" onclick="exportBackup()">Exportar Datos (.json)</button>
      <label class="btn blue" style="cursor:pointer;">Importar Copia de Seguridad<input type="file" id="importFile" accept=".json" style="display:none;" onchange="importBackup(event)"></label>
      <button class="btn ghost" style="color:var(--red);" onclick="resetAll()">Purgar Sistema</button>
    </div>
  </div>`;
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'MLAB_DATA_MASTER_'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Copia JSON generada con éxito.');
}
function importBackup(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      DATA = imported; save();
      toast('Restauración completada.');
      renderTop(); renderView(currentView);
    }catch(e){ toast('Error interno: Estructura JSON corrupta.'); }
  };
  reader.readAsText(file);
}
function resetAll(){
  openModal(`<h4>Purga y Formateo Total de Fábrica</h4>
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:18px;">Esta acción destruirá irreversiblemente el almacenamiento de LocalStorage. ¿Proceder?</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn" onclick="closeModal()">Abortar</button>
      <button class="btn primary" onclick="doReset()">Confirmar Destrucción</button>
    </div>`);
}
function doReset(){
  DATA = defaultData(); save(); closeModal();
  renderTop(); renderView('inicio'); goTo('inicio');
  toast('Datos restablecidos de fábrica.');
}

function bindView(view){
  if(view==='rutina'){
    document.querySelectorAll('#dayTabs .tab').forEach(t=>{
      t.addEventListener('click', ()=>{
        rutinaActiveDay = t.dataset.day;
        document.querySelectorAll('#dayTabs .tab').forEach(x=>x.classList.toggle('active', x===t));
        document.getElementById('dayContent').innerHTML = renderDayContent(rutinaActiveDay,false);
      });
    });
  }
  if(view==='hoy'){
    const btn = document.getElementById('completeDayBtn');
    if(btn) btn.addEventListener('click', markDayComplete);
  }
  if(view==='progresion'){
    const sel = document.getElementById('progExSelect');
    if(sel){ sel.addEventListener('change', renderProgChart); renderProgChart(); }
  }
}

function init(){
  load();
  buildNav();
  renderTop();
  goTo('inicio');
  setTimeout(()=>document.getElementById('splash').classList.add('hide'), 1200);
}
init();
</script>
</body>
</html>
