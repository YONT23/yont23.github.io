<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedad.html - Control de Novedades Académicas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ==========================================================================
           1. VARIABLES Y DISEÑO BASE (PALETA DE COLORES Y RESPONSIVE)
           ========================================================================== */
        :root {
            --azul-pastel: #A7D8F5;
            --azul-medio: #6BB6E8;
            --azul-oscuro: #3F8FC6;
            --azul-profundo: #1E5F8A;
            --blanco: #FFFFFF;
            --gris-claro: #F5F7FA;
            --gris-borde: #E2E8F0;
            --texto-oscuro: #2D3748;
            --texto-mutado: #718096;
            --rojo-error: #E53E3E;
            --rojo-suave: #FED7D7;
            --verde-exito: #38A169;
            --verde-suave: #C6F6D5;
            --radio-bordes: 12px;
            --sombra-suave: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --sombra-media: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transicion: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--gris-claro);
            color: var(--texto-oscuro);
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ==========================================================================
           2. COMPONENTES DE INTERFAZ (TARJETAS Y BOTONES)
           ========================================================================== */
        .card {
            background: var(--blanco);
            border-radius: var(--radio-bordes);
            box-shadow: var(--sombra-suave);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--gris-borde);
            transition: var(--transicion);
        }

        .card:hover {
            box-shadow: var(--sombra-media);
        }

        h1, h2, h3 {
            color: var(--azul-profundo);
            font-weight: 600;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--azul-pastel);
            padding-bottom: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radio-bordes);
            border: none;
            cursor: pointer;
            transition: var(--transicion);
            text-decoration: none;
            min-height: 48px;
        }

        .btn-primary {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
        }

        .btn-primary:hover {
            background-color: var(--azul-profundo);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--azul-pastel);
            color: var(--azul-profundo);
        }

        .btn-secondary:hover {
            background-color: var(--azul-medio);
        }

        .btn-danger {
            background-color: var(--rojo-suave);
            color: var(--rojo-error);
        }

        .btn-danger:hover {
            background-color: var(--rojo-error);
            color: var(--blanco);
        }

        .btn-success {
            background-color: #48BB78;
            color: var(--blanco);
        }

        .btn-success:hover {
            background-color: #2F855A;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
            min-height: 32px;
            border-radius: 6px;
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--texto-oscuro);
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gris-borde);
            border-radius: 8px;
            font-size: 1rem;
            background-color: var(--blanco);
            transition: var(--transicion);
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: var(--azul-oscuro);
            box-shadow: 0 0 0 3px rgba(107, 182, 232, 0.3);
        }

        /* ==========================================================================
           3. ENCABEZADO Y MODAL DE DOCENTE
           ========================================================================== */
        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px 0;
            background: linear-gradient(135deg, var(--azul-oscuro), var(--azul-profundo));
            color: var(--blanco);
            border-radius: var(--radio-bordes);
            box-shadow: var(--sombra-suave);
        }

        header h1 {
            color: var(--blanco);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .grid-header {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .docente-display-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--gris-claro);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--gris-borde);
        }

        .docente-name {
            font-weight: 700;
            color: var(--azul-profundo);
            font-size: 1.1rem;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--blanco);
            padding: 24px;
            border-radius: var(--radio-bordes);
            max-width: 450px;
            width: 100%;
            box-shadow: var(--sombra-media);
            animation: slideUp 0.3s ease;
        }

        /* ==========================================================================
           4. FORMULARIO DE REGISTRO Y CHECKLIST
           ========================================================================== */
        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: var(--gris-claro);
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: var(--transicion);
            border: 1px solid transparent;
        }

        .checklist-item:hover {
            background: var(--azul-pastel);
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--azul-oscuro);
        }

        .checklist-item.checked {
            background-color: rgba(107, 182, 232, 0.2);
            border-color: var(--azul-medio);
        }

        /* ==========================================================================
           5. TABLA DE REGISTROS Y CONTROLES
           ========================================================================== */
        .table-controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .table-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 4px 2px;
        }

        .badge-count {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            padding: 4px 10px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: var(--radio-bordes);
            border: 1px solid var(--gris-borde);
            background: var(--blanco);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background-color: rgba(167, 216, 245, 0.4);
            color: var(--azul-profundo);
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 2px solid var(--azul-pastel);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--gris-borde);
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) {
            background-color: rgba(245, 247, 250, 0.6);
        }

        .obs-tag {
            display: inline-block;
            background: var(--gris-claro);
            border: 1px solid var(--gris-borde);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 2px;
            color: var(--texto-oscuro);
        }

        .actions-cell {
            display: flex;
            gap: 6px;
        }

        .no-records {
            text-align: center;
            padding: 40px 20px;
            color: var(--texto-mutado);
            font-style: italic;
        }

        /* ==========================================================================
           6. ACCIONES GLOBALES Y PANEL DE EXPORTACIÓN
           ========================================================================== */
        .actions-panel {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        /* ==========================================================================
           7. SISTEMA DE ALERTAS (TOASTS) Y LOADERS
           ========================================================================== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            max-width: 400px;
            margin: 0 auto;
            z-index: 2000;
        }

        @media (min-width: 576px) {
            .toast-container { left: auto; right: 20px; width: 100%; }
        }

        .toast {
            background: var(--blanco);
            border-left: 5px solid var(--azul-oscuro);
            padding: 16px;
            border-radius: 6px;
            box-shadow: var(--sombra-media);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.3s ease-out forwards;
        }

        .toast.success { border-left-color: var(--verde-exito); background-color: #F0FFF4; }
        .toast.error { border-left-color: var(--rojo-error); background-color: #FFF5F5; }

        .loader-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--azul-pastel);
            border-top: 5px solid var(--azul-oscuro);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ==========================================================================
           8. RESPONSIVE MEDIA QUERIES
           ========================================================================== */
        @media (min-width: 576px) {
            .grid-header { grid-template-columns: 1fr 1fr; }
            .grid-header .form-group-full { grid-column: span 2; }
            .table-controls { grid-template-columns: 2fr 1fr 1fr; }
            .actions-panel { grid-template-columns: repeat(2, 1fr); }
            .actions-panel .btn-full { grid-column: span 2; }
        }

        @media (min-width: 768px) {
            body { padding: 40px 20px; }
            .actions-panel { grid-template-columns: repeat(4, 1fr); }
            .actions-panel .btn-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Control de Novedades</h1>
            <p>Registro de Inasistencias y Cumplimiento Académico</p>
        </header>

        <section class="card">
            <h2 class="section-title">Datos del Período Semanal</h2>
            <div class="grid-header">
                <div class="form-group form-group-full">
                    <label>Docente Responsable</label>
                    <div class="docente-display-container">
                        <span id="txt-docente-nombre" class="docente-name">No configurado</span>
                        <button type="button" class="btn btn-secondary btn-sm" id="btn-cambiar-docente">Cambiar docente</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="fecha-desde">Fecha Desde</label>
                    <input type="date" id="fecha-desde">
                </div>
                <div class="form-group">
                    <label for="fecha-hasta">Fecha Hasta</label>
                    <input type="date" id="fecha-hasta">
                </div>
            </div>
        </section>

        <section class="card">
            <h2 class="section-title">Registrar Estudiante con Novedad</h2>
            <form id="form-estudiante" onsubmit="event.preventDefault();">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px;">
                    <div class="form-group">
                        <label for="estudiante-grado">Grado / Curso</label>
                        <select id="estudiante-grado">
                            <option value="Transición">Transición</option>
                            <option value="Primero">Primero</option>
                            <option value="Segundo">Segundo</option>
                            <option value="Tercero">Tercero</option>
                            <option value="Cuarto">Cuarto</option>
                            <option value="Quinto">Quinto</option>
                            <option value="Sexto">Sexto</option>
                            <option value="Séptimo">Séptimo</option>
                            <option value="Octavo">Octavo</option>
                            <option value="Noveno">Noveno</option>
                            <option value="Décimo">Décimo</option>
                            <option value="Once">Once</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="estudiante-nombre">Nombre Completo del Estudiante</label>
                        <input type="text" id="estudiante-nombre" placeholder="Ej. Juan Pérez">
                    </div>
                </div>

                <label>Novedades Presentadas (Checklist)</label>
                <div class="checklist-grid">
                    <label class="checklist-item" id="lbl-check-tareas">
                        <input type="checkbox" value="No tareas" class="chk-novedad" data-lbl="lbl-check-tareas">
                        <span>No tareas</span>
                    </label>
                    <label class="checklist-item" id="lbl-check-escribe">
                        <input type="checkbox" value="No escribe" class="chk-novedad" data-lbl="lbl-check-escribe">
                        <span>No escribe</span>
                    </label>
                    <label class="checklist-item" id="lbl-check-clases">
                        <input type="checkbox" value="No clases" class="chk-novedad" data-lbl="lbl-check-clases">
                        <span>No clases</span>
                    </label>
                    <label class="checklist-item" id="lbl-check-actividades">
                        <input type="checkbox" value="No actividades" class="chk-novedad" data-lbl="lbl-check-actividades">
                        <span>No actividades</span>
                    </label>
                    <label class="checklist-item" id="lbl-check-plataformas">
                        <input type="checkbox" value="No plataformas" class="chk-novedad" data-lbl="lbl-check-plataformas">
                        <span>No plataformas</span>
                    </label>
                    <label class="checklist-item" id="lbl-check-talleres">
                        <input type="checkbox" value="No talleres" class="chk-novedad" data-lbl="lbl-check-talleres">
                        <span>No talleres</span>
                    </label>
                    <label class="checklist-item" id="lbl-check-asiste">
                        <input type="checkbox" value="No asiste" class="chk-novedad" data-lbl="lbl-check-asiste">
                        <span>No asiste</span>
                    </label>
                </div>

                <input type="hidden" id="edit-index" value="-1">
                <button type="button" class="btn btn-primary" id="btn-agregar-estudiante" style="width: 100%;">Agregar estudiante</button>
            </form>
        </section>

        <section class="card">
            <h2 class="section-title">Registros de la Semana</h2>
            
            <div class="table-summary">
                <div>Estudiantes Registrados: <span id="total-badge" class="badge-count">0</span></div>
            </div>

            <div class="table-controls">
                <input type="text" id="search-nombre" placeholder="🔍 Buscar por nombre...">
                
                <select id="filter-grado">
                    <option value="Todos">🔍 Todos los grados</option>
                    <option value="Transición">Transición</option>
                    <option value="Primero">Primer
